  ctx.stroke();

  let ly = y + 46;
  const line = (label, value, color, gap) => {
    ctx.textAlign = 'left';
    ctx.font = '10px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#6e8393';
    ctx.fillText(label, x + 12, ly);
    ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = color || '#dfe9f1';
    ctx.fillText(value, x + 76, ly);
    ly += gap || 20;
  };

  line('当前意图', intent + '　' + (b.reason || ''), icolor);

  line('锁定目标', tg
    ? (ENEMY_TYPES[tg.type].name + '　距 ' + Math.round(Math.abs(tg.x - b.x)) + 'px　剩 ' + Math.round(tg.hp) + 'HP')
    : '（视野内无敌人）', tg ? '#ffd7a3' : '#7d8c99');

  line('弹药武器', WEAPONS[b.weapon].name + (b.reloading > 0 ? '　装填中' : '　' + b.mags[b.weapon] + ' 发'),
    b.reloading > 0 ? '#ffb347' : '#dfe9f1');

  line('弹道预警', threat.count > 0
    ? ('⚠ ' + threat.count + ' 发正对着我（' + threat.minT.toFixed(2) + 's）')
    : '无来袭弹道', threat.count > 0 ? '#ff6b5a' : '#6f8a7d');

  line('本关战绩', '命中 ' + acc + '%　伤害 ' + Math.round(t.buddyDmg) + '　击杀 ' + t.buddyKills,
    acc >= 45 ? '#7ef0b0' : '#dfe9f1');

  /* 决策日志 */
  ctx.textAlign = 'left';
  ctx.font = '10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#5d7183';
  ctx.fillText('决策日志  躲弹 ' + t.dodges + ' 次 · 手雷 ' + t.grenades + ' 颗', x + 12, ly - 3);
  ly += 14;

  for (let i = 0; i < logs.length; i++) {
    const e = logs[i];
    ctx.textAlign = 'left';
    ctx.font = '10px Consolas,monospace';
    ctx.fillStyle = '#4f6272';
    ctx.fillText(e.t.toFixed(1) + 's', x + 12, ly);
    ctx.font = '11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = i === logs.length - 1 ? '#c8d6e0' : '#7e90a0';
    ctx.fillText(e.text.length > 26 ? e.text.slice(0, 26) + '…' : e.text, x + 56, ly);
    ly += 17;
  }
}

/* --- 通用遮罩 --- */
function overlay(alpha) {
  ctx.fillStyle = 'rgba(6,10,14,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
}

function drawTitle() {
  drawBackground();
  overlay(0.62);

  ctx.textAlign = 'center';
  ctx.font = 'bold 76px "Microsoft YaHei",sans-serif';
  const g = ctx.createLinearGradient(0, 120, 0, 200);
  g.addColorStop(0, '#ffd98a');
  g.addColorStop(1, '#e07b3a');
  ctx.fillStyle = g;
  ctx.fillText('战 火 英 雄', W / 2, 190);
  ctx.font = 'bold 20px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#9fb4c4';
  ctx.fillText('双人闯关 · 你 + 八哥 AI 战友', W / 2, 228);

  const lines = [
    ['移动', 'A / D  或  ← →'],
    ['跳跃', '空格 / W'],
    ['瞄准射击', '鼠标瞄准 · 左键开火'],
    ['换枪', '1 步枪  2 霰弹  3 机枪  4 狙击  5 火箭'],
    ['蹲下 / 精瞄', 'S 蹲下 · 按住右键精确瞄准'],
    ['换弹 / 冲刺 / 手雷', 'R / Shift / G'],
    ['救队友', '靠近按住 E'],
    ['指挥八哥', 'C 跟随   V 突击   B 守点'],
    ['八哥性格 / 面板', 'Q 轮换性格 · Tab 战术面板'],
    ['暂停', 'P 或 Esc']
  ];
  ctx.font = '16px "Microsoft YaHei",sans-serif';
  for (let i = 0; i < lines.length; i++) {
    const y = 284 + i * 28;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8fa6b6';
    ctx.fillText(lines[i][0], W / 2 - 24, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e8f0f6';
    ctx.fillText(lines[i][1], W / 2 + 24, y);
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 22px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = (Math.floor(game.time * 1.6) % 2 === 0) ? '#ffd166' : 'rgba(255,209,102,0.35)';
  ctx.fillText('点击画面 / 按 Enter 开始', W / 2, H - 96);
  ctx.font = '13px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#6e8393';
  ctx.fillText('八哥全自动作战：跟人、躲子弹、挑武器、血少后退、顺路捡补给、你倒了他会冲过来救', W / 2, H - 62);
}

function drawCenterCard(title, titleColor, sub, tip) {
  overlay(0.6);
  ctx.fillStyle = 'rgba(12,18,24,0.9)';
  roundRect(W / 2 - 280, H / 2 - 140, 560, 280, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,120,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 44px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = titleColor;
  ctx.fillText(title, W / 2, H / 2 - 60);

  ctx.font = '17px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#cfdbe4';
  ctx.fillText(sub, W / 2, H / 2 - 10);

  ctx.font = 'bold 18px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = (Math.floor(game.time * 1.6) % 2 === 0) ? '#ffd166' : 'rgba(255,209,102,0.35)';
  ctx.fillText(tip, W / 2, H / 2 + 90);
}

function render() {
  if (game.state === 'title') { drawTitle(); return; }
  if (!player) { drawBackground(); return; }

  ctx.save();
  const sh = camera.shake;
  if (sh > 0.2) ctx.translate(rand(-sh, sh), rand(-sh, sh) * 0.7);

  /* 世界层：整体缩放（震屏之后再缩放，保证抖动幅度一致） */
  ctx.translate(0, CAM_TY);
  ctx.scale(VIEW_ZOOM, VIEW_ZOOM);

  drawBackground();
  drawPlatforms();
  drawProps();
  drawCovers();
  drawBlocks();
  drawFire();          /* 火焰地带贴地画，必须压在士兵脚下 */
  drawPickups();
  drawGrenades();

  for (const e of enemies) drawEnemy(e);
  if (buddy) drawSoldier(buddy, true);
  if (player) drawSoldier(player, false);

  drawBullets();
  drawEffects();
  drawDecals();
  ctx.restore();

  drawThemeGrade();
  drawVignette();

  drawHUD();
  drawBossBar();
  if (game.state !== 'title') drawAIPanel();
  drawBossIntro();
  drawScreenFlash();

  if (game.state === 'playing') drawCrosshair();
  if (game.state === 'paused') {
    overlay(0.5);
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('已暂停', W / 2, H / 2);
    ctx.font = '18px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#b8c8d4';
    ctx.fillText('按 P 或 Esc 继续', W / 2, H / 2 + 44);
  }
  if (game.state === 'stageclear') {
    const nt = STAGE_THEMES[game.stage % STAGE_THEMES.length];
    drawCenterCard('第 ' + game.stage + ' 关 完成', '#7ef0b0',
      '本关击杀 ' + game.kills + '   总得分 ' + game.score,
      '按 Enter 进入第 ' + (game.stage + 1) + ' 关 · ' + (nt ? nt.name : '下一战区'));
  }
  if (game.state === 'gameover') {
    drawCenterCard('任务失败', '#ff6b6b',
      '你在第 ' + game.stage + ' 关第 ' + Math.max(1, game.wave) + ' 波倒下，八哥没能赶上',
      '按 Enter 重新挑战本关');
  }
}

/* ---------------- 主循环 ---------------- */
let _last = performance.now();
/* 渲染层也需要知道这一帧过了多久（血条平滑、横幅计时都要用） */
let _dt = 0;

function frame(ts) {
  let dt = (ts - _last) / 1000;
  _last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  _dt = dt;

  if (game.state === 'playing') {
    update(dt);
  } else {
    game.time += dt;
    sayCooldown = Math.max(0, sayCooldown - dt);
    if (game.state !== 'title') updateEffects(dt);

    /* BOSS 击破的慢动作 / 白闪 / 入场横幅在结算卡片上必须继续走完，
       否则玩家在 stageclear 界面会看到一片永久残留的白屏。 */
    if (game.slowmo > 0) game.slowmo = Math.max(0, game.slowmo - dt);
    game.screenFlash = Math.max(0, (game.screenFlash || 0) - dt * 1.5);
    if (game.bossIntro) {
      game.bossIntro.t += dt;
      if (game.bossIntro.t >= game.bossIntro.dur) game.bossIntro = null;
    }
  }

  render();
  requestAnimationFrame(frame);
}

resizeCanvas();
requestAnimationFrame(frame);


</script>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode') || 'hit';
  var log = [];

  startStage(1);
  game.state = 'playing';
  game.waveDelay = 999;          /* 别让波次自己刷人打乱画面 */
  game.spawnQueue.length = 0;

  var E = null;

  /* ---------------- 场景一：三个部位各吃一发 ----------------
     同一把枪、同一距离，只有落点高度不同：头 / 躯干 / 腿。
     数字大小是这套系统唯一的「说明书」。 */
  if (mode === 'hit') {
    player.x = 300;
    player.y = world.groundY;
    player.vy = 0;
    player.onGround = true;
    player.aim = 0;

    var spots = [470, 640, 760];
    var fracs = [0.11, 0.42, 0.85];
    E = [];
    for (var i = 0; i < spots.length; i++) {
      spawnEnemyAt('grunt', { x: spots[i], y: world.groundY }, 1);
      var e = enemies[enemies.length - 1];
      e.x = spots[i];
      e.y = world.groundY;
      e.vx = 0; e.vy = 0;
      e.hp = 4000; e.maxHp = 4000;       /* 别让他死，数字才是重点 */
      e.aim = Math.PI;
      E.push(e);
    }

    camera.x = 610 - VIEW_W / 2;

    /* 每颗子弹就从自己目标的左前方 56px 出发 —— 排成一条直线的话，
       三发都会被最前面那个兵吃掉，数字就分不出来了。 */
    for (var j = 0; j < E.length; j++) {
      var t = E[j];
      var hy = t.y - t.h + t.h * fracs[j];
      spawnBullet(t.x - 56, hy, 1500, 0, 20, 'ally', '#ffd166', 3.2, 'player',
        { ignorePlat: player.plat });
    }

    /* 跑到子弹全部结算完（每颗只走 200 多像素，十几帧足够） */
    var step = 1 / 60;
    for (var k = 0; k < 16 && bullets.length; k++) updateBullets(step);
    for (var m = 0; m < 6; m++) update(step);

    log.push('头 ' + Math.round(4000 - E[0].hp) + ' 躯干 ' + Math.round(4000 - E[1].hp) +
      ' 腿 ' + Math.round(4000 - E[2].hp));
  }

  /* ---------------- 场景二：空中平台挡子弹 ----------------
     从下往上、从左边平射，全部撞在台阶的实心梁上。 */
  if (mode === 'plat') {
    player.x = 430;
    player.y = world.groundY;
    player.vy = 0;
    player.onGround = true;
    player.aim = -Math.PI / 2;

    camera.x = 470 - VIEW_W / 2;

    var step2 = 1 / 60;
    var fired = 0;

    /* 仰射钢板台（x 300~496，顶面 y=476，厚 20） */
    for (var a = 0; a < 5; a++) {
      spawnBullet(340 + a * 38, world.groundY - 20, 0, -1100, 20, 'ally', '#ffd166', 3.2, 'player',
        { ignorePlat: player.plat });
      fired++;
    }
    /* 侧射混凝土台（x 552~728，顶面 y=384，厚 26），打左缘 */
    for (var b = 0; b < 3; b++) {
      spawnBullet(500, 390 + b * 7, 1400, 0, 20, 'ally', '#ffd166', 3.2, 'player',
        { ignorePlat: player.plat });
      fired++;
    }

    for (var s = 0; s < 20 && bullets.length; s++) updateBullets(step2);
    log.push('射出 ' + fired + ' 发 剩余 ' + bullets.length + ' 发 粒子 ' + particles.length);

    /* 白热闪光只有 0.09 秒，定格帧必须紧跟在命中后面 */
    for (var n = 0; n < 2; n++) update(step2);
  }

  /* 先把画面画出来，再定格 —— 顺序反了就只剩一块黑板 */
  for (var r = 0; r < 3; r++) render();
  update = function () {};
  render = function () {};

  var dbg = document.createElement('div');
  dbg.id = 'dbg';
  dbg.style.cssText = 'position:fixed;left:2px;bottom:0;z-index:99;font:11px monospace;color:#0f0;text-shadow:0 0 3px #000';
  dbg.textContent = 'DBG mode=' + mode + ' | ' + log.join(' | ');
  document.body.appendChild(dbg);
})();
</script>
</body>
</html>
