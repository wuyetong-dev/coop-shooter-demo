/* ---------------- 地面 ---------------- */
/* 地面在屏幕上只露出约 64px，渐变必须压在这个区间里，才看得到层次 */
function drawGround() {
  const gy = world.groundY;
  const vw = VIEW_W + 60;

  const g = ctx.createLinearGradient(0, gy - 2, 0, gy + 72);
  g.addColorStop(0, '#6d5a44');
  g.addColorStop(0.09, '#4d3f2f');
  g.addColorStop(0.30, '#362c22');
  g.addColorStop(0.62, '#251e17');
  g.addColorStop(1, '#14100c');
  ctx.fillStyle = g;
  ctx.fillRect(-30, gy - 2, vw, 110);

  /* 地表亮边：月光扫过土坎，把地面和角色从背景里剥出来 */
  ctx.fillStyle = 'rgba(232,210,168,0.5)';
  ctx.fillRect(-30, gy - 3, vw, 1.6);
  ctx.fillStyle = 'rgba(255,226,176,0.09)';
  ctx.fillRect(-30, gy - 1.4, vw, 5);
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(-30, gy + 3.4, vw, 2.6);

  /* 土层横纹（跟着世界滚动，有压实土的感觉） */
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const ly = gy + 16 + i * 19;
    ctx.strokeStyle = 'rgba(0,0,0,' + (0.20 - i * 0.05) + ')';
    ctx.beginPath();
    ctx.moveTo(-30, ly);
    for (let x = 0; x < vw; x += 42) {
      const wx = camera.x + x;
      ctx.lineTo(x, ly + Math.sin((wx + i * 210) * 0.011) * 2.2);
    }
    ctx.stroke();
  }

  /* 碎石：顶端带一点高光，看起来是有体积的石子而不是色点 */
  for (const r of groundRocks) {
    const x = r.x - camera.x;
    if (x < -20 || x > vw + 20) continue;
    const y = gy + 5 + r.d * 54;
    ctx.globalAlpha = r.a * (1 - r.d * 0.45);
    ctx.fillStyle = '#cbb797';
    ctx.fillRect(x, y, r.r * 1.6, r.r * 0.85);
    ctx.fillStyle = 'rgba(255,238,205,0.5)';
    ctx.fillRect(x, y, r.r * 1.6, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y + r.r * 0.85, r.r * 1.6, 1.2);
  }
  ctx.globalAlpha = 1;

  /* 草簇 / 枯草 */
  for (const t of grassTufts) {
    const x = t.x - camera.x;
    if (x < -20 || x > vw + 20) continue;
    ctx.globalAlpha = t.a;
    ctx.strokeStyle = '#63744a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, gy - 1);
    ctx.quadraticCurveTo(x + t.lean * 0.4, gy - t.h * 0.6, x + t.lean, gy - t.h);
    ctx.moveTo(x + 3, gy - 1);
    ctx.quadraticCurveTo(x + 4 + t.lean * 0.3, gy - t.h * 0.5, x + 6 + t.lean, gy - t.h * 0.8);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(160,175,120,' + (t.a * 0.5) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, gy - 1);
    ctx.quadraticCurveTo(x + t.lean * 0.4, gy - t.h * 0.6, x + t.lean, gy - t.h);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* 地面裂纹（确定性哈希，滚动不闪） */
  ctx.strokeStyle = 'rgba(0,0,0,0.34)';
  ctx.lineWidth = 1.2;
  for (let k = 0; k < 26; k++) {
    const seed = (k * 137) % 997;
    const wx = (seed * 3.1) % 3400;
    const x = wx - (camera.x % 3400);
    const xx = x < -60 ? x + 3400 : x;
    if (xx < -60 || xx > vw + 60) continue;
    const y = gy + 7 + ((seed * 7) % 44);
    const len = 9 + (seed % 17);
    ctx.beginPath();
    ctx.moveTo(xx, y);
    ctx.lineTo(xx + len * 0.55, y + 3);
    ctx.lineTo(xx + len, y - 1.5);
    ctx.stroke();
  }

  /* 地面碎石堆：贴着地表线的深色石块，顶面接一点月光 */
  const st = Math.floor(camera.x / 96) * 96;
  for (let wx = st - 96; wx < camera.x + VIEW_W + 96; wx += 96) {
    const s = ((wx * 2654435761) >>> 0) % 1000 / 1000;
    const x = wx - camera.x + s * 40;
    const h = 7 + s * 13;
    ctx.fillStyle = '#191410';
    ctx.beginPath();
    ctx.moveTo(x - 26, gy + 3);
    ctx.quadraticCurveTo(x - 10, gy - h, x + 9, gy - h * 0.72);
    ctx.quadraticCurveTo(x + 24, gy - h * 0.4, x + 34, gy + 3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(168,144,108,0.22)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(x - 26, gy + 2);
    ctx.quadraticCurveTo(x - 10, gy - h, x + 9, gy - h * 0.72);
    ctx.stroke();
  }
}

/* ---------------- 平台 ---------------- */
function platformShadow(p) {
  const cx = p.x + p.w / 2;
  const gy = surfaceBelow(cx, p.y + 6);
  if (gy <= p.y + 8) return;
  const spread = clamp(p.w * 0.55, 40, 180) * (1 + (gy - p.y) / 1100);
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx - camera.x, gy - 3, spread, 7 + (gy - p.y) * 0.016, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSteelPlatform(x, p) {
  const footY = surfaceBelow(p.x + 20, p.y + p.h + 2);
  const legTop = p.y + p.h;
  const legH = Math.max(0, footY - legTop);

  /* 支撑立柱 */
  if (legH > 4) {
    ctx.fillStyle = '#1b2128';
    ctx.fillRect(x + 13, legTop, 8, legH);
    ctx.fillRect(x + p.w - 21, legTop, 8, legH);
    /* 斜撑 */
    ctx.strokeStyle = 'rgba(27,33,40,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x + 17, legTop + 2);
    ctx.lineTo(x + p.w - 17, legTop + Math.min(52, legH));
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(x + 13, legTop, 2, legH);
  }

  /* 主梁 */
  const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
  g.addColorStop(0, '#5b6874');
  g.addColorStop(0.18, '#414d58');
  g.addColorStop(0.75, '#2b343c');
  g.addColorStop(1, '#1a2127');
  ctx.fillStyle = g;
  ctx.fillRect(x, p.y, p.w, p.h);

  /* 顶面高光 */
  ctx.fillStyle = 'rgba(180,200,215,0.55)';
  ctx.fillRect(x, p.y, p.w, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x, p.y + p.h - 3, p.w, 3);

  /* 黄黑警示条 */
  ctx.save();
  ctx.beginPath(); ctx.rect(x, p.y + 5, p.w, 5); ctx.clip();
  ctx.fillStyle = '#b89334';
  ctx.fillRect(x, p.y + 5, p.w, 5);
  ctx.fillStyle = '#1c2126';
  for (let i = -8; i < p.w + 8; i += 16) {
    ctx.beginPath();
    ctx.moveTo(x + i, p.y + 10);
    ctx.lineTo(x + i + 7, p.y + 5);
    ctx.lineTo(x + i + 14, p.y + 5);
    ctx.lineTo(x + i + 7, p.y + 10);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* 铆钉 */
  ctx.fillStyle = 'rgba(190,205,220,0.4)';
  for (let i = 9; i < p.w - 4; i += 21) {
    ctx.beginPath(); ctx.arc(x + i, p.y + p.h - 6, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  /* 护栏 */
  if (p.rail) {
    ctx.strokeStyle = '#252d35';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 3, p.y - 30); ctx.lineTo(x + p.w - 3, p.y - 30);
    ctx.moveTo(x + 3, p.y - 16); ctx.lineTo(x + p.w - 3, p.y - 16);
    ctx.stroke();
    ctx.lineWidth = 3;
    for (let i = 3; i < p.w - 3; i += 26) {
      ctx.beginPath();
      ctx.moveTo(x + i, p.y - 32);
      ctx.lineTo(x + i, p.y);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(200,215,230,0.18)';
    ctx.fillRect(x + 3, p.y - 31, p.w - 6, 1);
  }
}

function drawConcretePlatform(x, p) {
  /* 混凝土：冷灰调，带水渍、裂纹、破口与露筋 */
  const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
  g.addColorStop(0, '#8d959b');
  g.addColorStop(0.14, '#737b82');
  g.addColorStop(0.55, '#565e65');
  g.addColorStop(0.88, '#3c4349');
  g.addColorStop(1, '#2b3136');
  ctx.fillStyle = g;
  ctx.fillRect(x, p.y, p.w, p.h);

  /* 顶面：受天光，最亮 */
  ctx.fillStyle = 'rgba(206,218,228,0.75)';
  ctx.fillRect(x, p.y, p.w, 2);
  ctx.fillStyle = 'rgba(120,134,146,0.5)';
  ctx.fillRect(x, p.y + 2, p.w, 1);

  /* 水渍 / 污痕（竖向淡淡的不规则条） */
  for (let i = 6; i < p.w - 6; i += 23) {
    const hh = 4 + ((i * 5 + p.x) % 9);
    ctx.fillStyle = 'rgba(24,28,32,' + (0.10 + ((i * 3) % 5) * 0.02) + ')';
    ctx.fillRect(x + i, p.y + 3, 3, Math.min(hh, p.h - 4));
  }

  /* 底部破损：不规则掉块 */
  ctx.fillStyle = '#1e2327';
  ctx.beginPath();
  ctx.moveTo(x, p.y + p.h);
  let bx = 0;
  while (bx < p.w) {
    const k = ((bx * 13 + p.x * 7) | 0) % 5;
    const d = k === 0 ? p.h * 0.42 : (k === 1 ? 4 : 1);
    ctx.lineTo(x + bx, p.y + p.h - d);
    bx += 9 + (k * 3);
    ctx.lineTo(x + Math.min(bx, p.w), p.y + p.h - (k === 0 ? p.h * 0.3 : 2));
  }
  ctx.lineTo(x + p.w, p.y + p.h);
  ctx.closePath();
  ctx.fill();

  /* 不规则裂缝：每段折线随机偏移 */
  ctx.strokeStyle = 'rgba(18,22,26,0.6)';
  ctx.lineWidth = 1.4;
  for (let i = 16; i < p.w - 10; i += 44) {
    ctx.beginPath();
    ctx.moveTo(x + i, p.y + 2);
    let cy2 = p.y + 2;
    let cxx = x + i;
    for (let s = 0; s < 3; s++) {
      cxx += ((i * 7 + s * 11) % 9) - 4;
      cy2 += p.h * 0.28;
      ctx.lineTo(cxx, cy2);
    }
    ctx.stroke();
  }

  /* 钢筋 */
  ctx.strokeStyle = 'rgba(146,96,66,0.75)';
  ctx.lineWidth = 1.8;
  for (let i = 22; i < p.w - 16; i += 58) {
    ctx.beginPath();
    ctx.moveTo(x + i, p.y + p.h - 2);
    ctx.lineTo(x + i + 5, p.y + p.h + 4);
    ctx.lineTo(x + i + 11, p.y + p.h + 7);
    ctx.stroke();
  }

  /* 侧面阴影收边 */
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fillRect(x, p.y + 3, 2.5, p.h - 3);
  ctx.fillRect(x + p.w - 2.5, p.y + 3, 2.5, p.h - 3);
}

function drawCratePlatform(x, p) {
  /* 木箱/集装箱平台 */
  const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
  g.addColorStop(0, '#8a6c45');
  g.addColorStop(0.2, '#6d5335');
  g.addColorStop(1, '#3f2f1e');
  ctx.fillStyle = g;
  ctx.fillRect(x, p.y, p.w, p.h);

  /* 木板竖纹 */
  ctx.strokeStyle = 'rgba(30,20,12,0.4)';
  ctx.lineWidth = 1;
  for (let i = 12; i < p.w; i += 17) {
    ctx.beginPath();
    ctx.moveTo(x + i, p.y + 2);
    ctx.lineTo(x + i, p.y + p.h - 2);
    ctx.stroke();
  }

  /* 铁包角 */
  ctx.fillStyle = '#4e5862';
  ctx.fillRect(x, p.y, 10, p.h);
  ctx.fillRect(x + p.w - 10, p.y, 10, p.h);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x, p.y, 10, 2);
  ctx.fillRect(x + p.w - 10, p.y, 10, 2);

  /* 顶部铁皮 */
  ctx.fillStyle = 'rgba(200,180,140,0.5)';
  ctx.fillRect(x, p.y, p.w, 2);

  /* 护栏 */
  if (p.rail) {
    ctx.strokeStyle = '#33261a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 4, p.y - 28); ctx.lineTo(x + p.w - 4, p.y - 28);
    ctx.stroke();
    for (let i = 5; i < p.w - 4; i += 30) {
      ctx.beginPath();
      ctx.moveTo(x + i, p.y - 29);
      ctx.lineTo(x + i, p.y);
      ctx.stroke();
    }
  }
}

function drawPlatforms() {
  drawGround();

  for (const p of world.platforms) {
    if (p.ground) continue;
    if (p.x - camera.x > VIEW_W + 160 || p.x + p.w - camera.x < -160) continue;
    platformShadow(p);
  }

  for (const p of world.platforms) {
    if (p.ground) continue;
    const x = p.x - camera.x;
    if (x > VIEW_W + 160 || x + p.w < -160) continue;
    if (p.mat === 'crate') drawCratePlatform(x, p);
    else if (p.mat === 'concrete') drawConcretePlatform(x, p);
    else drawSteelPlatform(x, p);
  }
}

/* ---------------- 沙袋掩体 ---------------- */
function drawCovers() {
  for (const c of world.covers) {
    const x = c.x - camera.x;
    if (x > VIEW_W + 130 || x + c.w < -130) continue;

    if (c.hp <= 0) {
      ctx.fillStyle = 'rgba(110,94,66,0.55)';
      ctx.fillRect(x + 4, c.y - 10, c.w - 8, 10);
      ctx.fillStyle = 'rgba(150,130,92,0.35)';
      ctx.fillRect(x + 14, c.y - 16, 18, 7);
      continue;
    }

    const dmg = 1 - c.hp / c.maxHp;
    const hitFlash = c.hit > 0 ? 0.5 : 0;
    const rows = 3, perRow = 4;
    const badW = c.w / perRow, badH = c.h / rows;

    for (let r = 0; r < rows; r++) {
      const offset = (r % 2) * (badW * 0.5);
      for (let i = -1; i < perRow + 1; i++) {
        const bx = x + i * badW + offset;
        if (bx + badW < x - 4 || bx > x + c.w + 4) continue;
        /* 被打坏的沙袋缺失 */
        if (dmg > 0.55 && ((i * 3 + r * 5) % 7) < 2) continue;

        const by = c.y - (r + 1) * badH;
        const w = badW - 2, h = badH - 1.5;
        const shade = 0.72 + (r * 0.06) + (i % 2) * 0.04 - dmg * 0.18;

        ctx.fillStyle = 'rgb(' + Math.round(150 * shade) + ',' + Math.round(132 * shade) + ',' + Math.round(95 * shade) + ')';
        roundRect(bx, by, w, h, 4);
        ctx.fill();
        /* 顶部亮边 */
        ctx.fillStyle = 'rgba(226,210,172,' + (0.28 + hitFlash * 0.3) + ')';
        roundRect(bx + 1, by + 1, w - 2, 3, 2);
        ctx.fill();
        /* 缝线 */
        ctx.strokeStyle = 'rgba(70,58,38,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + w * 0.5, by + 3);
        ctx.lineTo(bx + w * 0.5, by + h - 2);
        ctx.stroke();
      }
    }
    /* 受损提示 */
    if (dmg > 0.35) {
      ctx.strokeStyle = 'rgba(255,120,70,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + c.w * 0.3, c.y - c.h);
      ctx.lineTo(x + c.w * 0.42, c.y - c.h * 0.5);
      ctx.stroke();
    }
  }
}

/* ---------------- 实体障碍 ----------------
   木箱 / 油桶 / 混凝土路障 / 集装箱：挡人、挡弹、能站上去
   -------------------------------------------- */
function drawBlocks() {
  for (const b of world.blocks) {
    const x = b.x - camera.x;
    if (x > W + 200 || x + b.w < -200) continue;

    /* 落地阴影 */
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(x + b.w / 2, b.y + b.h + 3, b.w * 0.55, Math.min(10, b.h * 0.2), 0, 0, Math.PI * 2);
    ctx.fill();

    if (b.hp <= 0) { drawBlockDebris(x, b); continue; }

    const flash = b.hit > 0 ? Math.min(1, b.hit / 0.14) * 0.45 : 0;
    if (b.kind === 'crate') drawCrateBlock(x, b, flash);
    else if (b.kind === 'barrel') drawBarrelBlock(x, b, flash);
    else if (b.kind === 'container') drawContainerBlock(x, b, flash);
    else if (b.kind === 'rubblewall') drawRubbleWall(x, b, flash);
    else if (b.kind === 'wire') drawWire(x, b, flash);
    else drawBarrierBlock(x, b, flash);
  }
}

/* 半塌砖墙：一整面硬掩体，顶缘参差、砖缝透光、底部堆着掉下来的碎砖 */
function drawRubbleWall(x, b, flash) {
  const w = b.w, h = b.h, top = b.y;
  const seed = (b.x | 0) * 0.017;

  /* 墙体本体 */
  const g = ctx.createLinearGradient(0, top, 0, top + h);
  g.addColorStop(0, '#5d5951');
  g.addColorStop(0.5, '#4a463f');
  g.addColorStop(1, '#332f2a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x, top + h);
  ctx.lineTo(x, top + 7);
  /* 顶缘：随机齿状的塌口 */
  const steps = Math.max(3, Math.round(w / 16));
  for (let i = 0; i <= steps; i++) {
    const px = x + (w * i) / steps;
    const py = top + 4 + Math.sin(seed + i * 2.3) * 3 + (hash01(seed * 13 + i) * 8);
    ctx.lineTo(px, py);
  }
  ctx.lineTo(x + w, top + h);
  ctx.closePath();
  ctx.fill();

  /* 砖缝：错缝排列的半透暗线 */
  ctx.strokeStyle = 'rgba(20,17,14,0.34)';
  ctx.lineWidth = 1;
  for (let ry = top + 15, row = 0; ry < top + h - 4; ry += 11, row++) {
    ctx.beginPath();
    ctx.moveTo(x + 1, ry);
    ctx.lineTo(x + w - 1, ry);
    ctx.stroke();
    for (let cx2 = x + (row % 2 ? 7 : 16); cx2 < x + w - 4; cx2 += 21) {
      ctx.beginPath();
      ctx.moveTo(cx2, ry);
      ctx.lineTo(cx2, ry + 11);
      ctx.stroke();
    }
  }

  /* 透光的弹孔 */
  for (let i = 0; i < 4; i++) {
    const hx = x + 10 + hash01(seed * 7 + i) * (w - 20);
    const hy = top + 14 + hash01(seed * 11 + i) * (h - 26);
    ctx.fillStyle = 'rgba(255,180,110,0.16)';
    ctx.beginPath(); ctx.arc(hx, hy, 1.8 + hash01(i + seed) * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(hx + 1, hy + 1, 1.4, 0, Math.PI * 2); ctx.fill();
  }

  /* 顶部受光边 + 掉下来的碎砖 */
  ctx.fillStyle = 'rgba(190,186,170,0.18)';
  ctx.fillRect(x, top + 5, w, 1.6);
  for (let i = 0; i < 5; i++) {
    const dx2 = x + hash01(seed * 3 + i * 5) * w;
    const dy2 = top + h - 2 - hash01(seed * 5 + i) * 5;
    const dw = 6 + hash01(i + seed * 2) * 7;
    ctx.fillStyle = i % 2 ? '#575349' : '#66615540';
    ctx.fillRect(dx2, dy2, dw, 4);
  }

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')';
    ctx.fillRect(x, top, w, h);
  }
}

/* 铁丝网：两根立柱拉起的菱形网格，后面能看见、但子弹和人都过不去 */
function drawWire(x, b, flash) {
  const w = b.w, h = b.h, top = b.y;
  const px1 = x + 3, px2 = x + w - 3;

  /* 立柱 */
  ctx.fillStyle = '#3a3d40';
  ctx.fillRect(px1 - 2.5, top - 4, 5, h + 4);
  ctx.fillRect(px2 - 2.5, top - 4, 5, h + 4);
  ctx.fillStyle = 'rgba(180,190,200,0.16)';
  ctx.fillRect(px1 - 2.5, top - 4, 1.6, h + 4);
  ctx.fillRect(px2 - 2.5, top - 4, 1.6, h + 4);

  /* 菱形网：先横后斜，细线 + 极低透明度，读起来是「网」不是「墙」 */
  ctx.strokeStyle = 'rgba(196,206,214,0.30)';
  ctx.lineWidth = 1;
  const span = px2 - px1;
  ctx.beginPath();
  for (let i = 0; i <= 12; i++) {
    const yy = top + (h * i) / 12;
    ctx.moveTo(px1, yy);
    ctx.lineTo(px2, yy);
  }
  for (let i = -h; i < span + h; i += 14) {
    ctx.moveTo(px1 + i, top);
    ctx.lineTo(px1 + i + h, top + h);
    ctx.moveTo(px1 + i, top);
    ctx.lineTo(px1 + i - h, top + h);
  }
  ctx.stroke();

  /* 顶上一道带刺的横杆 */
  ctx.strokeStyle = 'rgba(150,158,166,0.55)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(px1 - 3, top - 3); ctx.lineTo(px2 + 3, top - 3); ctx.stroke();
  for (let cx2 = px1 - 2; cx2 < px2 + 3; cx2 += 6) {
    ctx.beginPath();
    ctx.moveTo(cx2, top - 5); ctx.lineTo(cx2 + 3, top - 1);
    ctx.stroke();
  }

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(x, top, w, h);
  }
}

/* 被打爆之后的残骸 */
function drawBlockDebris(x, b) {
  const cx = x + b.w / 2, by = b.y + b.h;
  if (b.kind === 'barrel') {
    /* 油桶：只留焦痕和几片铁皮 */
    ctx.fillStyle = 'rgba(10,8,6,0.5)';
    ctx.beginPath();
    ctx.ellipse(cx, by - 2, b.w * 0.85, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,44,34,0.9)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const ox = (i - 1) * 13;
      ctx.save();
      ctx.translate(cx + ox, by - 3);
      ctx.rotate((hash01(i + b.x | 0) - 0.5) * 1.4);
      ctx.beginPath();
      ctx.moveTo(-7, 0); ctx.lineTo(7, -2);
      ctx.stroke();
      ctx.restore();
    }
    return;
  }
  /* 木箱：散落的木板 */
  for (let i = 0; i < 5; i++) {
    const ox = (hash01(i * 7 + (b.x | 0)) - 0.5) * b.w * 1.1;
    const oy = -2 - hash01(i * 3 + 5) * 7;
    ctx.save();
    ctx.translate(cx + ox, by + oy);
    ctx.rotate((hash01(i * 11 + 2) - 0.5) * 0.9);
    ctx.fillStyle = i % 2 ? '#5a432a' : '#6b5132';
    ctx.fillRect(-11, -3, 22, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(-11, 1, 22, 2);
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(12,9,6,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx, by - 1, b.w * 0.7, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

/* 木箱：木板 + 铁包角 + 军用印字 */
function drawCrateBlock(x, b, flash) {
  const w = b.w, h = b.h, dmg = 1 - b.hp / b.maxHp;
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + h);
  g.addColorStop(0, '#8a6a44');
  g.addColorStop(0.45, '#775934');
  g.addColorStop(1, '#4b3720');
  ctx.fillStyle = g;
  ctx.fillRect(x, b.y, w, h);

  /* 木板缝 */
  ctx.strokeStyle = 'rgba(36,24,13,0.52)';
  ctx.lineWidth = 1.3;
  for (let i = 1; i < 4; i++) {
    const yy = b.y + (h / 4) * i;
    ctx.beginPath();
    ctx.moveTo(x + 1, yy);
    ctx.lineTo(x + w - 1, yy);
    ctx.stroke();
  }
  /* 木纹：几条不规则弧线，避免死板 */
  ctx.strokeStyle = 'rgba(124,94,58,0.32)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const yy = b.y + 7 + i * (h - 14) / 5;
    ctx.beginPath();
    ctx.moveTo(x + 5, yy);
    ctx.bezierCurveTo(x + w * 0.32, yy - 2.2, x + w * 0.66, yy + 2.2, x + w - 5, yy);
    ctx.stroke();
  }

  /* 铁包角 */
  const s = Math.min(12, w * 0.19);
  const corners = [[0, 0], [w - s, 0], [0, h - s], [w - s, h - s]];
  for (let i = 0; i < 4; i++) {
    const ox = corners[i][0], oy = corners[i][1];
    ctx.fillStyle = '#3b3e42';
    ctx.fillRect(x + ox, b.y + oy, s, s);
    ctx.fillStyle = 'rgba(190,196,204,0.16)';
    ctx.fillRect(x + ox, b.y + oy, s, 1.6);
    /* 铆钉 */
    ctx.fillStyle = 'rgba(200,206,214,0.34)';
    ctx.beginPath();
    ctx.arc(x + ox + s * 0.5, b.y + oy + s * 0.5, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 军需印字 */
  if (w > 44) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#e8dcc0';
    ctx.font = 'bold 8px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('军需', x + w / 2, b.y + h * 0.56);
    ctx.fillRect(x + w * 0.24, b.y + h * 0.62, w * 0.52, 1.4);
    ctx.restore();
  }

  /* 顶面高光 */
  ctx.fillStyle = 'rgba(226,200,158,0.22)';
  ctx.fillRect(x, b.y, w, 2.6);

  /* 裂纹 */
  if (dmg > 0.25) {
    ctx.strokeStyle = 'rgba(18,11,5,' + (0.28 + dmg * 0.5).toFixed(2) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.28, b.y + 2);
    ctx.lineTo(x + w * 0.42, b.y + h * 0.42);
    ctx.lineTo(x + w * 0.33, b.y + h * 0.72);
    ctx.lineTo(x + w * 0.5, b.y + h);
    ctx.stroke();
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,238,196,' + flash.toFixed(2) + ')';
    ctx.fillRect(x, b.y, w, h);
  }
}

/* 油桶：锈红桶身 + 双箍 + 警示标 */
function drawBarrelBlock(x, b, flash) {
  const w = b.w, h = b.h, dmg = 1 - b.hp / b.maxHp;
  const cx = x + w / 2;

  const rg = ctx.createLinearGradient(x, 0, x + w, 0);
  rg.addColorStop(0, '#4e2419');
  rg.addColorStop(0.26, '#a0432c');
  rg.addColorStop(0.58, '#8c3826');
  rg.addColorStop(1, '#46211a');
  ctx.fillStyle = rg;
  ctx.fillRect(x, b.y + 4, w, h - 4);

  /* 顶盖 */
  ctx.fillStyle = '#6f3120';
  ctx.beginPath();
  ctx.ellipse(cx, b.y + 4.5, w / 2, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#9c452c';
  ctx.beginPath();
  ctx.ellipse(cx, b.y + 3.6, w / 2 - 3.2, 3.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,180,0.14)';
  ctx.beginPath();
  ctx.ellipse(cx - 3, b.y + 3, 6, 1.6, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 两道箍 */
  for (let i = 0; i < 2; i++) {
    const yy = b.y + h * (0.3 + i * 0.38);
    ctx.fillStyle = 'rgba(26,15,10,0.5)';
    ctx.fillRect(x, yy, w, 3.6);
    ctx.fillStyle = 'rgba(226,170,116,0.2)';
    ctx.fillRect(x, yy, w, 1.1);
  }

  /* 侧面高光 + 背光边 */
  ctx.fillStyle = 'rgba(255,196,150,0.1)';
  ctx.fillRect(x + w * 0.16, b.y + 6, 3.4, h - 10);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x + w * 0.84, b.y + 6, w * 0.16, h - 10);

  /* 警示标：黑黄斜纹块 */
  const wy = b.y + h * 0.5;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x + 5, wy - 7, w - 10, 14);
  ctx.clip();
  ctx.fillStyle = '#d8b13c';
  ctx.fillRect(x + 5, wy - 7, w - 10, 14);
  ctx.fillStyle = '#1c1710';
  for (let i = -1; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(x + 5 + i * 8, wy + 7);
    ctx.lineTo(x + 5 + i * 8 + 4, wy + 7);
    ctx.lineTo(x + 5 + i * 8 + 11, wy - 7);
    ctx.lineTo(x + 5 + i * 8 + 7, wy - 7);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* 凹陷 / 漏液 */
  if (dmg > 0.35) {
    ctx.strokeStyle = 'rgba(30,16,10,0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(x + w * 0.62, b.y + h * 0.22, 6, 0.4, 2.9);
    ctx.stroke();
    ctx.fillStyle = 'rgba(16,12,8,' + (0.18 + dmg * 0.3).toFixed(2) + ')';
    ctx.fillRect(x + w * 0.1, b.y + h - 12, w * 0.3, 12);
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,190,140,' + flash.toFixed(2) + ')';
    ctx.fillRect(x, b.y, w, h);
  }
}

/* 混凝土路障：梯形台身 + 黄黑警示条 + 反光片 */
function drawBarrierBlock(x, b, flash) {
  const w = b.w, h = b.h;
  const base = b.y + h, top = b.y, inset = w * 0.1;

  ctx.beginPath();
  ctx.moveTo(x + inset, top);
  ctx.lineTo(x + w - inset, top);
  ctx.lineTo(x + w, base);
  ctx.lineTo(x, base);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, top, 0, base);
  g.addColorStop(0, '#8e8b81');
  g.addColorStop(0.55, '#6f6c63');
  g.addColorStop(1, '#4a483f');
  ctx.fillStyle = g;
  ctx.fill();

  /* 顶面窄亮边 */
  ctx.fillStyle = 'rgba(206,202,190,0.4)';
  ctx.fillRect(x + inset, top, w - inset * 2, 2.4);

  /* 黄黑警示条 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(x + inset + 2, top + 6, w - inset * 2 - 4, 9);
  ctx.clip();
  ctx.fillStyle = '#d8b13c';
  ctx.fillRect(x, top + 6, w, 9);
  ctx.fillStyle = '#221d14';
  for (let i = -1; i < 22; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * 11, top + 15);
    ctx.lineTo(x + i * 11 + 5, top + 15);
    ctx.lineTo(x + i * 11 + 14, top + 6);
    ctx.lineTo(x + i * 11 + 9, top + 6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* 底部脏污 + 反光片 */
  ctx.fillStyle = 'rgba(26,22,16,0.3)';
  ctx.fillRect(x + 3, base - 5, w - 6, 5);
  ctx.fillStyle = 'rgba(255,120,60,0.34)';
  ctx.fillRect(x + w * 0.18, top + h * 0.55, 5, 4);
  ctx.fillRect(x + w * 0.78, top + h * 0.55, 5, 4);

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,244,214,' + (flash * 0.8).toFixed(2) + ')';
    ctx.fillRect(x, top, w, h);
  }
}

/* 集装箱：竖向波纹铁皮 + 锈迹 + 门闩 */
function drawContainerBlock(x, b, flash) {
  const w = b.w, h = b.h;
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + h);
  g.addColorStop(0, '#3f5560');
  g.addColorStop(0.4, '#34474f');
  g.addColorStop(1, '#1f2c31');
  ctx.fillStyle = g;
  ctx.fillRect(x, b.y, w, h);

  /* 波纹：每 9px 一条，用明暗两笔 */
  for (let i = 0; i < w; i += 9) {
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.fillRect(x + i, b.y + 3, 3, h - 6);
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(x + i + 4.5, b.y + 3, 2, h - 6);
  }

  /* 顶部与底部的加强梁 */
  ctx.fillStyle = 'rgba(150,170,180,0.16)';
  ctx.fillRect(x, b.y, w, 4);
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.fillRect(x, b.y + h - 6, w, 6);

  /* 右侧双开门 + 门闩 */
  const dx = x + w - 46;
  ctx.strokeStyle = 'rgba(12,18,20,0.6)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(dx, b.y + 4);
  ctx.lineTo(dx, b.y + h - 6);
  ctx.moveTo(dx + 23, b.y + 4);
  ctx.lineTo(dx + 23, b.y + h - 6);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(176,150,96,0.6)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(dx - 7, b.y + 12);
  ctx.lineTo(dx - 7, b.y + h - 16);
  ctx.moveTo(dx + 32, b.y + 12);
  ctx.lineTo(dx + 32, b.y + h - 16);
  ctx.stroke();

  /* 锈迹：从顶部往下拖 */
  for (let i = 0; i < 5; i++) {
    const rx = x + 12 + hash01(i * 13 + (b.x | 0)) * (w - 30);
    const rh = 10 + hash01(i * 7 + 3) * 34;
    const rg2 = ctx.createLinearGradient(0, b.y + 4, 0, b.y + 4 + rh);
    rg2.addColorStop(0, 'rgba(126,72,38,0.34)');
    rg2.addColorStop(1, 'rgba(126,72,38,0)');
    ctx.fillStyle = rg2;
    ctx.fillRect(rx, b.y + 4, 2.4 + hash01(i + 9) * 3, rh);
  }

  /* 编号喷漆 */
  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#e6dfc8';
  ctx.font = 'bold 11px Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillText('CT-' + (100 + Math.floor(hash01((b.x | 0) + 1) * 899)), x + 12, b.y + h * 0.55);
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(210,230,255,' + (flash * 0.7).toFixed(2) + ')';
    ctx.fillRect(x, b.y, w, h);
  }
}

/* ---------------- 场景装饰 ---------------- */
function drawProps() {
  for (const pr of world.props) {
    const x = pr.x - camera.x;
    if (x < -120 || x > W + 120) continue;
    const sd = pr.seed || 1;
    if (pr.kind === 'barrel') {
      ctx.fillStyle = '#4a3a24';
      ctx.fillRect(x, pr.y - 44, 26, 44);
      ctx.fillStyle = '#5c492c';
      ctx.fillRect(x, pr.y - 44, 26, 5);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(x, pr.y - 26, 26, 4);
      ctx.fillRect(x, pr.y - 12, 26, 4);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(x + 3, pr.y - 42, 3, 40);
    } else if (pr.kind === 'crate') {
      ctx.fillStyle = '#5b452c';
      ctx.fillRect(x, pr.y - 30, 34, 30);
      ctx.strokeStyle = 'rgba(24,16,10,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 2, pr.y - 28); ctx.lineTo(x + 32, pr.y - 2);
      ctx.moveTo(x + 32, pr.y - 28); ctx.lineTo(x + 2, pr.y - 2);
      ctx.stroke();
      ctx.strokeRect(x + 1, pr.y - 29, 32, 28);
    } else if (pr.kind === 'rubble') {
      /* 碎石堆：几块大小不一的混凝土块 + 钢筋，纯装饰不挡人 */
      const n = 3 + (sd % 3);
      for (let i = 0; i < n; i++) {
        const ox = (hash01(sd * 7 + i * 5) - 0.5) * 34;
        const sz = 5 + hash01(sd * 11 + i * 3) * 8;
        const oy = -sz * 0.5 - hash01(sd * 3 + i) * 3;
        ctx.fillStyle = i % 2 ? '#585349' : '#6a655a';
        ctx.beginPath();
        ctx.moveTo(x + ox, pr.y + oy);
        ctx.lineTo(x + ox + sz, pr.y + oy - sz * 0.5);
        ctx.lineTo(x + ox + sz * 1.1, pr.y + oy + sz * 0.4);
        ctx.lineTo(x + ox + sz * 0.2, pr.y + oy + sz * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(190,184,170,0.16)';
        ctx.fillRect(x + ox + 1, pr.y + oy - sz * 0.4, sz * 0.7, 1.2);
      }
      ctx.strokeStyle = 'rgba(96,74,54,0.7)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - 8, pr.y - 2);
      ctx.lineTo(x + 2, pr.y - 9);
      ctx.lineTo(x + 12, pr.y - 4);
      ctx.stroke();
    } else {
      /* 路灯：弯臂 + 灯泡，投下暖光 */
      const hgt = 150;
      ctx.strokeStyle = '#22282e';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x, pr.y);
      ctx.lineTo(x, pr.y - hgt);
      ctx.quadraticCurveTo(x, pr.y - hgt - 16, x + 26, pr.y - hgt - 16);
      ctx.stroke();
      const lx = x + 26, ly = pr.y - hgt - 12;
      const lg = ctx.createRadialGradient(lx, ly, 2, lx, ly, 130);
      lg.addColorStop(0, 'rgba(255,214,140,0.42)');
      lg.addColorStop(0.4, 'rgba(255,190,110,0.10)');
      lg.addColorStop(1, 'rgba(255,170,80,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(lx, ly, 130, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd98a';
      ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ---------------- 地面痕迹 ---------------- */
function drawDecals() {
  for (const d of decals) {
    const x = d.x - camera.x;
    if (x < -40 || x > W + 40) continue;
    const a = clamp(d.life / d.max, 0, 1);
    if (d.kind === 'hole') {
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = '#0c0a08';
      ctx.beginPath(); ctx.arc(x, d.y + 3, d.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = '#b8a88c';
      ctx.beginPath(); ctx.arc(x, d.y + 3, d.r * 2.1, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = a * 0.42;
      ctx.fillStyle = '#7d1f1f';
      ctx.beginPath();
      ctx.ellipse(x, d.y + 2, d.r * 1.5, d.r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------- 主题调色 ----------------
   三关共用一套夜景素材，靠这一层把冷蓝（街区）/ 焦橙（废墟）/ 青绿（指挥部）
   分开。用 overlay 混合只推色相不动亮度，角色颜色不会被洗掉。
   ---------------------------------------------------- */
function drawThemeGrade() {
  const th = world.theme;
  if (!th || !th.grade) return;
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = th.grade;
  ctx.fillRect(0, 0, W, H);

  /* 顶部再压一点同色雾，把地平线以上统一色调 */
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.62);
  const base = th.grade.replace(/[\d.]+\)$/, '');
  g.addColorStop(0, base + '0.10)');
  g.addColorStop(1, base + '0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.62);
  ctx.restore();
}

/* ---------------- 暗角 ---------------- */
function drawVignette() {
  const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.42, W * 0.5, H * 0.5, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawDowned(a) {
  const x = a.x - camera.x, y = a.y;

  /* 血泊 */
  ctx.fillStyle = 'rgba(110,24,24,0.42)';
  ctx.beginPath(); ctx.ellipse(x + 6, y + 1, 40, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 30, 6, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-1.42);

  /* 腿（弯曲） */
  ctx.strokeStyle = '#232a31';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -2);
  ctx.lineTo(15, -6);
  ctx.lineTo(26, -2);
  ctx.stroke();

  /* 躯干 */
  ctx.fillStyle = a.bodyColor;
  roundRect(-10, -30, 20, 32, 5);
  ctx.fill();
  ctx.fillStyle = a.trim;
  ctx.fillRect(-10, -20, 20, 7);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(-4, -26, 8, 6);

  /* 手臂摊开 */
  ctx.strokeStyle = a.bodyColor;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(0, -27);
  ctx.lineTo(16, -33);
  ctx.stroke();

  /* 头 */
  ctx.fillStyle = a.skin;
  ctx.beginPath(); ctx.arc(0, -36, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = a.trim;
  ctx.beginPath(); ctx.arc(0, -39, 10.5, Math.PI, 0); ctx.fill();
  ctx.fillRect(-11, -40, 22, 3);
  ctx.restore();

  /* 呼救波纹 */
  const pulse = 0.5 + 0.5 * Math.sin(game.time * 4);
  ctx.strokeStyle = 'rgba(255,110,110,' + (0.16 + pulse * 0.22) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y - 18, 30 + pulse * 12, 0, Math.PI * 2);
  ctx.stroke();

  const total = a.kind === 'player' ? 2.2 : 2.0;
  if (a.reviveProgress > 0.02) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(x - 33, y - 68, 66, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#7ef0b0';
    roundRect(x - 31, y - 66, 62 * clamp(a.reviveProgress / total, 0, 1), 6, 3);
    ctx.fill();
  }
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText('倒地 ' + Math.ceil(a.downTimer) + 's', x, y - 76);
}

/* ---------------- 士兵 ---------------- */
function tone(hex, k) {
  const v = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((v >> 16) & 255) * k));
  const g = Math.min(255, Math.round(((v >> 8) & 255) * k));
  const b = Math.min(255, Math.round((v & 255) * k));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

/* 一条腿：大腿 / 小腿 / 护膝 / 军靴 */
function drawLeg(hipX, hipY, swing, knee, thick, pants, bootCol, kneeCol) {
  const TH = 13, SH = 15;
  const kx = hipX + Math.sin(swing) * TH;
  const ky = hipY + Math.cos(swing) * TH;
  const fa = swing - knee;
  const fx = kx + Math.sin(fa) * SH;
  const fy = ky + Math.cos(fa) * SH;

  seg(hipX, hipY, kx, ky, thick, pants);
  seg(kx, ky, fx, fy, thick * 0.88, tone(pants, 0.84));

  ctx.fillStyle = kneeCol;
  ctx.beginPath();
  ctx.arc(kx, ky, thick * 0.56, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath();
  ctx.arc(kx - 1.4, ky - 1.4, thick * 0.24, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(fa * 0.5);
  ctx.fillStyle = bootCol;
  roundRect(-6.5, -3, 14.5, 9, 3);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  roundRect(-5, -2.2, 12, 3, 1.5);
  ctx.fill();
  ctx.restore();
}

function drawSoldier(a, isBuddy) {
  if (a.dead) return;
  if (a.downed) { drawDowned(a); return; }

  const h = a.h, sx = a.x - camera.x;
  const facing = Math.cos(a.aim) >= 0 ? 1 : -1;
  const sq = clamp(a.landSquash || 0, 0, 1);

  /* 承托面阴影：离地越高越淡越小 */
  const under = surfaceBelow(a.x, a.y);
  const gap = clamp((under - a.y) / 190, 0, 1);
  const sk = 1 - gap * 0.68;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.42 * sk).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(sx + facing * 2, under + 1, 16 * sk, 4.6 * sk, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 冲刺残影 */
  if ((a.dashTime || 0) > 0) {
    const dir = Math.sign(a.vx) || facing;
    for (let i = 3; i >= 1; i--) {
      ctx.globalAlpha = 0.10 * i;
      ctx.fillStyle = a.bodyColor;
      roundRect(sx - dir * i * 9 - 8, a.y - h * 0.86, 16, h * 0.78, 6);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* 受击无敌闪烁 */
  const blink = a.invuln > 0 && Math.floor(a.invuln * 18) % 2 === 0;

  ctx.save();
  ctx.translate(sx, a.y);
  ctx.scale(1 + sq * 0.11, 1 - sq * 0.15);
  if (blink) ctx.globalAlpha = 0.5;

  const uniform = a.bodyColor;
  const uniformDark = tone(uniform, 0.74);
  const uniformDeep = tone(uniform, 0.54);
  const gear = '#2b323a';
  const gearLight = '#3c454f';
  const bootCol = '#191d22';
  const metal = '#39424b';
  const metalHi = '#59646f';

  const moving = a.onGround && Math.abs(a.vx) > 28;
  const ph = a.anim;
  /* 蹲下：胯/肩整体下沉 17px（碰撞盒 58→41），膝盖深弯把脚留在地面 */
  const cq = a.crouch || 0;
  const drop = 17 * cq;
  const hipY = -34 + drop;
  const shY = -46.5 + drop;

  let swA, knA, swB, knB;
  if (!a.onGround) {
    swA = 0.44; knA = 0.92;
    swB = -0.42; knB = 0.26;
  } else if (moving) {
    swA = Math.sin(ph) * 0.52;
    swB = Math.sin(ph + Math.PI) * 0.52;
    knA = Math.max(0, Math.sin(ph + 2.1)) * 0.6;
    knB = Math.max(0, Math.sin(ph + Math.PI + 2.1)) * 0.6;
  } else {
    swA = -0.05; knA = 0.09;
    swB = 0.07; knB = 0.09;
  }
  if (cq > 0.02) {
    /* 脚钉在地面，前脚略前、后脚略后 —— 膝盖自然往前顶 */
    const fF = legIK(3 * facing, hipY, 3 * facing + 11 * facing, 0.5);
    const fB = legIK(-3 * facing, hipY, -3 * facing - 9 * facing, 0.5);
    swA = lerp(swA, fF.swing, cq); knA = lerp(knA, fF.knee, cq);
    swB = lerp(swB, fB.swing, cq); knB = lerp(knB, fB.knee, cq);
  }

  /* ---- 后腿 ---- */
  drawLeg(-3 * facing, hipY, swB, knB, 8.6, uniformDeep, '#14171b', gear);
  /* ---- 前腿 ---- */
  drawLeg(3 * facing, hipY, swA, knA, 9.2, uniformDark, bootCol, gearLight);

  /* ---- 背包 ---- */
  const bpL = facing > 0 ? -15.5 : 4.5;
  ctx.fillStyle = tone(uniform, 0.6);
  roundRect(bpL, shY + 2, 11, 19, 4);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  roundRect(bpL + 1.5, shY + 12, 8, 7, 2.5);
  ctx.fill();
  /* 背包卷毯 */
  ctx.fillStyle = tone(uniform, 0.78);
  roundRect(bpL - 0.5, shY - 0.5, 12, 4, 2);
  ctx.fill();

  /* ---- 躯干 ---- */
  ctx.fillStyle = uniform;
  roundRect(-9, shY - 1, 18, 15, 4);
  ctx.fill();
  /* 战术背心 */
  ctx.fillStyle = tone(uniform, 0.9);
  roundRect(-7.6, shY + 1.5, 15.2, 11, 3);
  ctx.fill();
  /* 背心板缝 */
  ctx.strokeStyle = 'rgba(0,0,0,0.30)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-7.6, shY + 6.5); ctx.lineTo(7.6, shY + 6.5);
  ctx.stroke();
  /* 弹匣包 */
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = gear;
    roundRect(-6.2 + i * 4.5, shY + 7.6, 3.8, 4.6, 1.4);
    ctx.fill();
  }
  /* 肩带 */
  ctx.fillStyle = uniformDeep;
  ctx.fillRect(-6.6, shY + 0.4, 2.6, 11);
  ctx.fillRect(4, shY + 0.4, 2.6, 11);
  /* 腰带 */
  ctx.fillStyle = gear;
  ctx.fillRect(-9, shY + 12.2, 18, 3.2);
  ctx.fillStyle = metalHi;
  ctx.fillRect(-2, shY + 12.2, 4, 3.2);
  /* 前缘暖色轮廓光（来自地平线余晖） */
  ctx.fillStyle = 'rgba(255,198,132,0.13)';
  ctx.fillRect(facing > 0 ? 7.2 : -9, shY, 1.8, 13);
  /* 顶部冷光 */
  ctx.fillStyle = 'rgba(180,214,255,0.10)';
  roundRect(-9, shY - 1, 18, 3, 2);
  ctx.fill();
  /* 肩章 */
  ctx.fillStyle = tone(uniform, 1.18);
  ctx.beginPath();
  ctx.arc(facing * 6.4, shY + 1.6, 3.4, 0, Math.PI * 2);
  ctx.fill();

  /* ---- 头部（蹲下时整组跟着沉，脑袋前倾一点像在瞄） ---- */
  ctx.save();
  ctx.translate(cq * 1.6, drop);
  ctx.fillStyle = tone(a.skin, 0.7);
  ctx.fillRect(-3, -52, 6, 5);
  ctx.fillStyle = a.skin;
  ctx.beginPath();
  ctx.arc(0, -53.4, 6.8, 0, Math.PI * 2);
  ctx.fill();
  /* 下颌阴影 */
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath();
  ctx.arc(0, -52.2, 6.4, 0.15, Math.PI - 0.15);
  ctx.fill();
  /* 护目镜 */
  ctx.fillStyle = '#0f1418';
  roundRect(-6.4 + facing * 1.2, -56.6, 12.8, 4.2, 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(140,206,255,0.30)';
  roundRect(-5.4 + facing * 1.2, -56.1, 5, 1.5, 0.7);
  ctx.fill();
  /* 头盔 */
  ctx.fillStyle = tone(uniform, 0.86);
  ctx.beginPath();
  ctx.arc(0, -54.4, 8.6, Math.PI * 0.99, Math.PI * 2.01);
  ctx.fill();
  ctx.fillRect(-8.6, -55.2, 17.2, 3.2);
  /* 头盔前沿 */
  ctx.fillStyle = tone(uniform, 0.68);
  roundRect(facing > 0 ? 2 : -10.5, -56.6, 8.5, 2.4, 1);
  ctx.fill();
  /* 头盔高光 */
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath();
  ctx.arc(-2.4, -57.4, 5.2, Math.PI * 1.06, Math.PI * 1.62);
  ctx.fill();
  /* 帽带 */
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-6.6, -53.6);
  ctx.lineTo(-5.4, -51.2);
  ctx.stroke();
  ctx.restore();

  /* ---- 武器与手臂 ---- */
  ctx.save();
  ctx.translate(0, shY + 3);
  ctx.rotate(a.aim);
  if (facing < 0) ctx.scale(1, -1);

  const kick = Math.min(1, (a.muzzle || 0) * 12);
  ctx.translate(-kick * 1.6, 0);

  /* 后手（握把） */
  seg(0, 1.5, 8, 5, 7, uniformDeep);

  /* 枪托 + 机匣 */
  ctx.fillStyle = '#20262c';
  roundRect(-9, 0.5, 11, 6.5, 2);
  ctx.fill();
  ctx.fillStyle = '#2c343b';
  roundRect(-1, -2.4, 21, 7.2, 2);
  ctx.fill();
  /* 上导轨与瞄具 */
  ctx.fillStyle = metal;
  ctx.fillRect(2, -4.4, 13, 2);
  ctx.fillStyle = '#161c21';
  roundRect(5.5, -8.2, 7, 4, 1.2);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,200,255,0.35)';
  ctx.fillRect(6.4, -7.4, 5.2, 1.4);
  /* 弹匣 */
  ctx.fillStyle = '#262d34';
  ctx.beginPath();
  ctx.moveTo(7, 4.4);
  ctx.lineTo(15.4, 4.4);
  ctx.lineTo(17.2, 13.6);
  ctx.lineTo(9.6, 14.4);
  ctx.closePath();
  ctx.fill();
  /* 枪管 */
  const bgr = ctx.createLinearGradient(18, -1.4, 18, 2.2);
  bgr.addColorStop(0, metalHi);
  bgr.addColorStop(1, '#22282e');
  ctx.fillStyle = bgr;
  ctx.fillRect(18, -1.4, 15, 3.4);
  ctx.fillStyle = '#1a2026';
  ctx.fillRect(32.5, -2, 5, 4.6);
  /* 前握把 */
  ctx.fillStyle = '#242b31';
  roundRect(22, 1.8, 4, 7.5, 1.5);
  ctx.fill();

  /* 前手 */
  seg(1.5, -2, 24, 3.6, 7, uniform);
  ctx.fillStyle = a.skin;
  ctx.beginPath();
  ctx.arc(24, 4, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(9, 5.4, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.arc(24, 4.6, 1.6, 0, Math.PI * 2);
  ctx.fill();

  /* 枪口焰 */
  if ((a.muzzle || 0) > 0) {
    const mg = ctx.createRadialGradient(38, 0, 1, 38, 0, 24);
    mg.addColorStop(0, 'rgba(255,248,214,0.95)');
    mg.addColorStop(0.35, 'rgba(255,186,72,0.55)');
    mg.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(38, 0, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,190,0.9)';
    ctx.beginPath();
    ctx.moveTo(37, 0);
    ctx.lineTo(46, -3.2);
    ctx.lineTo(43, 0);
    ctx.lineTo(46, 3.2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* 受击红闪 */
  if (a.flash > 0) {
    ctx.globalAlpha = Math.min(0.34, a.flash * 2.2);
    ctx.fillStyle = '#ff6a4a';
    roundRect(-10, -63, 20, 64, 6);
    ctx.fill();
    ctx.globalAlpha = blink ? 0.5 : 1;
  }

  ctx.restore();

  if (!isBuddy) return;

  /* ---- 八哥标识 ---- */
  const topY = a.y - h - 12;
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffb257';
  ctx.fillText('八哥', sx, topY - 4);

  const bw = 46, ratio = clamp(a.hp / a.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(sx - bw / 2 - 1, topY - 1, bw + 2, 7, 3);
  ctx.fill();
  ctx.fillStyle = ratio > 0.5 ? '#5fd98a' : (ratio > 0.25 ? '#ffc857' : '#ff6b5a');
  roundRect(sx - bw / 2, topY, bw * ratio, 5, 2.5);
  ctx.fill();

  if (a.bubbleTimer > 0 && a.bubble) {
    ctx.font = '13px "Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(a.bubble).width;
    const bx = sx - tw / 2 - 10;
    const by = a.y - h - 66;
    ctx.globalAlpha = Math.min(1, a.bubbleTimer * 2);
    ctx.fillStyle = 'rgba(16,22,28,0.94)';
    ctx.strokeStyle = 'rgba(255,178,87,0.75)';
    ctx.lineWidth = 1.5;
    roundRect(bx, by, tw + 20, 26, 8);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx - 6, by + 26);
    ctx.lineTo(sx, by + 34);
    ctx.lineTo(sx + 6, by + 26);
    ctx.fillStyle = 'rgba(16,22,28,0.94)';
    ctx.fill();
    ctx.fillStyle = '#ffd7a3';
    ctx.textAlign = 'center';
    ctx.fillText(a.bubble, sx, by + 18);
    ctx.globalAlpha = 1;
  }
}


/* ===== render2.js ===== */
'use strict';

/* ==================================================================
   渲染层 2：敌兵 / 子弹 / 手雷 / 掉落 / 粒子
   ================================================================== */

/* 敌兵统一按「56 高的人形」绘制，再按实际碰撞盒缩放，
   这样不同体型的敌兵与自己的受击范围完全对齐。 */
function drawEnemy(e) {
  if (e.dead) return;
  const h = e.h, w = e.w, sx = e.x - camera.x;
  if (sx < -170 || sx > W + 170) return;

  const t = ENEMY_TYPES[e.type];
  const melee = !!t.melee;
  const boss = !!e.boss;
  const facing = Math.cos(e.aim) >= 0 ? 1 : -1;

  /* 落影 */
  const under = surfaceBelow(e.x, e.y);
  const gap = clamp((under - e.y) / 190, 0, 1);
  const sk = 1 - gap * 0.68;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.4 * sk).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(sx, under + 1, w * 0.5 * sk, 4.4 * sk, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, e.y);
  /* 用「站立身高」缩放而不是当前碰撞盒，蹲下才不会整体被压扁 */
  ctx.scale(w / 30, (e.baseH || h) / 56);

  if (e.spawnGuard > 0) {
    ctx.globalAlpha = 0.28 + Math.abs(Math.sin(e.spawnGuard * 26)) * 0.5;
  }

  const body = e.color, dark = e.dark;
  const bodyMid = tone(body, 0.82);
  const gear = '#2a1d1d';
  const bootCol = '#15171a';

  const moving = e.onGround && Math.abs(e.vx) > 26;
  const ph = e.anim;
  /* 蹲下：胯、肩、头一起下沉，膝盖弯曲把脚留在地面 */
  const cq = e.crouch || 0;
  const lower = 14 * cq;
  const hipY = -33 + lower;
  const shY = -45 + lower;

  let swA, knA, swB, knB;
  if (!e.onGround) {
    swA = 0.4; knA = 0.86; swB = -0.36; knB = 0.24;
  } else if (moving) {
    swA = Math.sin(ph) * 0.5;
    swB = Math.sin(ph + Math.PI) * 0.5;
    knA = Math.max(0, Math.sin(ph + 2.1)) * 0.58;
    knB = Math.max(0, Math.sin(ph + Math.PI + 2.1)) * 0.58;
  } else {
    swA = -0.05; knA = 0.1; swB = 0.07; knB = 0.1;
  }
  if (cq > 0.02) {
    /* 和玩家同一套两段腿反解：脚钉地面，膝盖自然往前顶 */
    const fF = legIK(2.8 * facing, hipY, 2.8 * facing + 8.5 * facing, 0.4);
    const fB = legIK(-2.6 * facing, hipY, -2.6 * facing - 7 * facing, 0.4);
    swA = lerp(swA, fF.swing, cq); knA = lerp(knA, fF.knee, cq);
    swB = lerp(swB, fB.swing, cq); knB = lerp(knB, fB.knee, cq);
  }

  /* 后腿 / 前腿 */
  drawLeg(-2.6 * facing, hipY, swB, knB, 8.2, tone(dark, 0.82), '#121417', gear);
  drawLeg(2.8 * facing, hipY, swA, knA, 8.8, dark, bootCol, tone(dark, 1.25));

  /* 躯干 */
  ctx.fillStyle = body;
  roundRect(-8.5, shY - 1, 17, 15, 4);
  ctx.fill();
  /* 胸甲板 */
  ctx.fillStyle = bodyMid;
  roundRect(-7, shY + 1, 14, 10, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-7, shY + 6); ctx.lineTo(7, shY + 6);
  ctx.stroke();
  /* 腰带 */
  ctx.fillStyle = gear;
  ctx.fillRect(-8.5, shY + 11.6, 17, 3);
  /* 前缘暖光 */
  ctx.fillStyle = 'rgba(255,190,130,0.10)';
  ctx.fillRect(facing > 0 ? 6.8 : -8.6, shY, 1.7, 12);

  if (melee) {
    /* 冲锋兵：露肩皮甲 + 头巾 */
    ctx.fillStyle = tone(dark, 0.95);
    roundRect(-9.5, shY - 1.5, 7, 9, 3);
    ctx.fill();
    roundRect(2.5, shY - 1.5, 7, 9, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(-4, shY + 2, 2, 8);
  } else {
    /* 肩甲 */
    ctx.fillStyle = tone(dark, 1.1);
    ctx.beginPath();
    ctx.arc(facing * 6, shY + 1.6, boss ? 5.4 : 3.6, 0, Math.PI * 2);
    ctx.fill();
  }

  if (boss) {
    /* 队长：胸甲铆钉 + 警示红条 */
    ctx.fillStyle = '#3a1210';
    roundRect(-8, shY + 2.5, 16, 5.5, 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,90,60,0.85)';
    ctx.fillRect(-5.5, shY + 4, 11, 2.4);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = 'rgba(255,190,150,0.35)';
      ctx.fillRect(-7 + i * 3.4, shY + 1.4, 1.6, 1.6);
    }
    /* 肩刺 */
    ctx.fillStyle = '#c8d2db';
    ctx.beginPath();
    ctx.moveTo(-11, shY - 1);
    ctx.lineTo(-15.5, shY - 7);
    ctx.lineTo(-9, shY - 4);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(11, shY - 1);
    ctx.lineTo(15.5, shY - 7);
    ctx.lineTo(9, shY - 4);
    ctx.closePath();
    ctx.fill();
  }

  /* 头 */
  const headY = -52 + lower;
  ctx.fillStyle = '#d9b48a';
  ctx.beginPath();
  ctx.arc(0, headY, 6.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  ctx.arc(0, headY + 1.2, 6.2, 0.2, Math.PI - 0.2);
  ctx.fill();

  if (melee) {
    /* 红头巾 */
    ctx.fillStyle = tone(body, 0.9);
    ctx.beginPath();
    ctx.arc(0, headY - 0.6, 7.4, Math.PI * 1.02, Math.PI * 1.98);
    ctx.fill();
    ctx.fillRect(-7.4, headY - 1.6, 14.8, 2.8);
    ctx.beginPath();
    ctx.moveTo(-facing * 6, headY - 1);
    ctx.lineTo(-facing * 12, headY + 2.5);
    ctx.lineTo(-facing * 6, headY + 2);
    ctx.closePath();
    ctx.fill();
  } else {
    /* 头盔 */
    ctx.fillStyle = tone(dark, 1.05);
    ctx.beginPath();
    ctx.arc(0, headY - 1, 8.2, Math.PI * 0.99, Math.PI * 2.01);
    ctx.fill();
    ctx.fillRect(-8.2, headY - 1.8, 16.4, 3);
    ctx.fillStyle = tone(dark, 0.86);
    roundRect(facing > 0 ? 1.5 : -10, headY - 3.2, 8.5, 2.3, 1);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.arc(-2.2, headY - 3.6, 5, Math.PI * 1.06, Math.PI * 1.6);
    ctx.fill();
  }

  /*  глаз（红色光点） */
  const ex = facing * 3.4;
  ctx.fillStyle = boss ? 'rgba(255,70,40,1)' : 'rgba(255,90,70,0.92)';
  ctx.beginPath();
  ctx.arc(ex, headY - 0.6, boss ? 2 : 1.5, 0, Math.PI * 2);
  ctx.fill();
  if (boss) {
    ctx.fillStyle = 'rgba(255,60,30,0.25)';
    ctx.beginPath();
    ctx.arc(ex, headY - 0.6, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---- 武器 ---- */
  ctx.save();
  ctx.translate(0, shY + 2.5);
  const meleeSwing = melee ? Math.sin(game.time * 12) * 0.22 : 0;
  ctx.rotate(e.aim + meleeSwing);
  if (facing < 0) ctx.scale(1, -1);

  const kick = Math.min(1, (e.muzzle || 0) * 12);
  ctx.translate(-kick * 1.4, 0);

  if (melee) {
    /* 砍刀 */
    ctx.fillStyle = '#2a2018';
    roundRect(-3, -1.6, 8, 4.5, 1.5);
    ctx.fill();
    const bg = ctx.createLinearGradient(5, -4, 24, 3);
    bg.addColorStop(0, '#e6eef5');
    bg.addColorStop(0.5, '#a9b6c2');
    bg.addColorStop(1, '#7c8792');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(5, -3.4);
    ctx.lineTo(22, -4.6);
    ctx.lineTo(25, -0.4);
    ctx.lineTo(6, 2.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(6, -2.6, 15, 1);
    seg(0, 1.5, 4, 1.2, 6, tone(body, 0.7));
  } else if (e.type === 'gunner' || boss) {
    /* 重机枪 / 链式机炮 */
    const gunLen = boss ? 34 : 27;
    ctx.fillStyle = '#1d2329';
    roundRect(-6, -4, 14, 9, 2.5);
    ctx.fill();
    ctx.fillStyle = '#2b333a';
    roundRect(6, -3, gunLen, 6.5, 2);
    ctx.fill();
    /* 弹鼓 */
    ctx.fillStyle = '#232a31';
    ctx.beginPath();
    ctx.arc(2, 6, boss ? 6.5 : 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3d454e';
    ctx.beginPath();
    ctx.arc(2, 6, boss ? 3.4 : 2.6, 0, Math.PI * 2);
    ctx.fill();
    /* 旋转枪管 */
    const spin = game.time * 9;
    for (let i = 0; i < 3; i++) {
      const oy = Math.sin(spin + i * 2.09) * 2.6;
      ctx.fillStyle = i === 0 ? '#59646f' : '#39424b';
      ctx.fillRect(6, -1.4 + oy, gunLen - 2, 2.2);
    }
    ctx.fillStyle = '#1a2026';
    ctx.fillRect(6 + gunLen - 2, -3, 4, 6);
    /* 前手 */
    seg(1, -2, 16, 2.6, 6.5, tone(body, 0.9));
  } else {
    /* 步兵步枪 */
    ctx.fillStyle = '#20262c';
    roundRect(-8, 0.4, 10, 6, 2);
    ctx.fill();
    ctx.fillStyle = '#2c343b';
    roundRect(-1, -2.2, 18, 6.6, 2);
    ctx.fill();
    ctx.fillStyle = '#3d454e';
    ctx.fillRect(2, -4, 11, 1.8);
    ctx.fillStyle = '#262d34';
    ctx.beginPath();
    ctx.moveTo(6, 4.2);
    ctx.lineTo(13, 4.2);
    ctx.lineTo(14.6, 12);
    ctx.lineTo(8, 12.6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#39424b';
    ctx.fillRect(15, -1.2, 12, 3);
    ctx.fillStyle = '#1a2026';
    ctx.fillRect(26, -1.8, 4, 4.2);
    seg(1, -1.8, 14, 3, 6.2, tone(body, 0.92));
  }

  /* 枪口焰 */
  if ((e.muzzle || 0) > 0) {
    const mx = melee ? 26 : (boss ? 40 : (e.type === 'gunner' ? 32 : 31));
    const rad = boss ? 30 : 22;
    const mg = ctx.createRadialGradient(mx, 0, 1, mx, 0, rad);
    mg.addColorStop(0, 'rgba(255,246,200,0.95)');
    mg.addColorStop(0.4, 'rgba(255,170,60,0.55)');
    mg.addColorStop(1, 'rgba(255,110,0,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mx, 0, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,190,0.85)';
    ctx.beginPath();
    ctx.moveTo(mx - 1, 0);
    ctx.lineTo(mx + 8, -3);
    ctx.lineTo(mx + 5, 0);
    ctx.lineTo(mx + 8, 3);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* ---- 降落伞：空降时头顶张开，落地后收起 ---- */
  const cv = e.chuteVis || 0;
  if (cv > 0.02) {
    const open = Math.min(1, cv * 1.4);
    const bob = Math.sin(game.time * 3.1 + e.x * 0.02) * 1.6;
    const cy = headY - 34 - 16 * open + bob;
    const cw = 40 * open, chh = 17 * open;

    /* 伞绳 */
    ctx.strokeStyle = 'rgba(226,234,240,' + (0.55 * cv).toFixed(2) + ')';
    ctx.lineWidth = 0.9;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cw * 0.42, cy + chh * 0.5);
      ctx.lineTo(-facing * 4 + i * 1.6, headY - 2);
      ctx.stroke();
    }
    /* 伞布：两色分片 */
    for (let i = 0; i < 5; i++) {
      const a0 = Math.PI + (i / 5) * Math.PI;
      const a1 = Math.PI + ((i + 1) / 5) * Math.PI;
      ctx.fillStyle = i % 2 ? 'rgba(206,222,236,0.95)' : 'rgba(120,150,170,0.95)';
      ctx.beginPath();
      ctx.moveTo(0, cy + chh * 0.55);
      ctx.arc(0, cy + chh * 0.5, cw, a0, a1);
      ctx.closePath();
      ctx.fill();
    }
    /* 伞沿高光 */
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 * cv).toFixed(2) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, cy + chh * 0.5, cw, Math.PI, Math.PI * 2);
    ctx.stroke();
  }

  /* 受击红闪 */
  if (e.flash > 0) {
    ctx.globalAlpha = Math.min(0.36, e.flash * 2.2);
    ctx.fillStyle = '#ff6a4a';
    roundRect(-9.5, -60, 19, 60, 6);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 换弹提示：打空后头顶转圈，这是反打窗口的视觉信号 */
  if (e.reloadT > 0) {
    const tm = ENEMY_TYPES[e.type] || {};
    const rp = 1 - clamp(e.reloadT / (tm.reload || 2), 0, 1);
    const ry = e.y - e.h - 19;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.arc(sx, ry, 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,198,112,0.95)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(sx, ry, 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rp);
    ctx.stroke();
  }

  /* 血条与 Boss 名牌：BOSS 的血条交给屏幕顶部的大血条，
     这里只留名牌，避免同一条血上下画两遍。 */
  if (e.hp < e.maxHp && !boss) {
    const bw = 40;
    const by = e.y - h - 8;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(sx - bw / 2 - 1, by - 1, bw + 2, 6, 3);
    ctx.fill();
    const ratio = clamp(e.hp / e.maxHp, 0, 1);
    const hg = ctx.createLinearGradient(sx - bw / 2, 0, sx + bw / 2, 0);
    hg.addColorStop(0, '#ff9066');
    hg.addColorStop(1, '#c95a3a');
    ctx.fillStyle = hg;
    roundRect(sx - bw / 2, by, bw * ratio, 4, 2);
    ctx.fill();
  }
  if (boss) {
    const name = e.name || '重装单位';
    const tint = e.accent === 'fire' ? '#ffb066'
      : e.accent === 'steel' ? '#9fd8ff'
        : '#ff8a7a';
    ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(name, sx + 1, e.y - h - 22);
    ctx.fillStyle = tint;
    ctx.fillText(name, sx, e.y - h - 23);
  }
}

/* ---------------- 子弹（曳光 + 光晕） ---------------- */
function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    const x = b.x - camera.x;
    const px = b.px - camera.x;
    if (x < -60 || x > W + 60) continue;

    /* 拖尾 */
    const tg = ctx.createLinearGradient(px, b.py, x, b.y);
    tg.addColorStop(0, 'rgba(255,255,255,0)');
    tg.addColorStop(0.55, b.color);
    tg.addColorStop(1, '#fff6d8');
    ctx.strokeStyle = tg;
    ctx.lineWidth = b.r * 1.9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, b.py);
    ctx.lineTo(x, b.y);
    ctx.stroke();

    /* 狙击曳光：速度 2700，单帧只走 45px，光靠上面的短拖尾只剩「一个亮点」。
       沿飞行方向往回补一条 300px 的渐隐光带，才读得出「一道光穿过去」。 */
    if (b.tracer) {
      const L = 300;
      const a = Math.atan2(b.vy, b.vx);
      const tx = x - Math.cos(a) * L;
      const ty = b.y - Math.sin(a) * L;
      const lg = ctx.createLinearGradient(tx, ty, x, b.y);
      lg.addColorStop(0, 'rgba(150,200,255,0)');
      lg.addColorStop(0.45, 'rgba(160,212,255,0.22)');
      lg.addColorStop(0.86, 'rgba(205,235,255,0.62)');
      lg.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = b.r * 2.2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x, b.y);
      ctx.stroke();
      /* 白色芯线，让弹道中心更锐 */
      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = Math.max(1, b.r * 0.55);
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(a) * L * 0.55, b.y - Math.sin(a) * L * 0.55);
      ctx.lineTo(x, b.y);
      ctx.stroke();
    }

    /* 火箭尾焰：速度只有 660，飞得慢，尾焰要「连成一片」才像推进器。
       间距按弹体半径取，保证每个圆和上一个重叠；外面再罩一层锥形柔光。 */
    if (b.rocket) {
      const a = Math.atan2(b.vy, b.vx);
      const cx = Math.cos(a), sy = Math.sin(a);
      const len = b.r * 7.4;

      /* 锥形柔光：从弹体往回 110px 逐渐变宽变淡 */
      const fg = ctx.createLinearGradient(x, b.y, x - cx * len, b.y - sy * len);
      fg.addColorStop(0, 'rgba(255,236,180,0.55)');
      fg.addColorStop(0.35, 'rgba(255,176,90,0.30)');
      fg.addColorStop(1, 'rgba(180,110,60,0)');
      ctx.strokeStyle = fg;
      ctx.lineWidth = b.r * 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, b.y);
      ctx.lineTo(x - cx * len, b.y - sy * len);
      ctx.stroke();

      /* 焰芯：重叠的圆，越远越小越暗 */
      for (let k = 1; k <= 7; k++) {
        const d = k * b.r * 1.05;
        const fx = x - cx * d, fy = b.y - sy * d;
        const t = k / 8;
        const al = 0.62 * (1 - t);
        ctx.fillStyle = k <= 3
          ? 'rgba(255,244,200,' + (al * 1.4).toFixed(3) + ')'
          : (k <= 5 ? 'rgba(255,168,72,' + al.toFixed(3) + ')'
                    : 'rgba(150,120,96,' + (al * 0.75).toFixed(3) + ')');
        ctx.beginPath();
        ctx.arc(fx, fy, Math.max(0.8, b.r * (1 - t * 0.85)), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* 弹头光点 */
    const glow = ctx.createRadialGradient(x, b.y, 0, x, b.y, b.r * 5);
    if (b.tracer) {
      /* 狙击用冷白光晕，别和步枪的暖黄混在一起 */
      glow.addColorStop(0, 'rgba(255,255,255,0.98)');
      glow.addColorStop(0.35, 'rgba(196,232,255,0.55)');
      glow.addColorStop(1, 'rgba(120,180,255,0)');
    } else {
      glow.addColorStop(0, 'rgba(255,248,214,0.95)');
      glow.addColorStop(0.4, 'rgba(255,196,110,0.35)');
      glow.addColorStop(1, 'rgba(255,140,40,0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, b.y, b.r * 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 手雷 ---------------- */
function drawGrenades() {
  for (const g of grenades) {
    const x = g.x - camera.x;
    const under = surfaceBelow(g.x, g.y);
    const gap = clamp((under - g.y) / 160, 0, 1);

    ctx.fillStyle = 'rgba(0,0,0,' + (0.34 * (1 - gap * 0.6)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(x, under + 1, 5.5 * (1 - gap * 0.5), 2.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, g.y);
    ctx.rotate(g.spin);
    /* 弹体 */
    const gg = ctx.createLinearGradient(-5, -6, 5, 6);
    gg.addColorStop(0, '#4e6e46');
    gg.addColorStop(1, '#2c3f28');
    ctx.fillStyle = gg;
    roundRect(-5, -6.5, 10, 13, 4.5);
    ctx.fill();
    /* 刻纹 */
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-4, -2); ctx.lineTo(4, -2);
    ctx.moveTo(-4, 1.5); ctx.lineTo(4, 1.5);
    ctx.stroke();
    /* 保险握片 */
    ctx.fillStyle = '#8d949b';
    roundRect(-1.6, -9.5, 3.2, 4, 1);
    ctx.fill();
    ctx.restore();

    /* 引信闪烁 */
    const blink = 0.45 + Math.sin(game.time * 26) * 0.4;
    const fg = ctx.createRadialGradient(x, g.y - 7, 0, x, g.y - 7, 12);
    fg.addColorStop(0, 'rgba(255,90,50,' + blink.toFixed(2) + ')');
    fg.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(x, g.y - 7, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------------- 燃烧地带（纵火者的燃烧瓶） ---------------- */
function drawFire() {
  for (const f of fires) {
    const x = f.x - camera.x;
    if (x < -180 || x > W + 180) continue;
    const rate = clamp(f.life / f.max, 0, 1);
    /* 快烧完时整块变矮变暗，玩家扫一眼就知道这片火要熄了 */
    const hh = 52 * (0.45 + rate * 0.55);
    const y = f.y;

    /* 焦土：一层压在地面的黑斑，让火焰有「烧过」的落点 */
    const cg = ctx.createRadialGradient(x, y, 2, x, y, f.r);
    cg.addColorStop(0, 'rgba(18,10,6,0.62)');
    cg.addColorStop(0.7, 'rgba(26,14,8,0.34)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(x, y, f.r, f.r * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();

    /* 火墙：加色混合，一排高低不一的火舌随时间抖动 */
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(x, y - hh * 0.35, 4, x, y - hh * 0.35, f.r * 0.95);
    glow.addColorStop(0, 'rgba(255,150,50,' + (0.30 * rate).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(x, y - hh * 0.3, f.r * 0.95, hh * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    const tongues = 7;
    for (let i = 0; i < tongues; i++) {
      const fx = x + (i / (tongues - 1) - 0.5) * f.r * 1.6;
      const wob = Math.sin(game.time * 9 + f.seed + i * 1.7);
      const fh = hh * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(game.time * 7.3 + i * 2.1 + f.seed)));
      const fw = 11 + 5 * wob;
      const tg = ctx.createLinearGradient(0, y, 0, y - fh);
      tg.addColorStop(0, 'rgba(255,120,30,' + (0.55 * rate).toFixed(3) + ')');
      tg.addColorStop(0.45, 'rgba(255,180,70,' + (0.42 * rate).toFixed(3) + ')');
      tg.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(fx - fw / 2, y);
      ctx.quadraticCurveTo(fx - fw * 0.55, y - fh * 0.6, fx + wob * 3, y - fh);
      ctx.quadraticCurveTo(fx + fw * 0.55, y - fh * 0.6, fx + fw / 2, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ---------------- 掉落物 ---------------- */
function drawPickups() {
  for (const pk of pickups) {
    const x = pk.x - camera.x;
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(pk.bob) * 3;
    const health = pk.type === 'health';
    const main = health ? '#5fd98a' : '#ffc857';

    /* 地面光斑 */
    const gy = surfaceBelow(pk.x, pk.y);
    const gg = ctx.createRadialGradient(x, gy, 1, x, gy, 26);
    gg.addColorStop(0, health ? 'rgba(90,240,160,0.30)' : 'rgba(255,200,90,0.30)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(x, gy, 24, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, pk.y + bob);

    /* 外发光 */
    ctx.shadowColor = health ? 'rgba(90,240,150,0.85)' : 'rgba(255,200,80,0.85)';
    ctx.shadowBlur = 16;

    /* 箱体 */
    ctx.shadowBlur = 0;

    ctx.fillStyle = health ? '#1e3d2c' : '#3d3018';
    roundRect(-11, -11, 22, 22, 5);
    ctx.fill();
    ctx.strokeStyle = main;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 内衬高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    roundRect(-9, -9, 18, 8, 4);
    ctx.fill();

    ctx.fillStyle = health ? '#8ff0b0' : '#ffd166';
    if (health) {
      ctx.fillRect(-6.5, -2, 13, 4);
      ctx.fillRect(-2, -6.5, 4, 13);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(-5.5, -1.2, 11, 1.2);
    } else {
      /* 子弹图标 */
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(-6 + i * 4.4, -4, 2.6, 8);
        ctx.beginPath();
        ctx.moveTo(-6 + i * 4.4, -4);
        ctx.lineTo(-4.7 + i * 4.4, -7);
        ctx.lineTo(-3.4 + i * 4.4, -4);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawEffects() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    const x = p.x - camera.x;
    ctx.globalAlpha = a;
    if (p.ring) {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4 * a;
      ctx.beginPath(); ctx.arc(x, p.y, p.size * (1.6 - a), 0, Math.PI * 2); ctx.stroke();
    } else if (p.ball && p.smoke) {
      /* 烟团：普通混合，越散越淡越大 */
      ctx.globalAlpha = a * 0.34;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(x, p.y, p.size * (2.1 - a * 0.8), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a;
    } else if (p.ball) {
      /* 火球：加色柔光，边缘必须透明，否则是个死板的圆 */
      const r = p.size * (2.0 - a * 0.95);
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(x, p.y, 0, x, p.y, r);
      fg.addColorStop(0, 'rgba(255,252,232,0.95)');
      fg.addColorStop(0.30, 'rgba(255,206,110,0.78)');
      fg.addColorStop(0.62, 'rgba(255,132,40,0.34)');
      fg.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  for (const c of casings) {
    ctx.save();
    ctx.translate(c.x - camera.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = clamp(c.life, 0, 1);
    ctx.fillStyle = '#d8b25a';
    ctx.fillRect(-2.5, -1.2, 5, 2.4);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  for (const t of texts) {
    const x = t.x - camera.x;
    const size = t.size || 1;
    ctx.globalAlpha = clamp(t.life * 1.4, 0, 1);
    ctx.font = 'bold ' + Math.round(16 * size) + 'px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3 + (size - 1) * 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(t.str, x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, x, t.y);
  }
  ctx.globalAlpha = 1;
}


/* ---------------- 准星 ---------------- */
function drawCrosshair() {
  const x = input.mx, y = input.my;
  const p = player;
  const spread = p ? clamp(9 + Math.abs(p.vx) * 0.012 + (p.muzzle || 0) * 40, 9, 22) : 9;

  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = 'rgba(255,222,160,0.92)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, y, spread, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,222,160,0.55)';
  ctx.beginPath();
  ctx.arc(x, y, spread + 4, 0, Math.PI * 2);
  ctx.stroke();

  const g = spread + 3, l = spread + 9;
  ctx.strokeStyle = 'rgba(255,232,190,0.95)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(x - l, y); ctx.lineTo(x - g, y);
  ctx.moveTo(x + g, y); ctx.lineTo(x + l, y);
  ctx.moveTo(x, y - l); ctx.lineTo(x, y - g);
  ctx.moveTo(x, y + g); ctx.lineTo(x, y + l);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,120,80,0.95)';
  ctx.beginPath();
  ctx.arc(x, y, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}


/* ===== hud.js ===== */
'use strict';

/* ==================================================================
   渲染层 3：HUD / 菜单 / 主循环
   ================================================================== */

function bar(x, y, w, h, ratio, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(x, y, w, h, h / 2);
  ctx.fill();
  const rw = w * clamp(ratio, 0, 1);
  if (rw > 1) {
    ctx.fillStyle = color;
    roundRect(x, y, rw, h, h / 2);
    ctx.fill();
  }
}

function drawHUD() {
  const p = player, b = buddy;

  /* --- 玩家卡片 --- */
  ctx.fillStyle = 'rgba(10,16,22,0.62)';
  roundRect(20, H - 112, 300, 92, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,235,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#8fc4f0';
  ctx.fillText('指挥官（你）', 36, H - 86);

  bar(36, H - 78, 268, 12, p.hp / p.maxHp, p.hp / p.maxHp > 0.35 ? '#4fbf7a' : '#e0553f');
  ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#eaf2f8';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, 46, H - 68);

  const wp = WEAPONS[p.weapon];
  const mag = p.mags[p.weapon];
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#e8dcc0';
  ctx.fillText(wp.name, 36, H - 42);

  ctx.textAlign = 'right';
  ctx.font = 'bold 18px Consolas,monospace';
  ctx.fillStyle = p.reloading > 0 ? '#ffb347' : (mag > 0 ? '#f2e6c8' : '#ff5a4a');
  ctx.fillText(p.reloading > 0 ? '装填中' : (mag + ' / ' + wp.mag), 300, H - 40);

  /* 武器槽：按武器表自适应，有几把排几格 */
  const slotW = 48, slotGap = 4;
  for (let i = 0; i < WEAPONS.length; i++) {
    const w2 = WEAPONS[i];
    const sx = 38 + i * (slotW + slotGap), sy = H - 31;
    const on = p.weapon === i;
    ctx.fillStyle = on ? 'rgba(255,200,110,0.92)' : 'rgba(255,255,255,0.13)';
    roundRect(sx, sy, slotW, 17, 4);
    ctx.fill();
    if (!on) {
      ctx.strokeStyle = p.mags[i] > 0 ? 'rgba(255,255,255,0.16)' : 'rgba(255,90,74,0.36)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.font = 'bold 9.5px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = on ? '#1a1208' : (p.mags[i] > 0 ? '#b9c6d2' : '#7a6a5a');
    ctx.fillText((i + 1) + ' ' + w2.short, sx + slotW / 2, sy + 12.5);
  }

  /* --- 八哥卡片 --- */
  ctx.fillStyle = 'rgba(10,16,22,0.62)';
  roundRect(W - 320, H - 112, 300, 92, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,170,80,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffb257';
  ctx.fillText('八哥（AI 战友）', W - 304, H - 86);

  bar(W - 304, H - 78, 268, 12, b.hp / b.maxHp, b.hp / b.maxHp > 0.34 ? '#e0a04a' : '#e0553f');
  ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#eaf2f8';
  ctx.fillText(Math.ceil(b.hp) + ' / ' + b.maxHp, W - 296, H - 68);

  const stateText = b.dead ? '阵亡（下波归队）'
    : b.downed ? '倒地！快按住 E 救我'
    : ({ FOLLOW: '跟随', ENGAGE: '交战中', RETREAT: '后撤回血', REVIVE: '赶来救你', HOLD: '守点', GRAB: '去捡补给' }[b.intent] || '待命');
  const cmdText = { follow: '跟随', rush: '突击', hold: '守点' }[b.cmd];
  const styleText = (typeof BUDDY_STYLES !== 'undefined' && BUDDY_STYLES[b.style]) ? BUDDY_STYLES[b.style].name : '均衡';
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffd7a3';
  ctx.fillText('状态：' + stateText, W - 304, H - 46);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#9fb0bf';
  ctx.font = '12px "Microsoft YaHei",sans-serif';
  ctx.fillText('性格 ' + styleText + '（Q）· 指令 ' + cmdText + '（C/V/B）', W - 36, H - 46);

  ctx.textAlign = 'left';
  ctx.font = '11px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#7d8c99';
  ctx.fillText('G 手雷 · R 换弹 · S 蹲下 · 右键 精瞄 · Shift 冲刺 · E 救八哥 · P 暂停', W - 304, H - 26);

  /* --- 顶部关卡 / 波次 --- */
  const th = world.theme;
  ctx.fillStyle = 'rgba(10,16,22,0.55)';
  roundRect(W / 2 - 190, 16, 380, 40, 20);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#e9e2cf';
  ctx.fillText('第 ' + game.stage + ' 关  ·  波次 ' + Math.max(1, game.wave) + ' / ' + game.maxWave, W / 2, 42);
  if (th && th.name) {
    ctx.font = '12px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(233,226,207,0.62)';
    ctx.fillText(th.name, W / 2, 55);
  }

  for (let i = 0; i < game.maxWave; i++) {
    const px = W / 2 - (game.maxWave - 1) * 11 + i * 22;
    ctx.beginPath();
    ctx.arc(px, 66, 4, 0, Math.PI * 2);
    ctx.fillStyle = i < game.wave ? (i === game.maxWave - 1 ? '#ff6b5a' : '#ffc857') : 'rgba(255,255,255,0.2)';
    ctx.fill();
  }

  /* --- 左上信息 --- */
  ctx.textAlign = 'left';
  ctx.font = 'bold 14px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(233,226,207,0.85)';
  ctx.fillText('击杀 ' + game.kills, 24, 34);
  ctx.fillStyle = 'rgba(255,200,120,0.85)';
  ctx.fillText('得分 ' + game.score, 24, 56);

  const alive = enemies.filter(e => !e.dead).length;
  const pending = game.spawnQueue.filter(s => !s.done).length;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,150,130,0.9)';
  ctx.fillText('剩余敌人 ' + (alive + pending), W - 24, 34);

  /* --- 中央提示 ---
     BOSS 入场横幅自己会喊「敌方重装单位接近」，这时候再叠一句波次提示
     两行字会撞在一起，所以横幅期间让路。 */
  if (game.msgTimer > 0 && !game.bossIntro) {
    ctx.globalAlpha = Math.min(1, game.msgTimer);
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px "Microsoft YaHei",sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(game.msg, W / 2, 150);
    ctx.fillStyle = '#ffd9a0';
    ctx.fillText(game.msg, W / 2, 150);
    ctx.globalAlpha = 1;
  }
}

/* ==================================================================
   BOSS 专属血条
   顶部一条长血条 + 名字 + 称号。掉落时有一条「残影」慢慢追下来，
   打空的瞬间能看出这一枪削掉多少血 —— 普通怪的小血条做不到这个。
   ================================================================== */
let bossBarShown = 1;    /* 当前显示的血量比例（平滑追随） */
let bossBarGhost = 1;    /* 白色残影（慢慢追下来） */
let bossBarKey = '';     /* 换 BOSS 时重置 */

const BOSS_ACCENT = {
  red: { a: '#ff7a5a', b: '#b8231f', glow: 'rgba(255,90,60,0.55)' },
  fire: { a: '#ffb066', b: '#a8420c', glow: 'rgba(255,150,50,0.55)' },
  steel: { a: '#9fd8ff', b: '#2b5871', glow: 'rgba(120,200,255,0.5)' }
};

function drawBossBar() {
  const dt = _dt;
  const boss = enemies.find(e => e.boss && !e.dead);
  const intro = game.bossIntro;

  if (!boss && !intro) {
    bossBarShown = bossBarGhost = 1;
    bossBarKey = '';
    return;
  }

  const name = boss ? (boss.name || '重装单位') : intro.name;
  const tag = boss ? (ENEMY_TYPES[boss.type].title || '') : (intro.tag || '');
  const accent = BOSS_ACCENT[(boss ? boss.accent : intro.accent) || 'red'] || BOSS_ACCENT.red;
  const key = name + '|' + tag;
  if (bossBarKey !== key) { bossBarKey = key; bossBarShown = bossBarGhost = 1; }

  const ratio = boss ? clamp(boss.hp / boss.maxHp, 0, 1) : 1;
  /* 入场时血条从 0 涨满，给一个「正在抵达战场」的仪式感 */
  const rise = boss ? 1 : clamp((intro ? intro.t : 0) / 0.7, 0, 1);

  bossBarShown += (ratio - bossBarShown) * Math.min(1, dt * 9);
  bossBarGhost = bossBarGhost > bossBarShown
    ? Math.max(bossBarShown, bossBarGhost - dt * 0.42)
    : bossBarShown;

  /* 宽度 440 是被左侧战术面板「挤」出来的：
     面板占 x 20~392（展开态 372 宽），底板左缘必须 ≥ 392 才不压字。
     520 宽时底板左缘 = 640-260-8 = 372，会和面板重叠 20px，
     名字头两个字正好落在面板背景上。440 宽时底板 412~868，
     左右留白对称，且最长的「钢铁典狱长」+ 称号也排得下。 */
  const bw = 440, bh = 15;
  /* y 位置要让开顶部的关卡药丸（16~56）和波次圆点（66），否则会压住主题名 */
  const bx = W / 2 - bw / 2, by = 106;
  const appear = boss ? 1 : clamp((intro ? intro.t : 0) / 0.35, 0, 1);

  ctx.save();
  ctx.globalAlpha = appear;

  /* 外框底板 */
  ctx.fillStyle = 'rgba(8,12,16,0.78)';
  roundRect(bx - 8, by - 26, bw + 16, 58, 9);
  ctx.fill();
  ctx.strokeStyle = accent.glow;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* 名字 + 称号 */
  ctx.textAlign = 'left';
  ctx.font = 'bold 17px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = accent.a;
  ctx.fillText(name, bx, by - 10);
  if (tag) {
    const nw = ctx.measureText(name).width;
    ctx.font = '11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(210,220,230,0.6)';
    ctx.fillText(tag, bx + nw + 10, by - 10);
  }
  ctx.textAlign = 'right';
  ctx.font = 'bold 11px Consolas,monospace';
  ctx.fillStyle = 'rgba(230,238,245,0.72)';
  ctx.fillText(Math.ceil(ratio * 100) + '%', bx + bw, by - 10);

  /* 血槽 */
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(bx, by, bw, bh, bh / 2);
  ctx.fill();

  /* 残影：宽一圈的浅色，被血量追着走 */
  if (bossBarGhost > bossBarShown + 0.001) {
    ctx.fillStyle = 'rgba(255,235,210,0.42)';
    roundRect(bx, by, bw * bossBarGhost * rise, bh, bh / 2);
    ctx.fill();
  }

  /* 主体血条 */
  const w2 = bw * bossBarShown * rise;
  if (w2 > 1) {
    const g = ctx.createLinearGradient(bx, by, bx, by + bh);
    g.addColorStop(0, accent.a);
    g.addColorStop(0.55, accent.b);
    g.addColorStop(1, accent.a);
    ctx.fillStyle = g;
    roundRect(bx, by, w2, bh, bh / 2);
    ctx.fill();
    /* 顶部高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(bx + 2, by + 2, Math.max(0, w2 - 4), 3.5, 2);
    ctx.fill();
  }

  /* 分段刻度：把长血条切成 10 段，读血更直观 */
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 10; i++) {
    const sx = bx + (bw / 10) * i;
    ctx.beginPath();
    ctx.moveTo(sx, by + 1);
    ctx.lineTo(sx, by + bh - 1);
    ctx.stroke();
  }
  ctx.restore();
}

/* ==================================================================
   BOSS 入场横幅：两道斜切光带夹住名字，从两侧收拢
   ================================================================== */
function drawBossIntro() {
  const bi = game.bossIntro;
  if (!bi) return;

  const p = bi.t / bi.dur;
  /* 0→0.14 推进场，0.14→0.78 停留，之后淡出 */
  const inK = clamp(p / 0.14, 0, 1);
  const outK = clamp((p - 0.82) / 0.18, 0, 1);
  const alpha = inK * (1 - outK);
  const slide = (1 - inK) * 180 + outK * 90;
  const accent = BOSS_ACCENT[bi.accent] || BOSS_ACCENT.red;

  /* 纵向栈（自上而下）：警告 162 / 光带 178 / 名字 234 / 称号 266 / 光带 278
     每个元素都算好占位，光带只夹在名字外面的空隙里，不压字。 */
  const cy = 224;

  ctx.save();
  ctx.globalAlpha = alpha;

  /* 两条斜切光带：从中间向两侧展开，夹住名字。
     用加色混合，光带才会「亮」而不是画一条深色横杠。 */
  const bandW = (W / 2 + 120) * inK;
  const drawBand = (top) => {
    ctx.beginPath();
    ctx.moveTo(W / 2 - bandW, cy + top);
    ctx.lineTo(W / 2 + bandW, cy + top - 8);
    ctx.lineTo(W / 2 + bandW, cy + top + 6);
    ctx.lineTo(W / 2 - bandW, cy + top + 14);
    ctx.closePath();
    const g = ctx.createLinearGradient(W / 2 - bandW, 0, W / 2 + bandW, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.16, accent.glow);
    g.addColorStop(0.5, 'rgba(255,138,96,0.95)');
    g.addColorStop(0.84, accent.glow);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fill();
  };
  ctx.globalCompositeOperation = 'lighter';
  drawBand(-46);
  drawBand(54);

  /* 光带边缘补一条细亮线，让斜切更有金属感 */
  ctx.strokeStyle = accent.a;
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = alpha * 0.75;
  for (const top of [-46, 60]) {
    ctx.beginPath();
    ctx.moveTo(W / 2 - bandW, cy + top);
    ctx.lineTo(W / 2 + bandW, cy + top - 8);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;

  /* 名字：大字 + 描边阴影 */
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px "Microsoft YaHei",sans-serif';
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(0,0,0,0.72)';
  ctx.strokeText(bi.name, W / 2 - slide * 0.4, cy + 10);
  ctx.fillStyle = '#fff4e2';
  ctx.fillText(bi.name, W / 2 - slide * 0.4, cy + 10);

  /* 称号 */
  ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeText(bi.tag, W / 2 + slide * 0.4, cy + 42);
  ctx.fillStyle = accent.a;
  ctx.fillText(bi.tag, W / 2 + slide * 0.4, cy + 42);

  /* 顶部小字：警告 */
  const blink = 0.55 + 0.45 * Math.sin(bi.t * 14);
  ctx.globalAlpha = alpha * blink;
  ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ff6b5a';
  ctx.fillText('▲  敌 方 重 装 单 位 接 近  ▲', W / 2, cy - 62);

  ctx.restore();
}

/* ==================================================================
   全屏白闪（BOSS 击破 / 入场共用）
   ================================================================== */
function drawScreenFlash() {
  const f = game.screenFlash || 0;
  if (f <= 0.001) return;
  ctx.fillStyle = 'rgba(255,244,228,' + (clamp(f, 0, 1) * 0.62).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

/* ==================================================================
   八哥战术面板：把他的思考过程真的画出来（Tab 收起 / 展开）
   ================================================================== */
const INTENT_COLOR = {
  ENGAGE: '#ff9a5c', RETREAT: '#e0553f', REVIVE: '#7ef0b0',
  GRAB: '#6fc2ff', FOLLOW: '#a8bccb', HOLD: '#ffd166'
};

function drawAIPanel() {
  const b = buddy;
  if (!b) return;

  const x = 20, y = 76, w = 372;
  const t = game.tele;
  const acc = t.buddyShots > 0 ? Math.min(100, Math.round(t.buddyHits / t.buddyShots * 100)) : 0;
  const intent = b.dead ? '阵亡' : (b.downed ? '倒地' : (INTENT_NAMES[b.intent] || '待命'));
  const icolor = b.dead || b.downed ? '#e0553f' : (INTENT_COLOR[b.intent] || '#a8bccb');

  /* --- 收起状态：一条横条 --- */
  if (!aiPanelOpen) {
    ctx.fillStyle = 'rgba(10,16,22,0.62)';
    roundRect(x, y, 316, 26, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,170,80,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = icolor;
    ctx.fillText('八哥 AI · ' + intent + (t.buddyShots ? ' · 命中 ' + acc + '%' : ''), x + 10, y + 18);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#64798a';
    ctx.fillText('Tab 展开', x + 306, y + 18);
    return;
  }

  const threat = b.dead || b.downed ? { count: 0 } : scanIncoming(b, 0.45);
  const tg = b.target;
  const logs = b.log.slice(-3);
  /* 高度按实际内容算：标题 46 + 5 行 × 20 + 日志标题 14 + 日志行 × 17 + 底部留白 14 */
  const h = 46 + 20 * 5 + 14 + 17 * Math.max(1, logs.length) + 14;

  ctx.fillStyle = 'rgba(10,16,22,0.70)';
  roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,170,80,0.28)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 标题栏 */
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffb257';
  ctx.fillText('八哥 · 战术面板', x + 12, y + 20);
  ctx.textAlign = 'right';
  ctx.font = '10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#64798a';
  ctx.fillText('决策 ' + t.decisions + ' 次 · 0.15s/次 · Tab 收起', x + w - 12, y + 20);

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 28);
  ctx.lineTo(x + w - 10, y + 28);
