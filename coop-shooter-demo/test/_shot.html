<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>shot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0b0f14; overflow:hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
  #err { position:absolute; left:0; top:0; color:#f66; font-size:14px; z-index:99; background:#000; max-width:1280px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="err"></div>
<script>
  window.onerror = function (m, s, l, c) {
    var d = document.getElementById('err');
    if (d) d.textContent += 'ERR ' + m + ' @' + s + ':' + l + ' | ';
  };
</script>
<script src="../js/util.js"></script>
<script src="../js/world.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script src="../js/chars.js"></script>
<script src="../js/render2.js"></script>
<script src="../js/meta.js"></script>
<script src="../js/hud.js"></script>
<script>
(function () {
  resetSave();
  SAVE.coins = 1600;
  SAVE.level = 4;
  SAVE.xp = 30;
  SAVE.maxStage = 4;
  SAVE.cleared = [1, 2, 3];
  SAVE.seenStory = [1];
  SAVE.totalKills = 231;
  SAVE.bestScore = 8420;
  SAVE.runs = 9;
  SAVE.chars = ['hero', 'kimi', 'glm'];
  SAVE.weapons = ['m4', 'm870', 'm249', 'awm'];
  SAVE.primary = 'awm';
  SAVE.secondary = 'm249';
  SAVE.buddyWeapon = 'm870';

  var h = (location.hash || '#lobby').slice(1);
  var arg = (h.split(':')[1] || '');
  h = h.split(':')[0];

  if (h === 'title') { game.state = 'title'; }
  else if (h === 'lobby') { game.state = 'lobby'; game.menu = +(arg || 2); }
  else if (h === 'deploy') { game.state = 'deploy'; game.pickStage = +(arg || 3); }
  else if (h === 'armory') { game.state = 'armory'; game.menu2 = +(arg || 3); }
  else if (h === 'operators') { game.state = 'operators'; game.menu2 = +(arg || 1); }
  else if (h === 'archive') { game.state = 'archive'; }
  else if (h === 'story') { openStory(1, 'lobby'); if (game.dialog) game.dialog.chars = 999; }
  else if (h === 'toast') { game.state = 'lobby'; game.menu = 1; toast('已设为主武器 · AWM 狙击'); }
  else if (h === 'play') {
    /* 战斗内 HUD 检查：跳过剧情直接开局，给一点击杀数与等级，
       顺手把 1 号槽切到主武器，好看到两格槽位的「当前选中」效果 */
    startStage(2);
    game.dialog = null; game.state = 'playing';
    game.kills = 17; game.score = 2400; game.earned = 96;
    if (player) {
      player.hp = 118; player.maxHp = 142;
      player.weapon = weaponById(SAVE.primary);
      /* 弹匣按 magSize 铺满，再让当前这把少两发：
         写死 [6,40,9,9,9] 会造出「9 / 5」这种真实战斗里不存在的读数 */
      player.mags = WEAPONS.map(function (w, i) { return magSize(player, i); });
      player.mags[player.weapon] = Math.max(1, player.mags[player.weapon] - 2);
      player.armor = 0.096;
    }
  }
  else if (h === 'stageclear') {
    startStage(1); game.state = 'stageclear';
    game.kills = 27; game.score = 5300; game.earned = 214;
    game.clearBonus = 164; game.levelUps = 2; game.xpGain = 310;
  }
})();
</script>
</body>
</html>
