<!DOCTYPE html><html><head><meta charset="utf-8"><title>dbg</title>
<style>*{margin:0}canvas{display:block}</style></head><body>
<canvas id="game" width="1280" height="720"></canvas>
<script>window.requestAnimationFrame=function(){return 0;};</script>
<script src="../js/util.js"></script><script src="../js/world.js"></script>
<script src="../js/ai.js"></script><script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script src="../js/chars.js"></script><script src="../js/render2.js"></script>
<script src="../js/hud.js"></script>
<script>
var out=[];
try{
  startStage(3);
  for(var i=0;i<120;i++) update(1/60);
  out.push('enemies='+enemies.length);
  out.push('player='+player.x.toFixed(0)+','+player.y.toFixed(0));
  out.push('camera='+camera.x.toFixed(0)+','+camera.y.toFixed(0));
  try{ render(); out.push('render OK'); }catch(e){ out.push('RENDER ERR: '+e.message+' | '+(e.stack||'').split('\n')[1]); }
}catch(e){ out.push('ERR: '+e.message+' | '+(e.stack||'').split('\n')[1]); }
document.title=out.join(' ;; ');
</script></body></html>
