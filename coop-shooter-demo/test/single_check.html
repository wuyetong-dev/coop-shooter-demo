<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双人闯关 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#0b0f14;
    overflow:hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  #wrap {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block;
    background:#101820;
    image-rendering:auto;
    cursor: crosshair;
    box-shadow:0 0 60px rgba(0,0,0,.8);
  }
  #hint {
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center; color:#4a5a6a; font-size:12px;
    pointer-events:none; user-select:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="hint">点击画面开始 · 全屏体验更佳（F11 全屏）</div>

<script>

/* ===== util.js ===== */
'use strict';

/* ==================================================================
   双人闯关 Demo   —— 基础层：常量 / 工具 / 输入 / 音效
   ================================================================== */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 1280, H = 720;

/* ------------------------------------------------------------------
   物理参数：全部手感调优集中在这里
   跳跃高度 = JUMP_V² / (2·GRAV) = 1000² / 4200 ≈ 238px
   ------------------------------------------------------------------ */
const GRAV          = 2100;   // 重力加速度
const VY_MAX        = 1900;   // 最大下落速度
const JUMP_V        = 1000;   // 满跳初速 → 跳高约 238px（原版只有 123px，跳不上平台）
const JUMP_CUT      = 0.42;   // 松开跳跃键时残余速度的截断系数（可变跳高）
const JUMP_V2       = 880;    // 二段跳初速 → 空中再抬约 184px（比首跳低一档，够上高台但不越过设计高度）
const MAX_AIR_JUMPS = 1;      // 空中还能再跳几次（1 = 二段跳）
const COYOTE_TIME   = 0.12;   // 土狼时间：走出平台边缘后仍允许起跳
const JUMP_BUFFER   = 0.14;   // 跳跃缓冲：落地前提前按跳，落地瞬间自动起跳
const WIND_ACCEL    = 2750;   // 上升气流托举力（> GRAV，站在里面就会被顶起来）
const WIND_RISE_MAX = 560;    // 气流里的最大上升速度
const FALL_DEPTH    = 176;    // 掉到地面线以下这么深就算坠入深渊（此时人已在画面外）
const AIRJUMP_FLIP  = 0.42;   // 二段跳空翻时长（秒）：蹬腿、团身、转体、展开
const CORPSE_LIFE   = 7.0;    // 尸体在场上停留多久（之后淡出，只留血迹）
const MOVE_SPEED    = 290;    // 地面移动速度
const MOVE_ACCEL    = 5200;   // 地面加速度（不是瞬间满速，有轻微推重感）
const MOVE_FRICTION = 6400;   // 地面摩擦
const AIR_ACCEL     = 2700;   // 空中控制力
const DROP_TIME     = 0.20;   // 按下 + 跳 穿过单向平台的时长

/* ---------- 数学工具 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function angleDiff(a, b) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function angleLerp(a, b, t) {
  return a + angleDiff(a, b) * clamp(t, 0, 1);
}
function distTo(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}

/* ---------- 全局世界对象 ---------- */
const world = {
  w: 3200,
  groundY: 600,
  platforms: [],
  covers: [],      // 沙袋掩体（可挡子弹、可打坏）
  blocks: [],      // 实体障碍：木箱 / 油桶 / 路障 / 集装箱（挡人挡弹）
  props: [],       // 纯装饰物
  pits: [],        // 深渊：地面被炸开的缺口，掉下去直接死
  hazards: [],     // 场景机关：地刺 / 喷火口
  winds: [],       // 上升气流（跳进去能被托到高处）
  theme: null      // 当前关卡主题（buildStage 里设置）
};

const camera = { x: 0, y: 0, shake: 0 };

/* ------------------------------------------------------------------
   画面缩放：世界渲染整体放大，人物与近景细节更清晰
   · 地面永远落在屏幕 H-78 处（构图稳定）
   · 水平方向玩家居中（相机自己负责）
   屏幕 → 世界： wx = sx / Z + camera.x      wy = (sy - CAM_TY) / Z
   ------------------------------------------------------------------ */
const VIEW_ZOOM = 1.22;
const VIEW_W = W / VIEW_ZOOM;     // 可视世界宽度
const VIEW_H = H / VIEW_ZOOM;     // 可视世界高度
const CAM_TY = (H - 78) - world.groundY * VIEW_ZOOM;


/* ---------- 实体容器 ---------- */
let player = null;
let buddy = null;
let enemies = [];
let bullets = [];
let grenades = [];
let pickups = [];
let particles = [];
let texts = [];
let casings = [];
let decals = [];   // 弹孔 / 血迹（贴地痕迹，随时间淡出）
let fires = [];    // 燃烧瓶留下的火焰地带（焦土纵火者专用）
let corpses = [];  // 尸体：倒下的人不会瞬间消失，会先软下来、再躺一会儿

/* ---------- 输入 ---------- */
const keys = Object.create(null);
const input = { mx: W / 2, my: H / 2, firing: false, aiming: false, started: false };
let jumpHeld = false;

const BLOCK_KEYS = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab', 'KeyR', 'KeyE'];

const JUMP_KEYS = ['Space', 'KeyW', 'ArrowUp'];

addEventListener('keydown', e => {
  if (BLOCK_KEYS.indexOf(e.code) >= 0) e.preventDefault();
  if (!keys[e.code]) {
    if (JUMP_KEYS.indexOf(e.code) >= 0) {
      jumpHeld = true;
      for (const a of [player, buddy]) if (a) a.jumpBuffer = JUMP_BUFFER;
    }
    onKeyPress(e.code);
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (JUMP_KEYS.indexOf(e.code) >= 0) {
    jumpHeld = false;
    /* 松键截断：短按 = 小跳，长按 = 满跳 */
    if (player && player.vy < -420) player.vy *= JUMP_CUT;
  }
});

cvs.addEventListener('mousemove', e => {
  const r = cvs.getBoundingClientRect();
  input.mx = (e.clientX - r.left) * (W / r.width);
  input.my = (e.clientY - r.top) * (H / r.height);
});
cvs.addEventListener('mousedown', e => {
  if (e.button === 0) { input.firing = true; ensureAudio(); input.started = true; }
  if (e.button === 2) { input.aiming = true; e.preventDefault(); }
});
addEventListener('mouseup', e => {
  if (e.button === 0) input.firing = false;
  if (e.button === 2) input.aiming = false;
});
cvs.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => {
  input.firing = false;
  input.aiming = false;
  jumpHeld = false;
  for (const k in keys) keys[k] = false;
});

/* 世界坐标下的鼠标位置（要考虑画面缩放） */
function mouseWorld() {
  return {
    x: input.mx / VIEW_ZOOM + camera.x,
    y: (input.my - CAM_TY) / VIEW_ZOOM
  };
}

/* ------------------------------------------------------------------
   准星与弹道的换算 —— 准星不是画一个固定大小的圈，
   它画的是「按这把枪的散布，打到这里时子弹可能落在一个多大的范围里」。
   角散布 × 距离 = 线散布，所以同一个圈在远处会自动变大。
   ------------------------------------------------------------------ */

/* 屏幕上的散布半径（像素）：dist 是玩家到准星的世界距离 */
function aimRadiusPx(wp, dist, spreadMul) {
  const ang = Math.max(0, wp.spread || 0) * (spreadMul === undefined ? 1 : spreadMul);
  /* 远处封顶：不然霰弹枪点 900px 外的天，圈会大得遮住半个屏幕 */
  return clamp(Math.tan(ang) * Math.max(0, dist) * VIEW_ZOOM + 5, 5, 150);
}

/* 屏幕上的下坠量（像素）：子弹飞到 dist 处时偏离瞄准线多少。

   不能直接 t = dist / speed —— 有 drag 的枪后半段会明显变慢，飞行时间比
   直线算的长得多，霰弹枪的下坠会被少算一半。所以这里按子弹的真实积分
   方式（先衰减速度、再累加位移）一步步走到 dist，拿到准确的飞行时间。
   偏移只取垂直于瞄准线的那一份重力：朝天打的时候子弹不会「掉」。 */
function aimDropPx(wp, dist, ang) {
  const g0 = wp.grav || 0;
  if (g0 <= 0 || !wp.speed || dist <= 0) return 0;

  const a = ang === undefined ? 0 : ang;
  /* 只有垂直于瞄准线的那一份重力让弹道偏离瞄准线：水平打满，
     朝天打几乎为零（子弹只会飞得慢一点，不会「掉」）。 */
  const g = g0 * Math.abs(Math.cos(a));

  const step = 1 / 240;
  const k = wp.drag > 0 ? Math.pow(1 - wp.drag, step) : 1;

  let s = 0, sp = wp.speed, vy = 0, y = 0;
  let guard = 0;
  while (s < dist && guard++ < 5000) {
    /* 与 updateBullets 完全同一套积分顺序：先走位移、再加重力、最后一起衰减，
       dist 取衰减后的速度 —— 不是「大概算一下」，是同一段代码的复刻。 */
    y += vy * step;
    vy += g * step;
    sp *= k; vy *= k;
    s += Math.hypot(sp, vy) * step;
  }
  return y * VIEW_ZOOM;
}

/* ---------- 音效（WebAudio 合成，无外部资源） ---------- */
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, gain, endFreq) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t + dur);
  g.gain.setValueAtTime(gain || 0.045, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxShot() { beep(rand(220, 260), 0.07, 'square', 0.035, 90); }
function sfxShotBig() { beep(rand(150, 180), 0.12, 'sawtooth', 0.05, 60); }
function sfxHit() { beep(rand(600, 760), 0.05, 'triangle', 0.03, 300); }
function sfxHurt() { beep(160, 0.18, 'sawtooth', 0.05, 70); }
function sfxBoom() { beep(90, 0.35, 'sawtooth', 0.08, 30); }
function sfxPick() { beep(880, 0.08, 'sine', 0.04, 1320); }
function sfxReload() { beep(420, 0.06, 'square', 0.03, 260); }
function sfxRevive() { beep(520, 0.12, 'sine', 0.05, 900); }
function sfxJump() { beep(240, 0.07, 'sine', 0.022, 420); }
function sfxLand() { beep(120, 0.06, 'sine', 0.02, 70); }
/* 震地蓄力：低频上滑的闷响，是「快跑」的唯一听觉提示。
   和开枪的高频完全错开，混战时也能听清。 */
function sfxCharge() { beep(70, 0.5, 'sawtooth', 0.055, 190); }
/* 防空警报：两声短 + 一声长，BOSS 入场专用。
   不用采样音，纯合成就能压过枪声，玩家一听就知道「大块头来了」。 */
function sfxAlarm() {
  beep(540, 0.20, 'square', 0.05, 360);
  setTimeout(() => beep(540, 0.20, 'square', 0.05, 360), 250);
  setTimeout(() => beep(540, 0.34, 'square', 0.05, 280), 500);
}

/* ---------- 粒子 / 飘字 / 痕迹 ---------- */
function spawnParticles(x, y, n, color, speed, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const s = rand(speed * 0.25, speed);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - speed * 0.25,
      life: rand(life * 0.5, life),
      max: life,
      color,
      size: rand(size * 0.5, size),
      grav: grav === undefined ? 900 : grav
    });
  }
}
/* 飘字：size 用于爆头这类需要「一眼看出来」的数字，默认与原来完全一致 */
function spawnText(x, y, str, color, opts) {
  const o = opts || {};
  texts.push({
    x, y, str, color: color || '#fff',
    life: o.life || 0.9,
    vy: o.vy === undefined ? -46 : o.vy,
    size: o.size || 1
  });
}
function addShake(v) { camera.shake = Math.min(22, camera.shake + v); }

/* 弹孔 / 血迹：贴在地面或平台表面的装饰痕迹 */
function addDecal(x, y, kind) {
  if (decals.length > 90) decals.shift();
  decals.push({ x, y, kind, life: kind === 'hole' ? 14 : 9, max: kind === 'hole' ? 14 : 9, r: kind === 'hole' ? rand(2, 3.4) : rand(5, 11) });
}

/* ------------------------------------------------------------------
   通用物理（单向平台，脚底坐标 e.y = 站立面高度）
   ------------------------------------------------------------------ */
function moveEntity(e, dt) {
  const prevBottom = e.y;
  const prevX = e.x;
  const wasOnGround = e.onGround;

  if (e.dropTimer > 0) e.dropTimer -= dt;
  if (e.jumpBuffer > 0) e.jumpBuffer -= dt;
  if (e.landSquash > 0) e.landSquash = Math.max(0, e.landSquash - dt * 5);

  e.vy += GRAV * dt;
  if (e.vy > VY_MAX) e.vy = VY_MAX;
  /* 挂伞缓降：下降速度锁死，落地自动收伞 */
  if (e.chute > 0 && e.vy > 92) e.vy = 92;

  /* 上升气流：托举力大于重力，在气流里只要离开地面就会被往上顶。
     要求「已经在空中」——站在风口的铁栅上不会被莫名其妙吸起来，
     但往里跳一下就飞了，跟用户说的「在上面跳可以飞到高处」一致。 */
  if ((e.kind === 'player' || e.kind === 'buddy') && !e.onGround) {
    const wind = windAt(e.x, e.y - e.h * 0.5);
    if (wind) {
      /* 只在「上升速度还没到上限」时补推力：
         否则会把刚起跳的 -1000 直接压回 -560，风里跳反而比外面矮。 */
      if (e.vy > -WIND_RISE_MAX) {
        e.vy -= WIND_ACCEL * dt;
        if (e.vy < -WIND_RISE_MAX) e.vy = -WIND_RISE_MAX;
      }
      e.inWind = true;
    } else {
      e.inWind = false;
    }
  } else if (e.inWind) {
    e.inWind = false;
  }

  e.x += e.vx * dt;
  const half = e.w / 2;

  /* 深渊崖边：AI 不会自己走下去（玩家不设限，踩空是他自己的事）。
     这里只做「脚下一半悬空就顶回去」，跨过缺口由 AI 层的起跳逻辑负责。 */
  e.pitEdge = 0;
  if (e.avoidPits && wasOnGround && !e.plat) {
    for (let i = 0; i < world.pits.length; i++) {
      const pit = world.pits[i];
      if (prevX + half <= pit.x + 1 && e.x + half > pit.x) {
        e.x = pit.x - half - 0.5;
        e.pitEdge = 1;
      } else if (prevX - half >= pit.x + pit.w - 1 && e.x - half < pit.x + pit.w) {
        e.x = pit.x + pit.w + half + 0.5;
        e.pitEdge = -1;
      }
    }
  }

  /* 实体障碍（木箱 / 油桶 / 路障）：脚底低于顶面时挡人，想过必须跳 */
  e.blocked = false;
  for (let i = 0; i < world.blocks.length; i++) {
    const b = world.blocks[i];
    if (b.hp <= 0) continue;
    if (e.y <= b.y + 2) continue;                 /* 站在顶面或更高处，不挡 */
    if (e.x + half <= b.x || e.x - half >= b.x + b.w) continue;
    if (prevX + half <= b.x + 1) e.x = b.x - half - 0.5;
    else if (prevX - half >= b.x + b.w - 1) e.x = b.x + b.w + half + 0.5;
    else {
      const toL = e.x - b.x, toR = b.x + b.w - e.x;
      e.x = toL < toR ? b.x - half - 0.5 : b.x + b.w + half + 0.5;
    }
    e.blocked = true;
  }

  e.x = clamp(e.x, half + 6, world.w - half - 6);

  const fallVy = e.vy;
  e.y += e.vy * dt;
  e.onGround = false;
  e.plat = null;

  /* 单向平台：只能从上方落到平台上，从下方可穿过 */
  if (e.vy >= 0 && !(e.dropTimer > 0)) {
    for (let i = 0; i < world.platforms.length; i++) {
      const p = world.platforms[i];
      if (p.ground) continue;
      if (e.x + half > p.x && e.x - half < p.x + p.w) {
        if (prevBottom <= p.y + 2 && e.y >= p.y) {
          e.y = p.y;
          e.vy = 0;
          e.onGround = true;
          e.plat = p;
        }
      }
    }
  }

  /* 障碍物顶面也能站（木箱上、集装箱顶） */
  if (e.vy >= 0 && !(e.dropTimer > 0) && !e.onGround) {
    for (let i = 0; i < world.blocks.length; i++) {
      const b = world.blocks[i];
      if (b.hp <= 0) continue;
      if (e.x + half > b.x + 1 && e.x - half < b.x + b.w - 1) {
        if (prevBottom <= b.y + 2 && e.y >= b.y) {
          e.y = b.y;
          e.vy = 0;
          e.onGround = true;
          e.plat = b;
        }
      }
    }
  }

  /* 地面：深渊那一段没有兜底，踩空就一直往下掉 */
  if (e.y >= world.groundY && groundAt(e.x)) {
    e.y = world.groundY;
    e.vy = 0;
    e.onGround = true;
    e.plat = null;
  }

  /* 落地收伞 */
  if (e.chute > 0 && e.onGround) e.chute = 0;
  if (e.chute !== undefined) {
    e.chuteVis = lerp(e.chuteVis || 0, e.chute > 0 ? 1 : 0, 1 - Math.pow(0.0004, dt));
  }

  /* 站到实地就把二段跳还给他（平台、地面、箱子顶都算） */
  if (e.onGround) e.airJumps = e.maxAirJumps === undefined ? MAX_AIR_JUMPS : e.maxAirJumps;

  /* 掉进深渊：标记一下，由 game.js 统一结算（那里才有伤害与结算逻辑） */
  if (!e.fell && e.y > world.groundY + FALL_DEPTH) e.fell = true;

  /* 落地反馈：下坠越快，压得越低 */
  if (e.onGround && !wasOnGround && fallVy > 280) {
    e.landSquash = clamp(fallVy / 1300, 0.25, 1);
    spawnParticles(e.x, e.y - 2, 5, '#9c8f78', 130, 0.3, 3, 700);
    if (fallVy > 700) {
      sfxLand();
      addShake(2);
    }
  }
}

/* 起跳：统一的入口，保证玩家与 AI 行为一致 */
function doJump(e) {
  e.vy = -JUMP_V;
  e.onGround = false;
  e.jumpBuffer = 0;
  sfxJump();
  spawnParticles(e.x, e.y - 2, 4, '#b8a98c', 110, 0.26, 3, 600);
}

/* 二段跳：空中再蹬一脚。用一格气浪环 + 短促的高频音，提醒「这一格用掉了」。
   空翻动画靠 airJumpT 驱动：起跳瞬间置满，渲染层据此团身转体。 */
function doAirJump(e) {
  if (!(e.airJumps > 0)) return false;
  e.airJumps--;
  e.vy = -JUMP_V2;
  e.jumpBuffer = 0;
  e.onGround = false;
  e.airJumpT = AIRJUMP_FLIP;
  e.flipDir = Math.cos(e.aim) >= 0 ? 1 : -1;
  particles.push({
    x: e.x, y: e.y - e.h * 0.55, vx: 0, vy: 0,
    life: 0.26, max: 0.26, color: 'rgba(206,232,255,0.9)', size: 16, grav: 0, ring: true
  });
  spawnParticles(e.x, e.y - e.h * 0.45, 6, '#bcd8f0', 160, 0.3, 3, 520);
  beep(430, 0.07, 'sine', 0.022, 760);
  return true;
}

/* x 处有没有实地（深渊处没有） */
function groundAt(x) {
  for (let i = 0; i < world.pits.length; i++) {
    const p = world.pits[i];
    if (x > p.x + 2 && x < p.x + p.w - 2) return false;
  }
  return true;
}

/* (x, y) 是否在上升气流的柱子里（y 用身体中段） */
function windAt(x, y) {
  for (let i = 0; i < world.winds.length; i++) {
    const wd = world.winds[i];
    if (x > wd.x && x < wd.x + wd.w && y > wd.top && y < wd.y + 6) return wd;
  }
  return null;
}

/* 指定 x、y 下方最近的可站立面（平台或地面）。
   深渊正上方返回一个很深的假底，让手雷 / 补给掉进洞里而不是浮在半空。 */
function surfaceBelow(x, y) {
  let best = groundAt(x) ? world.groundY : world.groundY + FALL_DEPTH + 60;
  for (const p of world.platforms) {
    if (p.ground) continue;
    if (x > p.x && x < p.x + p.w && p.y >= y - 6 && p.y < best) best = p.y;
  }
  return best;
}

/* 圆点是否命中脚底坐标实体 */
function pointHitEntity(bx, by, r, e) {
  if (e.dead || e.downed) return false;
  const half = e.w / 2 + r;
  return bx > e.x - half && bx < e.x + half && by > e.y - e.h - r && by < e.y + r;
}

/* ------------------------------------------------------------------
   关卡地形
   三层高度全部保证「从下层跳得上去」：
     地面 600 → 低台 476（差 124，跳高 238）
     地面 600 → 中台 384（差 216，需要满跳，留 22px 余量）
     低台 476 → 中台 384（差  92）
     中台 384 → 高台 296（差  88）
     低台 476 → 高台 296（差 180，水平重叠，可直接上）
   ------------------------------------------------------------------ */
const TIER_LOW = 476;
const TIER_MID = 384;
const TIER_HIGH = 296;

/* ---------------- 关卡主题 ----------------
   三关不只是「更长更硬」，地形构成和色调都要换：
     1 破晓街区 —— 街面开阔、路灯亮着、油桶木箱沙袋，教学关
     2 焦土废墟 —— 半塌砖墙当硬掩体、火点多、路灯全灭，视线最差
     3 敌方指挥部 —— 集装箱成组、铁丝网、探照灯扫射，硬掩体最多
   grade：整屏调色（overlay 混合），fireMul / beamMul：远处火光与探照灯强度
   ------------------------------------------ */
const STAGE_THEMES = [
  { key: 'street', name: '破晓街区', grade: 'rgba(88,132,186,0.13)', fireMul: 0.65, beamMul: 0.45 },
  { key: 'ruins',  name: '焦土废墟', grade: 'rgba(206,104,44,0.16)', fireMul: 1.75, beamMul: 0.20 },
  { key: 'hq',     name: '敌方指挥部', grade: 'rgba(70,176,146,0.12)', fireMul: 0.45, beamMul: 1.70 }
];

function stageTheme(st) {
  return STAGE_THEMES[(clamp(st, 1, 5) - 1) % STAGE_THEMES.length];
}

function buildStage(stage) {
  const st = clamp(stage, 1, 5);
  const theme = stageTheme(st);
  world.theme = theme;
  world.w = 3200 + Math.min(600, (st - 1) * 120);
  const w = world.w;
  const gy = world.groundY;

  world.platforms = [{ x: 0, y: gy, w: w, h: 200, ground: true }];
  world.covers = [];
  world.blocks = [];
  world.props = [];
  world.pits = [];
  world.hazards = [];
  world.winds = [];

  /* 深渊：地面缺一段。掉进去直接死（不是掉血，是这局就没了）。 */
  const pitAt = (x, pw, kind) => {
    world.pits.push({ x: x, w: pw, kind: kind || 'crater' });
  };
  /* 这个矩形是否压着深渊 / 气流口 —— 压着就不许放箱子、沙袋、装饰，
     否则会出现「木箱浮在坑上」「沙袋埋在气流里」这种一眼假的画面。 */
  const overPit = (x, bw) => {
    for (let i = 0; i < world.pits.length; i++) {
      const p = world.pits[i];
      if (x < p.x + p.w + 12 && x + bw > p.x - 12) return true;
    }
    return false;
  };
  const overWind = (x, bw) => {
    for (let i = 0; i < world.winds.length; i++) {
      const wd = world.winds[i];
      if (x < wd.x + wd.w + 10 && x + bw > wd.x - 10) return true;
    }
    return false;
  };
  /* 这块地能不能放机关：不能压着深渊、气流、已有障碍 */
  const freeGround = (x, bw) => {
    if (overPit(x, bw) || overWind(x, bw)) return false;
    for (let i = 0; i < world.blocks.length; i++) {
      const b = world.blocks[i];
      if (x < b.x + b.w + 8 && x + bw > b.x - 8) return false;
    }
    for (let i = 0; i < world.covers.length; i++) {
      const c = world.covers[i];
      if (x < c.x + c.w + 8 && x + bw > c.x - 8) return false;
    }
    return true;
  };

  /* 实体障碍：y 是「顶面」，和平台一样可以站上去 */
  const block = (kind, x, top, bw, bh, hp, extra) => {
    if (overPit(x, bw) || overWind(x, bw)) return;      /* 深渊与风口上不放箱子 */
    world.blocks.push(Object.assign({
      kind: kind, x: x, y: top, w: bw, h: bh, hp: hp, maxHp: hp, hit: 0, dead: false, solid: true
    }, extra || {}));
  };
  const cover = (x, bw, bh, hp) => {
    if (overPit(x, bw) || overWind(x, bw)) return;
    world.covers.push({ x: x, y: gy, w: bw, h: bh, hp: hp, maxHp: hp, hit: 0 });
  };

  let idx = 0;
  for (let bx = 300; bx < w - 380; bx += 640, idx++) {
    const lowW = 196 + (idx % 3) * 34;

    /* --- 深渊：本关最重要的地形压力 ---
       街道是炸弹坑，废墟是整片塌陷的楼板，指挥部是被炸开的后勤壕沟。
       宽度控制在 150 以内（满速起跳的水平射程约 270px），跳得过去但不敢乱跳。 */
    if (theme.key === 'street' && idx % 2 === 1) pitAt(bx + 604, 132, 'crater');
    else if (theme.key === 'ruins' && idx % 2 === 0) pitAt(bx + 596, 168, 'chasm');
    else if (theme.key === 'hq' && idx % 2 === 1) pitAt(bx + 600, 150, 'trench');

    /* --- 三层平台：高度恒定，只改宽度和数量，跳跃可达性不会被破坏 --- */
    world.platforms.push({ x: bx, y: TIER_LOW, w: lowW, h: 20, mat: 'steel', rail: true });
    world.platforms.push({ x: bx + lowW + 56, y: TIER_MID, w: 176 + (idx % 2) * 46, h: 26, mat: 'concrete' });
    if (idx % 2 === 0) {
      world.platforms.push({ x: bx + 92, y: TIER_HIGH, w: 160, h: 18, mat: 'crate', rail: true });
      /* --- 上升气流：正好托到高台边上。
         风口垫在低位钢架下面，人跳进去被顶到 296 以上，松开就能落到木箱台上；
         站偏了（x < 392）会落在低位钢架上，属于「差一点」的正常失手。

         但风口不能压在深渊上：段距 640 < 坑口末端 736，上一段的坑正好咬住
         bx+58 这个默认位置 38px（废墟坑更宽，咬 66px）。压上去有两个后果——
         坑右边缘成了蹦床（掉进去被气流顶回来，本该摔死却摔不死），
         画面上还立着一根蓝柱子直插坑口。所以按 26px 往右让，让到整段落在实地上；
         让不出去（缺口太长）就干脆不放风口，绝不留一个「坑里冒风」的现场。 */
      let wx = bx + 58;
      for (let t = 0; t < 5 && overPit(wx - 24, 104); t++) wx += 26;
      if (!overPit(wx - 24, 104)) {
        world.winds.push({ x: wx, w: 104, y: gy, top: TIER_HIGH - 64, phase: idx * 1.7 });
      }
    }
    /* 废墟：塌了半边的楼板，比别的关卡少一层高台 */
    if (theme.key === 'ruins' && idx % 3 === 0) {
      world.platforms.push({ x: bx + 300, y: TIER_MID, w: 128, h: 24, mat: 'concrete' });
    }
    /* 指挥部：火线最立体，几乎每段都补一层中台 */
    if (theme.key === 'hq' && idx % 2 === 1) {
      world.platforms.push({ x: bx + 470, y: TIER_MID, w: 140, h: 24, mat: 'concrete' });
    }

    /* --- 沙袋掩体（挡子弹、可打坏） --- */
    if (theme.key === 'street') {
      if (idx % 2 === 1) cover(bx + 40, 98, 44, 280);
    } else if (theme.key === 'ruins') {
      /* 废墟里沙袋被掀了大半，只剩零星几堆 */
      if (idx % 3 === 0) cover(bx + 56, 80, 38, 190);
    } else {
      /* 指挥部：沙袋码得更规整、更结实 */
      if (idx % 2 === 0) cover(bx + 40, 104, 48, 360);
    }

    /* --- 实体障碍：挡人、挡弹，木箱油桶能打爆 --- */
    if (theme.key === 'street') {
      /* 街区：油桶 + 木箱 + 条纹路障，通道最宽 */
      if (idx % 2 === 0) block('barrel', bx - 96, gy - 58, 38, 58, 80, { explode: 108, explodeDmg: 74 });
      block('crate', bx + lowW + 6, gy - 52, 52, 52, 170);
      block('barrier', bx + 468, gy - 40, 112, 40, 9999);
      if (idx % 3 === 1) block('crate', bx + 300, gy - 52, 52, 52, 170);
    } else if (theme.key === 'ruins') {
      /* 废墟：半塌砖墙当硬掩体，高度够蹲也能挡弹，但挡不完视线 */
      block('rubblewall', bx + 452, gy - 74, 96 + (idx % 3) * 22, 74, 9999);
      if (idx % 2 === 0) block('rubblewall', bx + 148, gy - 56, 84, 56, 9999);
      if (idx % 2 === 1) block('barrel', bx - 96, gy - 58, 38, 58, 80, { explode: 118, explodeDmg: 82 });
      if (idx % 3 === 0) block('crate', bx + lowW + 6, gy - 52, 52, 52, 150);
    } else {
      /* 指挥部：集装箱成组堆叠 + 铁丝网，硬掩体最多 */
      block('container', bx + 466, gy - 88, 152, 88, 9999);
      if (idx % 2 === 0) block('container', bx + 300, gy - 88, 100, 88, 9999);
      block('wire', bx + 118, gy - 52, 26, 52, 9999);
      if (idx % 2 === 1) block('barrel', bx - 96, gy - 58, 38, 58, 80, { explode: 112, explodeDmg: 78 });
      if (idx % 3 === 1) block('crate', bx + lowW + 6, gy - 52, 52, 52, 170);
    }

    /* --- 纯装饰：路灯亮度与碎石密度按主题走 --- */
    if (theme.key === 'street') {
      if (idx % 2 === 0) world.props.push({ x: bx + 250, y: gy, kind: 'lamp', seed: idx + 3 });
      world.props.push({ x: bx + 150, y: gy, kind: 'rubble', seed: idx * 5 + 2 });
    } else if (theme.key === 'ruins') {
      /* 路灯全灭，满地碎石与断钢筋 */
      world.props.push({ x: bx + 132, y: gy, kind: 'rubble', seed: idx * 5 + 2 });
      world.props.push({ x: bx + 268, y: gy, kind: 'rubble', seed: idx * 7 + 9 });
      world.props.push({ x: bx + 392, y: gy, kind: 'rubble', seed: idx * 3 + 5 });
    } else {
      if (idx % 3 === 0) world.props.push({ x: bx + 250, y: gy, kind: 'lamp', seed: idx + 3 });
      world.props.push({ x: bx + 208, y: gy, kind: 'rubble', seed: idx * 5 + 2 });
    }
  }

  /* ---------------- 场景机关 ----------------
     地刺：贴地一排尖刺，踩上去持续掉血并被弹开；
     喷火口：地面裂口周期性喷火，先冒火星预警、再窜出火柱，窜火时烫伤。
     两者都不挡子弹，纯粹是地形压力，逼着人别在一条水平线上站着对枪。 */
  const hazClear = (x, bw) => {
    if (!freeGround(x, bw)) return false;
    for (let i = 0; i < world.pits.length; i++) {
      const p = world.pits[i];
      /* 坑口前后各留一段空地：起跳要有助跑、落地要有站的地方 */
      if (x < p.x + p.w + 88 && x + bw > p.x - 40) return false;
    }
    for (let i = 0; i < world.hazards.length; i++) {
      const hz = world.hazards[i];
      if (x < hz.x + hz.w + 104 && x + bw > hz.x - 104) return false;   /* 机关之间别挨太近 */
    }
    return true;
  };
  const spikeAt = (x, bw) => world.hazards.push({
    kind: 'spike', x: x, y: gy, w: bw, h: 22, dmg: 16, cd: 0, seed: world.hazards.length
  });
  const flameAt = (x, bw, phase) => world.hazards.push({
    kind: 'flame', x: x, y: gy, w: bw, h: 178,
    t: phase, period: 2.8, warn: 1.0, dmg: 12,
    firing: 0, seed: world.hazards.length
  });

  /* 各关的密度差：街道零星钉刺板，废墟断气管一路漏气，指挥部到处是油火 */
  const wantSpike = theme.key === 'street' ? 3 : theme.key === 'ruins' ? 2 : 2;
  const wantFlame = theme.key === 'street' ? 1 : theme.key === 'ruins' ? 2 : 3;
  for (let i = 0, placed = 0; i < 500 && placed < wantSpike; i++) {
    const x = 470 + i * 26;
    if (x > w - 470) break;
    if (!hazClear(x, 96)) continue;
    spikeAt(x, 96);
    placed++;
  }
  for (let i = 0, placed = 0; i < 500 && placed < wantFlame; i++) {
    const x = 640 + i * 30;
    if (x > w - 470) break;
    if (!hazClear(x, 68)) continue;
    flameAt(x, 68, (i * 0.83) % 2.8);
    placed++;
  }

  /* 关卡尽头收尾平台 */
  world.platforms.push({ x: w - 320, y: TIER_LOW, w: 240, h: 20, mat: 'steel', rail: true });
}
