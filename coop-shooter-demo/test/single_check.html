/* ---------------- 子弹 ----------------
   opts 直接吃武器表（rocket / blast / blastDmg / pierce / tracer / range）
   弹道三项：grav（下坠）/ drag（减速）/ falloff（远端伤害衰减）
   bw 只是画面上的粗细，r 才是判定半径 —— 曳光再细，判定也不缩水
   ---------------------------------- */

/* 按「极限射程」反推子弹寿命。
   为什么不让表里直接写 life：drag 会让速度指数衰减，射程和寿命不是线性关系，
   每改一次 speed/drag 就得手算一遍 life，很容易出现「表上写 3800 实际只飞 2400」。
   这里直接解出来：
     有 drag 时 距离(t) = v0/k × (1 − e^(−kt))，k = −ln(1−drag)
     反解 t = −ln(1 − 目标距离 × k / v0) / k
   括号里的值逼近 0 说明射程已经接近理论上限 v0/k，物理上到不了 —— 这时按直线算，
   子弹会提前散掉（表现是「这把枪打不了那么远」），比悄悄飞不到要诚实。 */
function lifeForRange(range, speed, drag) {
  const need = range * 1.04;                  /* 多给 4%，免得残差刚好卡在边缘 */
  const k = drag > 0 ? -Math.log(1 - drag) : 0;
  let t;
  if (k > 0 && need * k / speed < 0.96) {
    t = -Math.log(1 - need * k / speed) / k;
  } else {
    t = need / Math.max(120, speed);
  }
  return Math.min(t, 6);                      /* 上限 6 秒，避免极端参数让子弹挂着不走 */
}

function spawnBullet(x, y, vx, vy, dmg, team, color, size, owner, opts) {
  const o = opts || {};
  const spd = Math.hypot(vx, vy) || 1;
  const range = o.range || 0;
  bullets.push({
    x, y, vx, vy, dmg, team,
    color: color || '#ffd88a',
    r: size || 3.2,
    w: o.bw || size || 3.2,
    /* 玩家武器按 range 反推寿命；敌人子弹没有 range，回落到旧的三档硬编码 */
    life: o.life || (range > 0 ? lifeForRange(range, spd, o.drag || 0)
      : (o.rocket ? 3.4 : (o.tracer ? 3.0 : 2.2))),
    range: range,                /* 飞到这里就消散 —— 这就是「极限射程」 */
    owner: owner || team,
    px: x, py: y,
    rocket: !!o.rocket,
    blast: o.blast || 0,
    blastDmg: o.blastDmg || 0,
    pierce: o.pierce || 0,
    tracer: !!o.tracer,
    tracerLen: o.tracerLen || 300,
    grav: o.grav || 0,
    drag: o.drag || 0,
    falloff: o.falloff || 0,
    dist: 0,                     /* 已经飞了多远（伤害衰减、曳光衰减都看它） */
    /* 射手站的那块平台不挡自己的子弹（见 platformBlocks） */
    ignorePlat: o.ignorePlat || null,
    hits: o.pierce ? [] : null
  });
}

function spawnGrenade(x, y, vx, vy, dmg, team, opts) {
  grenades.push(Object.assign(
    { x, y, vx, vy, dmg, team, fuse: 1.6, spin: 0, r: 6, fire: false },
    opts || {}
  ));
}

/* 火焰地带：燃烧瓶炸开后留在地上的持续伤害区域。
   dmg 是每次灼烧的伤害，tick 是灼烧间隔 —— 站着不动会被慢慢烧死。 */
function spawnFire(x, y, r, life, dmg) {
  fires.push({ x, y, r, life, max: life, dmg, tick: 0.3, seed: Math.random() * 6.28 });
}

function spawnPickup(x, y, type) {
  pickups.push({
    x, y, vx: rand(-60, 60), vy: -260, type,
    life: 20, bob: rand(0, 6.28), onGround: false
  });
}

/* ---------------- 沙袋掩体 / 实体障碍 ----------------
   两者字段一致（x, y=顶面, w, h, hp），统一按同一条链路处理：
   挡子弹 → 掉血 → 打穿后爆成碎块
   -------------------------------------------------- */
function coverBlocks(x, y) {
  for (let i = 0; i < world.covers.length; i++) {
    const c = world.covers[i];
    if (c.hp <= 0) continue;
    if (x > c.x && x < c.x + c.w && y > c.y - c.h && y < c.y) return c;
  }
  for (let i = 0; i < world.blocks.length; i++) {
    const b = world.blocks[i];
    if (b.hp <= 0) continue;
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return b;
  }
  return null;
}

/* ---------------- 空中平台也挡子弹 ----------------
   台阶、钢板台、混凝土台都是实心梁，弹道撞上就该停 —— 不只是木箱油桶才挡。
   判定只取「顶面以下的实体部分」：站在平台上开枪时枪口在顶面之上，
   不会被自己脚下这块吃掉；而从下方仰射、从侧面平射都会实打实撞上。 */
function platformBlocks(x, y, ignore) {
  for (let i = 0; i < world.platforms.length; i++) {
    const p = world.platforms[i];
    if (p.ground) continue;
    /* 射手自己脚下这块不挡自己 —— 否则站在高台上对下方等于完全失明，
       大肥鱼和敌兵也会隔着脚下的板子打一整局空枪。 */
    if (ignore && p === ignore) continue;
    if (x > p.x && x < p.x + p.w && y > p.y && y < p.y + p.h) return p;
  }
  return null;
}

/* 打在平台上：钢结构迸白火星，混凝土掉灰渣，顺带留一点弹着痕迹 */
function hitPlatform(p, x, y) {
  const steel = p.mat === 'steel';
  /* 弹着点先来一下白热闪光：光靠几颗 2px 的小火星，在暗掉的街景里几乎看不见。
     闪光只有 0.09 秒，不会在画面上留下长期的脏点。 */
  particles.push({
    x: x, y: y, vx: 0, vy: 0, life: 0.09, max: 0.09,
    color: '#fff6d8', size: 7, grav: 0, ball: true
  });
  /* 火星速度收窄到 170，打出来的是一小簇而不是散一屏的粉末 */
  spawnParticles(x, y, steel ? 5 : 4, steel ? '#d6ecff' : '#ded4c4', 170, 0.26, 2.6, 900);
  spawnParticles(x, y, 2, '#8a8175', 70, 0.45, 3.2, 260);
  /* 金属叮声只是偶尔来一下，连着打满屏会很吵 */
  if (steel && Math.random() < 0.22) beep(rand(1500, 2000), 0.04, 'square', 0.01, 700);
}

/* 某个矩形是否和实体障碍重叠（敌人/大肥鱼走位前用） */
function blockedAt(x, y, w) {
  const half = w * 0.5;
  for (let i = 0; i < world.blocks.length; i++) {
    const b = world.blocks[i];
    if (b.hp <= 0) continue;
    if (x + half > b.x && x - half < b.x + b.w && y > b.y + 2) return b;
  }
  return null;
}

function hurtCover(c, dmg, x, y) {
  c.hit = 0.14;
  spawnParticles(x, y, 3, c.kind === 'container' || c.kind === 'barrier' ? '#b9b3a4' : '#c2ab7a', 170, 0.32, 2.6, 780);
  if (c.hp >= 9999) return;            /* 混凝土 / 集装箱：只掉火星，打不穿 */
  c.hp -= dmg;
  if (c.hp <= 0) {
    c.hp = 0;
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    if (c.explode) {
      /* 油桶：炸开，连带伤害周围 */
      explode(cx, cy, c.explode, c.explodeDmg, 'world');
    } else {
      sfxBoom();
      addShake(4);
      spawnParticles(cx, cy, 22, '#b39b6a', 320, 0.75, 6, 780);
      spawnParticles(cx, cy, 12, '#6b5c42', 200, 0.95, 8, 500);
    }
    spawnText(cx, c.y - 8, c.kind === 'barrel' ? '油桶爆炸' : '掩体被打穿', '#ffb066');
  }
}

/* ---------------- 命中部位 ----------------
   人形按「脚底坐标 e.y、身高 e.h」从头顶往下切三段：
   头 0~22% / 躯干 22~62% / 腿 62~100%（和 drawEnemy 里 -58~0 的比例对得上）。
   爆头 2 倍是这套系统的意义所在 —— 让「瞄得准」比「按得久」更划算；
   腿 0.68 倍不是惩罚，压枪扫腿能更快把冲上来的兵打停。
   BOSS 也分部位，但头上有头盔，倍率收到 1.45 而不是 2.0。 */
const HIT_PARTS = [
  { key: 'head', hi: 0.22, mul: 2.00, mulBoss: 1.45 },
  { key: 'torso', hi: 0.62, mul: 1.00, mulBoss: 1.00 },
  { key: 'legs', hi: 9.99, mul: 0.68, mulBoss: 0.85 }
];

/* 命中点落在哪个部位（hy 是世界坐标的弹着点） */
function hitPart(e, hy) {
  const h = e.h || 1;
  const frac = clamp((hy - (e.y - h)) / h, 0, 0.999);
  for (let i = 0; i < HIT_PARTS.length; i++) {
    if (frac < HIT_PARTS[i].hi) return HIT_PARTS[i];
  }
  return HIT_PARTS[1];
}

/* ---------------- 伤害 ---------------- */
function damageEnemy(e, dmg, hx, hy, src) {
  if (e.dead) return;
  e.lastSrc = src || e.lastSrc;

  const t = ENEMY_TYPES[e.type] || {};
  let d = dmg;

  /* 部位倍率：只有拿到弹着点才算，爆炸溅射走的是躯干中心，天然 1.0 倍 */
  const part = (typeof hy === 'number') ? hitPart(e, hy) : HIT_PARTS[1];
  const mul = e.boss ? part.mulBoss : part.mul;
  d *= mul;
  e.lastPart = part.key;

  /* 钢铁典狱长：正面装甲吃掉 55% 伤害。
     必须先算「子弹从哪边来」，所以 hx 不能省 —— 绕到背后打才疼。
     装甲和部位倍率是叠乘的：正面爆头 1.45×0.45 ≈ 0.65，绕背爆头就是实打实 1.45。 */
  if (t.armor && typeof hx === 'number') {
    const facing = Math.cos(e.aim) >= 0 ? 1 : -1;
    if (Math.sign(hx - e.x) === facing) {
      d *= t.armor;
      if (Math.random() < 0.4) spawnText(hx, hy - 16, '叮', '#9fd8ff');
    }
  }

  e.hp -= d;
  e.flash = 0.12;

  if (part.key === 'head') {
    /* 爆头：血雾更浓、数字更大，玩家不看数字也知道这一枪打对了地方 */
    spawnParticles(hx, hy, 9, '#ff6b5a', 260, 0.45, 3.4, 640);
    spawnParticles(hx, hy, 4, '#ffd166', 190, 0.3, 2.4, 520);
    spawnText(hx, hy - 12, '爆头 ' + Math.round(d), '#ffe08a', { size: 1.3, life: 1.1, vy: -54 });
  } else if (part.key === 'legs') {
    spawnParticles(hx, hy, 3, '#c9534a', 180, 0.3, 2.6, 640);
    spawnText(hx, hy - 10, Math.round(d), '#a8c4d4', { size: 0.9 });
  } else {
    spawnParticles(hx, hy, 4, '#ff6b5a', 220, 0.35, 3, 600);
    spawnText(hx, hy - 10, Math.round(d), '#ffd166');
  }

  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  game.kills++;
  game.score += ENEMY_TYPES[e.type].score;
  if (e.lastSrc === 'buddy') game.tele.buddyKills++;
  else if (e.lastSrc === 'player') game.tele.playerKills++;
  /* 尸体：被打死的人不会「啪」一下消失。留一具会软下去的躯体，
     等它躺稳了再淡出 —— 掉进深渊的除外（坑里没有地面可以躺）。 */
  if (!e.fell) spawnCorpse(e, player && player.x > e.x ? -1 : 1);
  spawnParticles(e.x, e.y - e.h / 2, e.boss ? 60 : 22, '#ff7b54', e.boss ? 520 : 320, 0.8, e.boss ? 8 : 5, 900);
  spawnParticles(e.x, e.y - e.h / 2, e.boss ? 30 : 10, '#3a3a3a', 260, 0.7, e.boss ? 9 : 6, 700);
  addShake(e.boss ? 16 : 3);
  addDecal(e.x, e.y - 2, 'blood');

  if (e.boss) {
    /* ---- BOSS 击破演出：慢动作 + 白闪 + 连环爆 ----
       普通敌人倒地是「啪」一下，BOSS 必须给三秒钟的开香槟时间。 */
    game.slowmo = 1.15;
    game.screenFlash = Math.max(game.screenFlash || 0, 0.62);
    game.bossIntro = null;
    addShake(20);
    sfxBoom();
    /* 沿躯干补爆三点，配合慢动作能看清火球一层层炸开 */
    const top = e.y - e.h;
    for (let i = 0; i < 3; i++) {
      const ex = e.x + rand(-e.w * 0.45, e.w * 0.45);
      const ey = top + e.h * (0.18 + i * 0.30);
      explode(ex, ey, 86 + i * 14, 26, 'player');
    }
    spawnText(e.x, top - 46, 'BOSS 击破', '#ffd166');
    say('buddy', '倒下了！这家伙终于躺了！');
    spawnPickup(e.x - 42, e.y - 40, 'health');
    spawnPickup(e.x + 42, e.y - 40, 'health');
    spawnPickup(e.x, e.y - 54, 'ammo');
    return;
  }

  const r = Math.random();
  if (r < 0.22) spawnPickup(e.x, e.y - 30, 'health');
  else if (r < 0.55) spawnPickup(e.x, e.y - 30, 'ammo');
}

/* ---------------- 尸体 ----------------
   不是为了「更血腥」，是为了让击杀有重量：人被打中会先失去支撑，
   膝盖折下去、上身歪倒、手臂最后才落下 —— 落地还有一次余震。
   这些全部由 t 一个计时器推出来，渲染层不做状态机。
   -------------------------------------- */
function spawnCorpse(e, dir) {
  const ty = ENEMY_TYPES[e.type] || {};
  corpses.push({
    x: e.x,
    y: e.y,
    h: e.baseH || e.h,
    dir: dir >= 0 ? 1 : -1,
    color: e.color || ty.color || '#8a4a4a',
    dark: e.dark || ty.dark || '#5a3030',
    boss: !!e.boss,
    look: e.look || null,
    vy: 0,
    t: 0,
    life: CORPSE_LIFE + rand(0, 2.2),
    seed: Math.random() * 6.28,
    /* 站在地上死的立刻开始软；空中打下来的要先掉一段再塌 */
    landed: (surfaceBelow(e.x, e.y) - e.y) < 8
  });
}

function damageFriendly(actor, dmg) {
  if (actor.dead || actor.downed || actor.invuln > 0) return;
  actor.hp -= dmg;
  actor.flash = 0.16;
  actor.invuln = 0.18;
  actor.lastHurt = game.time;
  sfxHurt();
  addShake(4);
  spawnParticles(actor.x, actor.y - actor.h * 0.6, 8, '#d94a4a', 200, 0.4, 3.5, 700);
  spawnText(actor.x, actor.y - actor.h - 6, '-' + Math.round(dmg), '#ff5a5a');
  addDecal(actor.x + rand(-8, 8), actor.y - 2, 'blood');
  if (actor.hp <= 0) {
    actor.hp = 0;
    actor.downed = true;
    actor.downedAt = game.time;      /* 倒地动画的起点：从站姿软下去，不是瞬间躺平 */
    actor.downTimer = actor.kind === 'player' ? 12 : 14;
    actor.reviveProgress = 0;
    actor.vx = 0;
    if (actor.kind === 'player') say('buddy', '指挥官倒下了！撑住，我过来了！');
    else say('buddy', '本鱼挂彩了……掩护我！');
    addShake(10);
    if (actor.kind === 'buddy') game.buddyDownAt = game.time;
  }
}

/* ---------------- 大肥鱼气泡 ---------------- */
let sayCooldown = 0;
function say(who, text) {
  if (!buddy || buddy.dead) return;
  if (sayCooldown > 0 && buddy.bubble !== text) return;
  buddy.bubble = text;
  buddy.bubbleTimer = 2.6;
  sayCooldown = 2.2;
}


/* ===== ai.js ===== */
'use strict';

/* ==================================================================
   AI 层：大肥鱼（队友）的战术大脑 + 敌兵行为
   ------------------------------------------------------------------
   大肥鱼 v2 = 感知（子弹/敌人/补给） → 评估（威胁打分） → 执行（走位/躲弹/开火）
   每个决策都写进 b.log，HUD 的「战术面板」实时显示他在想什么。
   ================================================================== */

function nearestEnemy(x, maxDist) {
  let best = null, bd = maxDist || 1e9;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const d = Math.abs(e.x - x);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function countEnemiesNear(x, y, radius) {
  let n = 0;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    if (distTo(e.x, e.y - e.h * 0.5, x, y) < radius) n++;
  }
  return n;
}

/* 面向 target 开火（玩家/大肥鱼通用射击函数） */
function fireWeapon(a, wp, aimAngle, spreadMul, dmgMul) {
  const mx = a.x + Math.cos(aimAngle) * 30;
  const my = a.y - a.h * 0.62 + Math.sin(aimAngle) * 30;
  /* wp 直接当子弹配置用，这里补一条「忽略自己脚下的平台」 */
  const opts = Object.assign({}, wp, { ignorePlat: a.plat });
  for (let i = 0; i < wp.pellets; i++) {
    const ang = aimAngle + rand(-wp.spread, wp.spread) * spreadMul;
    spawnBullet(mx, my, Math.cos(ang) * wp.speed, Math.sin(ang) * wp.speed,
      wp.dmg * (dmgMul || 1), a.kind === 'buddy' ? 'ally' : a.kind, wp.color,
      wp.rocket ? 5.4 : (wp.tracer ? 2.6 : 3.2), a.kind, opts);
  }
  a.muzzle = 0.06;
  spawnParticles(mx, my, 3, '#ffdd99', 160, 0.16, 3, 0);
  if (wp.sfx === 'big') sfxShotBig(); else sfxShot();
  a.fireCd = wp.rate;
  casings.push({
    x: mx, y: my, vx: -Math.cos(aimAngle) * 90 + rand(-40, 40),
    vy: -rand(80, 160), life: 1.2, rot: rand(0, 6.28), spin: rand(-14, 14)
  });
}

/* ==================================================================
   大肥鱼：战斗风格
   ================================================================== */
const BUDDY_STYLES = [
  { key: 'cautious', name: '谨慎', retreatAt: 0.46, healTo: 0.80, rangeMul: 1.2, dodge: 0.85, chase: 0.7,
    desc: '远离火线，血少立刻后撤' },
  { key: 'balanced', name: '均衡', retreatAt: 0.34, healTo: 0.64, rangeMul: 1.0, dodge: 0.8, chase: 1.0,
    desc: '攻守各一半，常规打法' },
  { key: 'aggro', name: '突击', retreatAt: 0.22, healTo: 0.42, rangeMul: 0.7, dodge: 0.55, chase: 1.5,
    desc: '贴着敌人打，血条见底才退' }
];

/* 记录一条决策日志（面板上会滚动显示）。敌兵没有日志数组，直接忽略。 */
function blog(b, text) {
  if (!b || !b.log) return;
  b.log.push({ t: game.time, text: text });
  if (b.log.length > 8) b.log.shift();
  game.tele.decisions++;
}

function setIntent(b, intent, reason) {
  if (b.intent !== intent) {
    b.intent = intent;
    b.intentSince = game.time;
    blog(b, '转入【' + INTENT_NAMES[intent] + '】' + (reason ? '：' + reason : ''));
  } else if (b.reason !== reason) {
    b.reason = reason;
  }
  b.reason = reason;
}

const INTENT_NAMES = {
  FOLLOW: '跟随', ENGAGE: '交战', RETREAT: '撤离', REVIVE: '救援', GRAB: '取补给', HOLD: '守点'
};

/* ---------------- 感知：来袭弹道 ---------------- */
/* 预测 horizon 秒内会擦到身体的敌方子弹，返回数量与最近命中时间 */
function scanIncoming(b, horizon) {
  const cx = b.x, topY = b.y - b.h, midY = b.y - b.h * 0.5;
  let count = 0, minT = 99, fromRight = 0;
  for (let i = 0; i < bullets.length; i++) {
    const u = bullets[i];
    if (u.team !== 'enemy') continue;
    const sp2 = u.vx * u.vx + u.vy * u.vy;
    if (sp2 < 400) continue;
    const rx = cx - u.x, ry = midY - u.y;
    const t = (rx * u.vx + ry * u.vy) / sp2;
    if (t < 0 || t > horizon) continue;
    const px = u.x + u.vx * t;
    const py = u.y + u.vy * t;
    if (px < cx - 30 || px > cx + 30) continue;      /* 不在身体横向范围 */
    if (py < topY - 26 || py > b.y + 8) continue;    /* 不在身体纵向范围 */
    count++;
    if (t < minT) { minT = t; fromRight = u.vx < 0 ? 1 : -1; }
  }
  return { count, minT, fromRight };
}

/* ---------------- 感知：身边的补给 ---------------- */
function wantPickup(b) {
  const lowHp = b.hp < b.maxHp * 0.72;
  const lowAmmo = (b.mags[0] + b.mags[2]) < 20;
  let best = null, bd = 1e9;
  for (let i = 0; i < pickups.length; i++) {
    const pk = pickups[i];
    if (pk.type === 'health' && !lowHp) continue;
    if (pk.type === 'ammo' && !lowAmmo) continue;
    const d = Math.abs(pk.x - b.x);
    if (d < 460 && d < bd) { bd = d; best = pk; }
  }
  return best;
}

/* ---------------- 评估：目标打分 ---------------- */
function scoreTarget(e, b) {
  const p = player;
  const dSelf = Math.hypot(e.x - b.x, (e.y - e.h * 0.5) - (b.y - b.h * 0.5)) + 1;
  const dPlayer = p ? Math.abs(e.x - p.x) : 9999;
  /* 以「离指挥官的远近」为主，其次才是自己顺手 */
  let s = 900 / (dPlayer * 0.65 + dSelf * 0.35 + 1);
  if (e.hp <= 34) s += 5;                                  /* 补刀优先 */
  if (ENEMY_TYPES[e.type].melee) s += 10;                   /* 冲锋兵最危险（会近身打指挥官） */
  if (e.boss) s += 6;
  if (dPlayer < 260) s += 8;                                /* 已经贴到指挥官身边了 */
  if (p && (p.hp < p.maxHp * 0.5 || game.time - (p.lastHurt || -99) < 1.6) && dPlayer < 520) s += 12; /* 护主 */
  if (dSelf > 900) s -= 10;
  return s;
}

function pickBuddyTarget(b) {
  let best = null, bs = -1e9;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const d = Math.abs(e.x - b.x);
    if (d > 1000) continue;
    const s = scoreTarget(e, b);
    if (s > bs) { bs = s; best = e; }
  }
  return best;
}

/* ---------------- 评估：武器与理想交战距离 ----------------
   以前是按下标写死的（0:380 / 1:190 / 2:460），射程一旦拉成五档就对不上了：
   她拿步枪会站 380 跟人对枪，拿霰弹也是 190 —— 枪的特性完全没进她的脑子。
   现在按「这把枪的射程」折算：近战枪贴脸，远程枪往后站。
   上限夹 620，是因为她再远就走出镜头了 —— AI 不需要把枪打到极限，
   那是玩家的玩法。 */
function idealRange(b, wp) {
  const st = BUDDY_STYLES[b.style];
  const R = (wp && wp.range) || 1600;
  const min = b.weapon === 1 ? 70 : Math.max(120, R * 0.13);
  const max = Math.max(min + 100, clamp(R * 0.40, 210, 620) * st.rangeMul);
  return { min: min, max: max };
}

function chooseWeapon(b, dist, crowd) {
  if (b.reloading > 0) return;
  const cur = b.weapon;
  let want = cur;
  if (dist < 200 && b.mags[1] >= 2) want = 1;                 /* 贴脸霰弹 */
  else if (crowd >= 3 && b.mags[2] >= 15) want = 2;           /* 人多机枪 */
  else if (b.mags[0] > 0) want = 0;
  else if (b.mags[2] > 0) want = 2;
  else if (b.mags[1] > 0) want = 1;
  if (want !== cur) {
    b.weapon = want;
    b.reloading = 0;
    b.reselect = 0.35;
    blog(b, '换 ' + WEAPONS[want].name);
  }
}

/* ---------------- 执行：位移 ---------------- */
function approachX(b, targetX, speed) {
  const dx = targetX - b.x;
  if (Math.abs(dx) < 10) { b.vx = lerp(b.vx, 0, 0.3); return; }
  b.vx = Math.sign(dx) * speed;
}

/* 起跳：直接走 doJump，和玩家用同一套物理（跳高 238px）
   旧版本这里写死 -720（只能跳 123px），所以大肥鱼永远上不了平台 */
function tryJump(a, force) {
  if (!a.onGround || a.jumpCd > 0) return false;
  doJump(a);
  a.coyote = 0;
  a.jumpCd = force ? 0.30 : 0.44;
  return true;
}

/* ---------------- 深渊导航 ----------------
   深渊是「掉下去就没了」，所以 AI 必须会两件事：
   ① 走到崖边停住（moveEntity 里的崖边顶回已负责）；
   ② 真想过就横着蹬一脚跳过去，别在边上磨蹭到掉血。 */
function pitAhead(a, dir) {
  return !groundAt(a.x + dir * (a.w * 0.5 + 30));
}

/* dir 方向 maxD 内最近的一块实地距离；没有就返回 -1 */
function groundDist(a, dir, maxD) {
  for (let d = Math.max(2, a.w * 0.5); d < maxD; d += 8) {
    if (groundAt(a.x + dir * d)) return d;
  }
  return -1;
}

/* 跨坑：确认对面够得着才跳，起跳后短时间锁住水平方向，免得被目标点拉回来 */
function crossPit(a, dir) {
  if (!dir) return false;
  const d = groundDist(a, dir, 300);
  if (d < 0) return false;
  if (!tryJump(a)) return false;
  a.vx = dir * 330;
  a.pitJump = 0.46;
  a.pitDir = dir;
  return true;
}

/* 空中补救：脚下是空的、正在往下掉，就往最近的实地蹬一次二段跳 */
function airRescue(a) {
  if (a.onGround || a.vy < 30 || !(a.airJumps > 0)) return false;
  if (groundAt(a.x)) return false;
  const dl = groundDist(a, -1, 240);
  const dr = groundDist(a, 1, 240);
  const dir = dl < 0 && dr < 0 ? 0 : (dl < 0 ? 1 : (dr < 0 ? -1 : (dl < dr ? -1 : 1)));
  if (!doAirJump(a)) return false;
  if (dir) a.vx = dir * 340;
  a.pitJump = 0.4;
  a.pitDir = dir;
  return true;
}

/* ==================================================================
   平台导航：让大肥鱼真的会用空中平台
   · 目标在头上 → 走到能踩的那块钢架下方，起跳
   · 目标在脚下 → 从单向平台直接翻下去追击
   · 被沙袋挡住射界 → 主动上高台取射界
   ================================================================== */
const BUDDY_JUMP_H = 228;     /* 满跳 238px，留 10px 余量 */

/* 站在 (x,y) 上的那块空中平台 */
function platUnder(x, y) {
  for (let i = 0; i < world.platforms.length; i++) {
    const p = world.platforms[i];
    if (p.ground) continue;
    if (x > p.x && x < p.x + p.w && Math.abs(p.y - y) < 5) return p;
  }
  return null;
}

/* 朝 wantX 方向，最近一块「一跳踩得上去」的平台 */
function reachableStep(b, wantX) {
  let best = null, bs = 1e9;
  for (let i = 0; i < world.platforms.length; i++) {
    const p = world.platforms[i];
    if (p.ground) continue;
    const up = b.y - p.y;
    if (up < 26 || up > BUDDY_JUMP_H) continue;          /* 太低不用跳 / 太高跳不到 */
    const board = clamp(b.x, p.x + 16, p.x + p.w - 16);  /* 平台上离自己最近的落脚点 */
    const d = Math.abs(board - b.x) + up * 0.5;
    if (d < bs) { bs = d; best = { p: p, board: board, up: up }; }
  }
  return best;
}

/* 射击线是否被沙袋掩体挡死（挡住就说明该上高台了） */
function lineBlocked(b, tgt) {
  const ey = b.y - b.h * 0.62;
  const ty = tgt.y - tgt.h * 0.55;
  for (let i = 1; i <= 8; i++) {
    const t = i / 9;
    if (coverBlocks(b.x + (tgt.x - b.x) * t, ey + (ty - ey) * t)) return true;
  }
  return false;
}

/* 往上走：走到平台下方 → 起跳。返回 true 表示这一帧的移动已经被接管 */
function climbToward(b, wantX, wantY) {
  if (!b.onGround || b.jumpCd > 0) return false;
  if (wantY > b.y - 26) return false;        /* 目标不在上头 */
  if (b.y - wantY < 8) return false;         /* 已经在同一层 */

  const step = reachableStep(b, wantX);
  if (!step) return false;

  const spanL = step.p.x + b.w * 0.5 - 4;
  const spanR = step.p.x + step.p.w - b.w * 0.5 + 4;

  if (b.x > spanL && b.x < spanR) {
    if (!tryJump(b)) return false;
    /* 空中继续朝目标方向带一点速度，别跳成原地起落 */
    const d = wantX - b.x;
    b.airX = Math.abs(d) > 20 ? wantX : b.x;
    b.airT = 0.75;
    if (Math.abs(d) > 20) b.vx = Math.sign(d) * 210;
    if (!b.lastClimbT || game.time - b.lastClimbT > 3) {
      b.lastClimbT = game.time;
      blog(b, '跳上钢架（+ ' + Math.round(step.up) + 'px）');
    }
    return true;
  }

  /* 还没走到平台下面：先过去 */
  const d2 = step.board - b.x;
  if (Math.abs(d2) > 6) {
    b.vx = Math.sign(d2) * Math.min(280, 150 + Math.abs(d2) * 1.2);
    return true;
  }
  return false;
}

/* ==================== 大肥鱼主更新 ==================== */
function updateBuddy(dt) {
  const b = buddy, p = player;
  const st = BUDDY_STYLES[b.style] || BUDDY_STYLES[1];

  if (b.dead) return;

  if (b.downed) {
    b.vx = lerp(b.vx, 0, 0.2);
    b.downTimer -= dt;
    b.reviveProgress = Math.max(0, b.reviveProgress - dt * 0.3);
    if (b.downTimer <= 0) { b.dead = true; b.downed = false; }
    moveEntity(b, dt);
    return;
  }

  /* --- 计时器 --- */
  b.flash = Math.max(0, b.flash - dt);
  b.invuln = Math.max(0, b.invuln - dt);
  b.muzzle = Math.max(0, b.muzzle - dt);
  b.airJumpT = Math.max(0, (b.airJumpT || 0) - dt);
  b.grenadeCd = Math.max(0, b.grenadeCd - dt);
  b.fireCd = Math.max(0, b.fireCd - dt);
  b.bubbleTimer = Math.max(0, b.bubbleTimer - dt);
  b.bubbleCd = Math.max(0, b.bubbleCd - dt);
  b.dodgeCd = Math.max(0, b.dodgeCd - dt);
  b.jumpCd = Math.max(0, b.jumpCd - dt);
  b.react = Math.max(0, b.react - dt);
  b.reselect = Math.max(0, b.reselect - dt);
  b.coyote = b.onGround ? 0.1 : Math.max(0, b.coyote - dt);
  b.think -= dt;

  /* ================= 1. 感知（每帧都做，但只做便宜的事） ================= */
  const threat = scanIncoming(b, 0.45);

  /* ================= 2. 决策节拍（每 0.15 秒重估一次） ================= */
  if (b.think <= 0) {
    b.think = 0.15;
    const prev = b.target;
    b.target = pickBuddyTarget(b);
    if (b.target && b.target !== prev) b.react = 0.14;   /* 新目标有个抬手时间 */

    const tgt = b.target;
    const crowd = tgt ? countEnemiesNear(tgt.x, tgt.y - tgt.h * 0.5, 240) : 0;

    if (p.downed) {
      setIntent(b, 'REVIVE', '指挥官倒地，' + (Math.abs(b.x - p.x) < 60 ? '正在拉起' : '全速赶过去'));
    } else if (b.hp < b.maxHp * st.retreatAt) {
      setIntent(b, 'RETREAT', '血量 ' + Math.round(b.hp / b.maxHp * 100) + '%，脱战回血');
    } else {
      const pk = wantPickup(b);
      if (pk) {
        b.grabTarget = pk;
        setIntent(b, 'GRAB', (pk.type === 'health' ? '去补血' : '去补弹') + '（' + Math.round(Math.abs(pk.x - b.x)) + 'px）');
      } else if (b.cmd === 'hold' && Math.abs(b.x - b.holdX) > 60) {
        setIntent(b, 'HOLD', '回守点位');
      } else if (tgt) {
        const dp = Math.round(Math.abs(tgt.x - p.x));
        setIntent(b, 'ENGAGE', tgt.type === 'boss' ? 'BOSS 威胁最大（距你 ' + dp + 'px）'
          : (dp < 220 ? '它已经贴到你跟前（距你 ' + dp + 'px）' : '拦在它和你之间（距你 ' + dp + 'px）'));
      } else if (b.cmd === 'hold') {
        setIntent(b, 'HOLD', '区域内无敌人');
      } else {
        setIntent(b, 'FOLLOW', Math.abs(p.x - b.x) > 240 ? '跟上指挥官' : '掩护位置');
      }
    }

    /* 武器选择 */
    if (b.target) {
      chooseWeapon(b, Math.abs(b.target.x - b.x), crowd);
    } else if (b.weapon !== 0 && b.mags[0] > 0 && b.reloading <= 0) {
      b.weapon = 0;
    }

    /* 战术换弹：没敌人贴近时提前装填 */
    const wpNow = WEAPONS[b.weapon];
    if (b.reloading <= 0 && b.mags[b.weapon] < wpNow.mag * 0.25 && !(b.target && Math.abs(b.target.x - b.x) < 170)) {
      b.reloading = wpNow.reload;
      blog(b, '战术装填');
    }

    /* 喊话 */
    if (b.bubbleCd <= 0) {
      if (b.intent === 'RETREAT') { say('buddy', '我血不多了，先缩一下！'); b.bubbleCd = 7; }
      else if (b.intent === 'REVIVE') { say('buddy', '别死！我来救你！'); b.bubbleCd = 5; }
      else if (b.intent === 'GRAB' && Math.random() < 0.5) { say('buddy', '我去捡个补给。'); b.bubbleCd = 8; }
      else if (b.intent === 'ENGAGE' && Math.random() < 0.05) { say('buddy', '发现敌人，开火！'); b.bubbleCd = 9; }
    }
  }

  /* ================= 3. 反射：躲弹（不受决策节拍限制） ================= */
  if (threat.count > 0 && b.dodgeCd <= 0) {
    /* 0.12 秒内必中 → 无论什么风格都跳 */
    const urgent = threat.minT < 0.16;
    if (b.onGround && (urgent || Math.random() < st.dodge * 0.5)) {
      if (tryJump(b, urgent)) {
        b.dodgeCd = urgent ? 0.32 : 0.5;
        b.vx = -threat.fromRight * 180;
        game.tele.dodges++;
        blog(b, '跳起躲弹（' + threat.count + '发来袭）');
      }
    } else if (urgent) {
      b.vx = -threat.fromRight * 320;
    }
  }

  /* ================= 4. 执行：位移 ================= */
  const speed = 240;
  const tgt = b.target;
  const wp = WEAPONS[b.weapon];

  switch (b.intent) {
    case 'REVIVE': {
      approachX(b, p.x, speed * 1.25);
      if (Math.abs(b.x - p.x) < 54) {
        b.vx = 0;
        p.reviveProgress += dt;
        if (Math.random() < dt * 8) spawnParticles(p.x, p.y - 20, 1, '#7ef0b0', 90, 0.5, 3, -60);
        if (p.reviveProgress >= 2.2) {
          p.downed = false;
          p.hp = p.maxHp * 0.45;
          p.reviveProgress = 0;
          p.invuln = 1.2;
          sfxRevive();
          spawnText(p.x, p.y - 70, '复活！', '#7ef0b0');
          say('buddy', '站起来，接着干！');
          blog(b, '完成救援');
        }
      }
      break;
    }
    case 'RETREAT': {
      /* 往叛离火线的方向退，同时保持和玩家的距离不超过一个屏幕 */
      let away = tgt ? (b.x < tgt.x ? -1 : 1) : (b.x < p.x ? 1 : -1);
      if (Math.abs(b.x - p.x) > 520) away = Math.sign(p.x - b.x);
      approachX(b, b.x + away * 260, speed * 1.05);
      if (b.hp < b.maxHp * st.healTo) b.hp = Math.min(b.maxHp * st.healTo, b.hp + 11 * dt);
      break;
    }
    case 'GRAB': {
      const pk = b.grabTarget;
      if (!pk || pickups.indexOf(pk) < 0) { b.grabTarget = null; b.vx = lerp(b.vx, 0, 0.2); break; }
      approachX(b, pk.x, speed * 1.1);
      if (pk.y < b.y - 30 && Math.abs(pk.x - b.x) < 60) tryJump(b);
      break;
    }
    case 'ENGAGE': {
      if (!tgt) { b.vx = lerp(b.vx, 0, 0.2); break; }
      const adx = Math.abs(tgt.x - b.x);
      const ideal = idealRange(b, wp);
      const melee = ENEMY_TYPES[tgt.type].melee;

      /* 核心：站在「指挥官 ↔ 敌人」的连线中间。
         既替指挥官吃火力（敌人优先打最近的人），又能稳定输出。 */
      const dir = Math.sign(tgt.x - p.x) || Math.sign(tgt.x - b.x) || 1;
      const wantDist = ideal.min + (ideal.max - ideal.min) * 0.5;
      let idealX = tgt.x - dir * wantDist;
      idealX = clamp(idealX, p.x - 290, p.x + 290);      /* 但不脱离指挥官 */

      if (melee) {
        /* 冲锋兵冲过来了：先退半步点射，冲到脸上再后跳 */
        if (adx < 110) {
          const away = b.x < tgt.x ? -1 : 1;
          b.vx = away * speed * 1.15;
          if (b.onGround && b.jumpCd <= 0) { tryJump(b); b.vx = away * 300; blog(b, '后跳躲冲锋'); }
        } else if (adx > 280) {
          approachX(b, idealX, speed * st.chase);
        } else {
          const d2 = idealX - b.x;
          b.vx = Math.abs(d2) > 50 ? Math.sign(d2) * speed * 0.7 : lerp(b.vx, 0, 0.18);
        }
      } else {
        const d2 = idealX - b.x;
        if (Math.abs(d2) > 44) {
          approachX(b, idealX, speed * (Math.abs(d2) > 220 ? st.chase * 1.1 : 0.85));
        } else {
          /* 站位内做小幅侧移，避免变成活靶子 */
          if (b.strafeTimer === undefined || b.strafeTimer <= 0) {
            b.strafeDir = Math.random() < 0.5 ? 1 : -1;
            b.strafeTimer = rand(0.7, 1.4);
          }
          b.strafeTimer -= dt;
          b.vx = lerp(b.vx, b.strafeDir * speed * 0.4, 0.3);
        }
      }

      /* 敌人站在上一层平台 / 自己被沙袋挡住射界 → 主动占高台 */
      if (b.onGround && !b.plat && lineBlocked(b, tgt)) {
        const step = reachableStep(b, tgt.x);
        if (step && climbToward(b, step.board, step.p.y)) {
          if (!b.lastHigT || game.time - b.lastHigT > 4) {
            b.lastHigT = game.time;
            blog(b, '射界被沙袋挡住，上高台');
          }
          break;
        }
      }
      break;
    }
    case 'HOLD': {
      if (Math.abs(b.x - b.holdX) > 46) approachX(b, b.holdX, speed * 0.9);
      else b.vx = lerp(b.vx, 0, 0.2);
      break;
    }
    default: { /* FOLLOW */
      const dx = p.x - b.x;
      const adx = Math.abs(dx);
      /* 有潜在威胁时，站到指挥官靠威胁的那一侧；否则跟在身后 */
      const side = tgt ? (Math.sign(tgt.x - p.x) || 1) : (dx > 0 ? -1 : 1);
      const anchor = p.x + side * 155;
      if (adx > 250 || Math.sign(anchor - b.x) !== Math.sign(dx)) {
        approachX(b, anchor, speed * 1.08);
      } else if (adx < 100) {
        approachX(b, b.x + (dx > 0 ? -150 : 150), speed * 0.7);
      } else {
        b.vx = lerp(b.vx, 0, 0.14);
      }
      /* 指挥官在上一层平台 → 跳上去跟 */
      if (p.y < b.y - 40 && adx < 220 && b.onGround) tryJump(b);
    }
  }

  /* ================= 4.2 深渊：该跳就跳，别在坑边耗着 ================= */
  if (b.pitJump > 0) {
    b.pitJump -= dt;
    b.vx = (b.pitDir || 0) * 330;
  } else if (b.onGround) {
    const ed = b.pitEdge || 0;             /* 被崖边顶住的方向 */
    const md = Math.sign(b.vx) || 0;
    const dir = ed || md;
    if (dir && pitAhead(b, dir) && crossPit(b, dir)) {
      blog(b, ed ? '贴着坑边，跳过去' : '前面是缺口，起跳');
    }
  } else if (airRescue(b)) {
    blog(b, '空中再蹬一下（二段跳）');
  }

  /* ================= 4.5 垂直导航（平台） ================= */
  /* 先算出「我真正想去的地方」，再看要不要上/下平台 */
  let wantX = b.x, wantY = b.y;
  if (b.intent === 'REVIVE') { wantX = p.x; wantY = p.y; }
  else if (b.intent === 'ENGAGE' && tgt) { wantX = tgt.x; wantY = tgt.y; }
  else if (b.intent === 'GRAB' && b.grabTarget) { wantX = b.grabTarget.x; wantY = b.grabTarget.y + 14; }
  else if (b.intent === 'FOLLOW') { wantX = p.x; wantY = p.y; }

  /* 目标在高处 → 找台阶跳上去 */
  const climbing = climbToward(b, wantX, wantY);

  /* 目标在低处、自己踩在空中平台上 → 翻下去追（单向平台，直接落） */
  /* 脚下是哪块平台按坐标现算一次，避免 b.plat 在关卡重排后残留 */
  const onPlat = b.onGround ? platUnder(b.x, b.y) : null;
  if (!climbing && onPlat && b.onGround && b.intent !== 'ENGAGE'
      && wantY > b.y + 46 && Math.abs(wantX - b.x) < 260) {
    b.dropTimer = DROP_TIME;
    b.y += 4;
    b.vy = 70;
    b.onGround = false;
    if (!b.lastDropT || game.time - b.lastDropT > 2.5) {
      b.lastDropT = game.time;
      blog(b, '跳下平台追击');
    }
  }

  /* 起跳后在空中的横向修正：确保真的落在钢架上 */
  if (b.airT > 0) {
    b.airT -= dt;
    if (!b.onGround) {
      const d = b.airX - b.x;
      if (Math.abs(d) > 14) b.vx = Math.sign(d) * 250;
      else b.vx = lerp(b.vx, 0, 0.25);
    }
  }

  /* 硬约束：绝不能掉队太远 */
  if (Math.abs(b.x - p.x) > 760 && !p.downed) {
    b.vx = Math.sign(p.x - b.x) * speed * 1.4;
  }

  /* ================= 5. 换弹 ================= */
  if (b.reloading > 0) {
    b.reloading -= dt;
    if (b.reloading <= 0) b.mags[b.weapon] = WEAPONS[b.weapon].mag;
  } else if (b.mags[b.weapon] <= 0) {
    b.reloading = WEAPONS[b.weapon].reload * 1.05;
    for (let k = 0; k < 3; k++) {
      if (b.mags[k] > 0) { b.weapon = k; b.reloading = 0; break; }
    }
    if (b.reloading > 0) blog(b, '空仓装填');
  }

  /* ================= 6. 瞄准与开火 ================= */
  const wp2 = WEAPONS[b.weapon];
  if (tgt && b.reloading <= 0) {
    const myEyeY = b.y - b.h * 0.62;
    const tx = tgt.x, ty = tgt.y - tgt.h * 0.55;
    const dist = Math.hypot(tx - b.x, ty - myEyeY);

    /* 预判提前量：按飞行时间估算目标移动 */
    const tof = dist / wp2.speed;
    const lead = Math.min(1.4, tof * st.rangeMul * (b.style === 2 ? 1.15 : 1));
    const aimX = tx + (tgt.vx || 0) * tof * lead;
    const aimY = ty + (tgt.vy || 0) * tof * 0.3;
    const want = Math.atan2(aimY - myEyeY, aimX - b.x);

    /* 距离越远，抬手越慢 */
    b.aim = angleLerp(b.aim, want, 0.42);
    const err = Math.abs(angleDiff(b.aim, want));

    /* 容差随距离收紧，但不做无意义的抖动 */
    const tol = clamp(0.30 - dist * 0.00035, 0.05, 0.26);
    /* 她也要受枪的射程限制：拿霰弹枪不会站在 800px 外对射，
       只在「射程的 85%」以内扣扳机 —— 剩下 15% 留给目标后退的余量。
       820 是原来的硬上限，保留它当保险，免得远程枪让她隔着整张地图点射。 */
    const reach = wp2.range > 0 ? Math.min(820, wp2.range * 0.85) : 820;
    const inRange = Math.abs(tgt.x - b.x) < reach;
    const ready = b.fireCd <= 0 && b.react <= 0 && b.reselect <= 0 && b.mags[b.weapon] > 0;

    if (inRange && err < tol && ready) {
      b.mags[b.weapon]--;
      fireWeapon(b, wp2, b.aim, 1.55, 1);
      game.tele.buddyShots++;
    }

    /* 手雷：至少 3 人扎堆，且不误伤指挥官 */
    if (b.grenadeCd <= 0) {
      const cluster = countEnemiesNear(tgt.x, tgt.y - 40, 190);
      const pSafe = Math.abs(p.x - tgt.x) > 160;
      if (cluster >= 3 && pSafe) {
        b.grenadeCd = 8;
        const ang = Math.atan2(-150, (tgt.x - b.x) * 0.6);
        spawnGrenade(b.x, b.y - b.h * 0.7, Math.cos(ang) * 640, Math.sin(ang) * 640, 80, 'ally');
        say('buddy', '吃颗手雷！');
        b.bubbleCd = 6;
        game.tele.grenades++;
        blog(b, '投手雷（' + cluster + '人扎堆）');
      }
    }
  } else if (Math.abs(b.vx) > 30) {
    b.aim = angleLerp(b.aim, b.vx > 0 ? 0 : Math.PI, 0.15);
  }

  /* 蹲下：远距离对枪 / 自己换弹 / 挨打时压低身位 —— 和玩家同一套规则，
     只在原地不动时蹲，避免蹲着跑被箱子卡住 */
  let bWantCrouch = false;
  if (b.onGround && b.intent === 'ENGAGE' && tgt && !ENEMY_TYPES[tgt.type].melee
      && Math.abs(b.vx) < 70 && b.jumpBuffer <= 0) {
    const bdx = Math.abs(tgt.x - b.x);
    if (b.reloading > 0 && bdx > 190) bWantCrouch = true;
    else if (bdx > 400 && b.fireCd > 0.10) bWantCrouch = true;
    else if (b.hp < b.maxHp * 0.5 && bdx > 260) bWantCrouch = true;
  }
  b.crouch = lerp(b.crouch || 0, bWantCrouch ? 1 : 0, 1 - Math.pow(0.0015, dt));
  if (b.crouch < 0.02) b.crouch = 0;
  b.h = b.baseH - 17 * b.crouch;

  b.anim += Math.abs(b.vx) * dt * 0.06;
  moveEntity(b, dt);

  /* 大肥鱼被木箱 / 砖墙挡住 → 翻过去，别卡在掩体前面发呆 */
  if (b.blocked && b.onGround && b.jumpCd <= 0 && Math.abs(b.vx) > 20) {
    if (tryJump(b)) b.vx = Math.sign(b.vx) * Math.max(Math.abs(b.vx), 260);
  }

  b.x = clamp(b.x, 24, world.w - 24);
}

/* ==================== 敌兵 AI ==================== */

function pickEnemyTarget(e) {
  const cands = [];
  if (player && !player.downed && !player.dead) cands.push(player);
  if (buddy && !buddy.downed && !buddy.dead) cands.push(buddy);
  if (!cands.length) return null;
  let best = cands[0], bd = 1e9;
  for (const c of cands) {
    let d = Math.abs(c.x - e.x);
    if (c.kind === 'player') d *= 0.85; /* 略微优先打玩家 */
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

/* 打一枪就少一发；打空自动进换弹，换完补满。
   注意：返回 false 表示这一枪没打出去（弹匣空 / 正在换弹）。 */
function enemyShoot(e, target, spread, count) {
  const n = count || 1;
  if (e.reloadT > 0) return false;
  if (e.magMax > 0 && e.mag <= 0) {
    e.reloadT = (ENEMY_TYPES[e.type] || {}).reload || 2;
    return false;
  }
  if (e.magMax > 0) e.mag = Math.max(0, e.mag - n);

  /* 敌人的子弹也有弹道：轻微下坠 + 一点点减速，画得比玩家的细。
     不给他们抬枪补偿 —— 远距离本来就不该枪枪点名，这正好给了玩家距离感。 */
  const wp = {
    speed: 900, dmg: e.dmg, color: '#ff8a5c', pellets: n, spread: spread,
    rate: 1, sfx: 'small', grav: 90, drag: 0.06, bw: 1.2
  };
  const gunY = e.y - e.h * (0.6 - 0.12 * e.crouch);
  const ty = target.y - target.h * 0.55;
  const base = Math.atan2(ty - gunY, target.x - e.x);
  for (let i = 0; i < wp.pellets; i++) {
    const ang = base + rand(-spread, spread);
    spawnBullet(e.x + Math.cos(ang) * 26, gunY + Math.sin(ang) * 26,
      Math.cos(ang) * wp.speed, Math.sin(ang) * wp.speed, wp.dmg, 'enemy', wp.color, 3, e.type,
      { ignorePlat: e.plat });
  }
  e.muzzle = 0.06;
  beep(rand(150, 190), 0.05, 'square', 0.018, 80);
  return true;
}

/* 找一个「同层、挡得住、在威胁反方向」的箱子 */
function findCover(e, threatX) {
  let best = null, bd = 1e9;
  for (const b of world.blocks) {
    if (b.hp <= 0) continue;
    if (b.h < 38) continue;                       /* 太矮挡不住站姿 */
    if (Math.abs(b.y - e.y) > 34) continue;       /* 只挑自己这一层的 */
    const backX = b.x + b.w / 2 > threatX ? b.x + b.w + 18 : b.x - 18;
    if (backX < 50 || backX > world.w - 50) continue;
    const d = Math.abs(backX - e.x);
    if (d > 320) continue;
    if (d < bd) { bd = d; best = backX; }
  }
  return best;
}

function updateEnemy(e, dt) {
  if (e.dead) return;

  e.flash = Math.max(0, e.flash - dt);
  e.muzzle = Math.max(0, (e.muzzle || 0) - dt);
  e.meleeCd = Math.max(0, e.meleeCd - dt);
  e.fireCd = Math.max(0, e.fireCd - dt);
  e.burstCd = Math.max(0, e.burstCd - dt);
  e.minionCd = Math.max(0, (e.minionCd || 0) - dt);
  e.strafeTimer = Math.max(0, e.strafeTimer - dt);
  e.jumpCd = Math.max(0, (e.jumpCd || 0) - dt);
  e.coverCd = Math.max(0, (e.coverCd || 0) - dt);
  e.throwCd = Math.max(0, (e.throwCd || 0) - dt);
  e.slamCd = Math.max(0, (e.slamCd || 0) - dt);

  /* 换弹：打空后强制硬直，这是玩家最好的反打窗口 */
  if (e.reloadT > 0) {
    e.reloadT -= dt;
    if (e.reloadT <= 0) { e.reloadT = 0; e.mag = e.magMax; }
  }

  /* 空降中：只下落，不作战 */
  if (e.chute > 0) {
    e.vx = lerp(e.vx, 0, 0.10);
    e.anim += dt;
    e.crouch = lerp(e.crouch, 0, 0.2);
    moveEntity(e, dt);
    return;
  }

  if (e.spawnGuard > 0) {
    e.spawnGuard -= dt;
    e.vx = lerp(e.vx, 0, 0.2);
    e.anim += dt;
    e.crouch = lerp(e.crouch, 0, 0.2);
    moveEntity(e, dt);
    return;
  }

  const target = pickEnemyTarget(e);
  if (!target) {
    e.vx = lerp(e.vx, 0, 0.2);
    e.crouch = lerp(e.crouch, 0, 0.15);
    e.h = e.baseH - 15 * e.crouch;
    moveEntity(e, dt);
    return;
  }

  const dx = target.x - e.x;
  const adx = Math.abs(dx);
  const dir = Math.sign(dx) || 1;
  const t = ENEMY_TYPES[e.type];
  const hpR = e.hp / e.maxHp;

  /* 朝向目标（蹲下时枪口更低一点） */
  e.aim = angleLerp(e.aim,
    Math.atan2((target.y - target.h * 0.55) - (e.y - e.h * (0.6 - 0.12 * e.crouch)), dx), 0.14);

  /* ---------- 典狱长震地：蓄力期间站定，蓄满炸一圈 ---------- */
  if (e.slamFx > 0) {
    e.slamFx -= dt;
    e.vx = lerp(e.vx, 0, 0.45);
    /* 蓄力提示：脚下每帧冒火星，给玩家 0.55 秒跑开 */
    if (Math.random() < dt * 26) {
      spawnParticles(e.x + rand(-46, 46), e.y - 4, 1, '#ffb066', 80, 0.34, 3, 520);
    }
    if (e.slamFx <= 0) {
      explode(e.x, e.y - 6, 186, e.dmg * 1.15, 'enemy');
      addShake(14);
      e.slamCd = 7.0;
    }
    e.anim += dt * 0.4;
    moveEntity(e, dt);
    e.x = clamp(e.x, 20, world.w - 20);
    return;
  }

  /* ---------- 躲掩体：血少或换弹时缩到箱子后面 ---------- */
  let hiding = false;
  if (!t.melee && !e.boss) {
    if ((e.reloadT > 0 || hpR < 0.42) && e.hideX === 0 && e.coverCd <= 0) {
      e.hideX = findCover(e, target.x);
      e.hideT = 2.6;
      e.coverCd = rand(1.6, 3.0);
    }
    if (e.hideX !== 0) {
      const hd = e.hideX - e.x;
      if (Math.abs(hd) > 14 && e.hideT > 0) {
        e.vx = Math.sign(hd) * Math.min(e.speed * 1.15, 60 + Math.abs(hd) * 2.2);
        if (e.jumpCd <= 0 && e.onGround && Math.abs(hd) > 70 && Math.random() < 0.02) tryJump(e);
      } else {
        hiding = true;
        e.hideT -= dt;
        e.vx = lerp(e.vx, 0, 0.22);
        if (e.hideT <= 0) e.hideX = 0;
      }
    }
  } else {
    e.hideX = 0;
  }

  /* ---------- 蹲下：换弹、躲掩体、远距离对枪都会蹲 ---------- */
  const wantCrouch = e.onGround && !t.melee &&
    (hiding || e.reloadT > 0.35 || (adx > 380 && e.fireCd > 0.25 && hpR < 0.8));
  e.crouch = lerp(e.crouch, wantCrouch ? 1 : 0, 1 - Math.pow(0.001, dt));
  if (e.crouch < 0.02) e.crouch = 0;
  e.h = e.baseH - 15 * e.crouch;

  /* ---------- 玩家爬上平台后，敌人也跟着上 ---------- */
  let climbing = false;
  if (!t.melee && !hiding && target.y < e.y - 40 && adx < 460) {
    climbing = climbToward(e, target.x, target.y);
  }

  if (!hiding && !climbing) {
    if (t.melee) {
      /* 冲锋兵：贴脸近战 */
      e.vx = dir * e.speed;
      if (adx < 46 && Math.abs(target.y - e.y) < 70 && e.meleeCd <= 0) {
        e.meleeCd = 0.95;
        damageFriendly(target, e.dmg);
        target.vx += dir * 260;
        spawnParticles(target.x, target.y - 30, 10, '#ff5a4a', 240, 0.4, 4, 600);
      }
    } else if (t.thrower) {
      /* 掷弹兵：不贴脸，隔一段距离往你脚下丢手雷 */
      if (adx > t.range) e.vx = dir * e.speed;
      else if (adx < t.keep * 0.55) e.vx = -dir * e.speed;
      else {
        if (e.strafeTimer <= 0) { e.strafe *= -1; e.strafeTimer = rand(1.2, 2.4); }
        e.vx = e.strafe * e.speed * 0.5;
      }
      if (e.throwCd <= 0 && adx < t.range && adx > 120) {
        e.throwCd = t.fireRate;
        const gx = target.x + rand(-40, 40);
        const flight = clamp(adx / 420, 0.55, 1.25);
        const vx = (gx - e.x) / flight;
        const vy = (target.y - (e.y - e.h * 0.8)) / flight - 0.5 * 1500 * flight;
        spawnGrenade(e.x, e.y - e.h * 0.8, vx, vy, e.dmg * 2.2, 'enemy');
        spawnText(e.x, e.y - e.h - 12, '手雷！', '#ffb066');
        e.muzzle = 0.08;
      }
    } else if (e.boss) {
      /* ---------- BOSS 主脑：三段通用行为 + 三段专属行为 ----------
         通用：卡住距离 → 扇形扫射 → 定期叫小弟。
         专属：1 关召唤（压场）、2 关燃烧瓶（封走位）、3 关震地（逼你拉开）。
         三个 BOSS 的「打法动词」必须不一样，否则只是同一只怪换了血条。 */

      /* 距离控制：典狱长要靠得更近才好震地，纵火者要更远好扔瓶子 */
      const keepD = t.slam ? t.keep * 0.72 : t.keep;
      if (adx > keepD) e.vx = dir * e.speed;
      else if (adx < keepD * 0.6) e.vx = -dir * e.speed * 0.9;
      else e.vx = lerp(e.vx, 0, 0.1);

      /* ---- 专属 1：钢铁典狱长 · 震地冲击波 ---- */
      if (t.slam && e.slamCd <= 0 && e.onGround && adx < 320 && Math.abs(target.y - e.y) < 90) {
        e.slamFx = 0.55;
        e.slamCd = 6.5;
        spawnText(e.x, e.y - e.h - 22, '震地蓄力', '#ffb066');
        sfxCharge();
      }

      /* ---- 专属 2：焦土纵火者 · 抛掷燃烧瓶 ---- */
      if (t.molotov && e.throwCd <= 0 && adx < t.range && adx > 150) {
        e.throwCd = rand(3.4, 5.0);
        const gx = target.x + rand(-56, 56);
        const flight = clamp(adx / 460, 0.6, 1.3);
        const vx = (gx - e.x) / flight;
        const vy = (target.y - (e.y - e.h * 0.85)) / flight - 0.5 * 1500 * flight;
        spawnGrenade(e.x, e.y - e.h * 0.85, vx, vy, e.dmg * 1.7, 'enemy',
          { fire: true, fuse: flight + 0.05 });
        spawnText(e.x, e.y - e.h - 14, '燃烧瓶！', '#ff8a3d');
        e.muzzle = 0.08;
      }

      /* ---- 通用：扇形扫射 ---- */
      if (e.fireCd <= 0) {
        if (enemyShoot(e, target, 0.11, t.slam ? 6 : 5)) { sfxShotBig(); e.fireCd = t.fireRate; }
        else e.fireCd = 0.35;
      }

      /* ---- 专属 3：铁血队长 · 呼叫增援（按关卡决定叫来的兵种） ---- */
      if (e.minionCd <= 0 && enemies.length < 14) {
        e.minionCd = t.slam ? 10 : 8;
        const minion = t.summon || 'grunt';
        spawnEnemyAt(minion, { x: e.x - 70, y: e.y }, game.stage);
        spawnEnemyAt(minion, { x: e.x + 70, y: e.y }, game.stage);
        spawnText(e.x, e.y - e.h - 20, '增援！', '#ff9a6a');
      }
    } else if (t.burst) {
      /* 重机枪兵：点射 */
      if (adx > t.range * 0.9) e.vx = dir * e.speed;
      else if (adx < t.keep * 0.7) e.vx = -dir * e.speed;
      else e.vx = lerp(e.vx, 0, 0.12);

      if (e.burstLeft > 0) {
        if (e.burstCd <= 0) {
          if (enemyShoot(e, target, 0.05, 1)) {
            e.burstLeft--;
            e.burstCd = 0.1;
          } else {
            e.burstLeft = 0;                       /* 弹匣空了，整轮点射取消 */
          }
        }
      } else if (e.fireCd <= 0 && adx < t.range) {
        e.fireCd = t.fireRate;
        e.burstLeft = t.burst;
        e.burstCd = 0;
      }
    } else {
      /* 步兵：中距离走走停停 */
      if (adx > t.keep * 1.2) e.vx = dir * e.speed;
      else if (adx < t.keep * 0.6) e.vx = -dir * e.speed * 0.8;
      else {
        if (e.strafeTimer <= 0) { e.strafe *= -1; e.strafeTimer = rand(1, 2.2); }
        e.vx = e.strafe * e.speed * 0.45;
      }
      if (e.fireCd <= 0 && adx < t.range) {
        if (enemyShoot(e, target, 0.085 * (1 - 0.4 * e.crouch), 1)) {
          e.fireCd = t.fireRate * rand(0.85, 1.2);
        } else {
          e.fireCd = 0.3;
        }
      }
    }
  }

  e.anim += Math.abs(e.vx) * dt * 0.055;
  moveEntity(e, dt);

  /* 被木箱 / 砖墙 / 集装箱挡住 → 翻过去。
     不加这段，废墟和指挥部里的敌人会全部堵在硬掩体前面排队。 */
  if (e.blocked && e.onGround && e.jumpCd <= 0 && !e.chute && e.reloadT <= 0) {
    const pushing = Math.sign(e.vx) === Math.sign(target.x - e.x) && Math.abs(e.vx) > 12;
    if (pushing) {
      tryJump(e);
      e.jumpCd = 0.9;
      e.vx = Math.sign(e.vx) * Math.max(Math.abs(e.vx), e.speed * 1.15);
    }
  }

  /* 深渊：走到坑边别停在那当靶子，追人要紧就跳过去 */
  if (e.pitJump > 0) {
    e.pitJump -= dt;
    e.vx = (e.pitDir || 0) * 300;
  } else if (e.onGround && e.pitEdge && e.jumpCd <= 0 && !e.chute && e.reloadT <= 0) {
    if (crossPit(e, e.pitEdge)) e.jumpCd = 1.0;
  }

  e.x = clamp(e.x, 20, world.w - 20);
}

/* ===== game.js ===== */
'use strict';

/* ==================================================================
   游戏层：状态机 / 玩家操作 / 波次 / 实体更新 / 摄像机
   ================================================================== */

const game = {
  state: 'title',           // title | playing | paused | stageclear | gameover | victory
  stage: 1,
  wave: 0,
  maxWave: 5,
  spawnQueue: [],
  spawnTimer: 0,
  waveDelay: 0,
  waveActive: false,
  kills: 0,
  score: 0,
  time: 0,
  totalKills: 0,
  msg: '',
  msgTimer: 0,
  buddyDownAt: -99,
  grenadeCd: 0,
  combo: 0,
  comboTimer: 0,
  /* ---- BOSS 演出状态 ---- */
  slowmo: 0,              /* > 0 时世界时间放慢（击破特写） */
  screenFlash: 0,         /* 全屏白闪强度 */
  bossIntro: null,        /* { t, dur, name, tag, accent } 入场横幅 */
  /* 大肥鱼作战数据（HUD 战术面板用，全部是真实统计，不是装饰） */
  tele: { decisions: 0, dodges: 0, grenades: 0, buddyShots: 0, buddyHits: 0, buddyDmg: 0, buddyKills: 0, playerKills: 0 }
};

let aiPanelOpen = true;

/* ---------------- 关卡启动 ---------------- */
function startStage(stage) {
  game.stage = stage;
  buildStage(stage);

  enemies = []; bullets = []; grenades = []; pickups = [];
  particles = []; texts = []; casings = []; decals = []; fires = []; corpses = [];

  player = createPlayer(220);
  buddy = createBuddy(150);
  buddy.cmd = 'follow';
  buddy.holdX = 150;

  game.wave = 0;
  game.kills = 0;
  game.spawnQueue = [];
  game.spawnTimer = 0;
  game.waveDelay = 1.2;
  game.waveActive = false;
  game.grenadeCd = 0;
  game.slowmo = 0;
  game.screenFlash = 0;
  game.bossIntro = null;
  game.msg = '第 ' + stage + ' 关 · ' + (world.theme ? world.theme.name : '出发');
  game.msgTimer = 2.0;

  game.tele = { decisions: 0, dodges: 0, grenades: 0, buddyShots: 0, buddyHits: 0, buddyDmg: 0, buddyKills: 0, playerKills: 0 };

  camera.x = 0;
  camera.shake = 0;
  game.state = 'playing';
  say('buddy', '我跟着你，你打哪我打哪。');
}

/* ---------------- 波次 ---------------- */
function pickType(wave, i) {
  const r = Math.random();
  if (wave <= 1) return 'grunt';
  if (wave === 2) return r < 0.6 ? 'grunt' : 'rusher';
  if (wave === 3) return r < 0.45 ? 'grunt' : (r < 0.8 ? 'rusher' : 'gunner');
  if (wave === 4) return r < 0.30 ? 'grunt' : (r < 0.55 ? 'rusher' : (r < 0.80 ? 'gunner' : 'thrower'));
  return r < 0.24 ? 'grunt' : (r < 0.46 ? 'rusher' : (r < 0.76 ? 'gunner' : 'thrower'));
}

/* 投放方式随波次进化：先地面走进来，后面才有空降和抢高台 */
function pickMode(wave) {
  const r = Math.random();
  if (wave <= 2) return 'edge';
  if (wave <= 3) return r < 0.72 ? 'edge' : 'air';
  if (wave <= 5) return r < 0.52 ? 'edge' : (r < 0.86 ? 'air' : 'high');
  return r < 0.40 ? 'edge' : (r < 0.74 ? 'air' : 'high');
}

function beginWave() {
  game.wave++;
  const w = game.wave;
  const isBoss = w === game.maxWave;
  const count = isBoss ? 4 : Math.min(16, 3 + w * 2);

  game.spawnQueue = [];
  game.spawnTimer = 0;
  for (let i = 0; i < count; i++) {
    game.spawnQueue.push({
      type: pickType(w, i),
      at: i * 0.55 + rand(0, 0.35),
      side: Math.random() < 0.5 ? 'left' : 'right',
      mode: pickMode(w),
      done: false
    });
  }
  if (isBoss) {
    /* 每关的最终 BOSS 不一样：街区队长 / 废墟纵火者 / 指挥部典狱长 */
    const bt = bossForStage(game.stage);
    const info = ENEMY_TYPES[bt];
    game.spawnQueue.push({ type: bt, at: 1.5, side: 'right', mode: 'edge', done: false });

    /* 入场演出：警报 + 震屏 + 白闪 + 巨名横幅，和 BOSS 出场时间对齐 */
    game.bossIntro = { t: 0, dur: 2.9, name: info.name, tag: info.title || '敌方重装单位', accent: info.accent || 'red' };
    game.screenFlash = 0.34;
    addShake(10);
    sfxAlarm();
  }

  game.waveActive = true;
  game.msg = isBoss ? ('第 ' + w + ' 波 · BOSS 出现！') : ('第 ' + w + ' 波 · 敌军 ' + (count + (isBoss ? 1 : 0)) + ' 人');
  game.msgTimer = 2.4;

  /* 大肥鱼上一波阵亡则归队 */
  if (buddy.dead) {
    buddy.dead = false;
    buddy.downed = false;
    buddy.x = player.x - 60;
    buddy.y = world.groundY;
    buddy.hp = buddy.maxHp * 0.6;
    buddy.bubble = '我回来了！';
    buddy.bubbleTimer = 2.2;
  }
  if (isBoss) say('buddy', '大块头来了，别站正面！');
  else if (w === 1) say('buddy', '敌人从两边来，稳住打。');
}

/* ------------------------------------------------------------------
   敌人投放
   规则（这是「敌人刷新位置」的还原重点）：
   1) 永远不贴脸——离玩家至少 SPAWN_MIN_D，玩家在屏幕边上时改从另一侧来
   2) 只落在实心地面或平台上，绝不卡进木箱 / 集装箱里
   3) 空降的先挂伞缓降，给你至少一秒的反应时间
   ------------------------------------------------------------------ */
const SPAWN_MIN_D = 420;

function spotFree(x, pad) {
  if (x < 70 || x > world.w - 70) return false;
  if (!groundAt(x)) return false;                      /* 深渊上方没法站人 */
  /* 落点被实体障碍占据就换地方 */
  if (blockedAt(x, world.groundY - 6, pad || 30)) return false;
  return true;
}

/* 在某一侧挑一个合法地面点；这一侧挤不下就返回 null */
function groundSpotOnSide(dir) {
  let x = dir < 0 ? camera.x - 70 : camera.x + VIEW_W + 70;
  if (dir < 0) x = Math.min(x, player.x - SPAWN_MIN_D);
  else x = Math.max(x, player.x + SPAWN_MIN_D);
  x = clamp(x, 70, world.w - 70);
  if (Math.abs(x - player.x) < SPAWN_MIN_D) return null;

  for (let k = 0; k < 26; k++) {
    const cx = clamp(x + dir * k * 34, 70, world.w - 70);
    if (spotFree(cx, 30)) return cx;
    if (cx <= 70 || cx >= world.w - 70) break;
  }
  return null;
}

/* 挑一个高处平台（中/高位，离玩家不近，宽度够站人） */
function highSpot() {
  const cand = [];
  for (const pl of world.platforms) {
    if (pl.ground) continue;
    if (pl.y > TIER_MID + 8) continue;                 /* 太低的台子没战术价值 */
    if (pl.w < 96) continue;
    const cx = pl.x + pl.w * 0.5;
    if (Math.abs(cx - player.x) < 300) continue;
    cand.push(cx);
  }
  if (!cand.length) return null;
  return cand[(Math.random() * cand.length) | 0];
}

/* 返回 { x, y, air } —— air 为真表示从天上挂伞下来 */
function pickSpawn(side, mode) {
  const dir = side === 'left' ? -1 : 1;

  if (mode === 'high') {
    const hx = highSpot();
    if (hx !== null) return { x: hx, y: camera.y - 90, air: true, high: true };
    mode = 'air';
  }

  if (mode === 'air') {
    /* 从玩家侧后方的空中落下，横向离玩家 240~540px */
    for (let t = 0; t < 16; t++) {
      const x = clamp(player.x - dir * rand(240, 540), 90, world.w - 90);
      if (Math.abs(x - player.x) > 230 && spotFree(x, 32)) {
        return { x, y: camera.y - 110, air: true };
      }
    }
    mode = 'edge';
  }

  let gx = groundSpotOnSide(dir);
  if (gx === null) gx = groundSpotOnSide(-dir);        /* 换边，绝不贴脸刷 */
  if (gx === null) {
    /* 极端地形兜底：直接甩到地图尽头 */
    gx = player.x < world.w * 0.5 ? world.w - 90 : 90;
  }
  return { x: gx, y: world.groundY, air: false };
}

function spawnEnemyAt(type, pos, stage) {
  const e = createEnemy(type, clamp(pos.x, 40, world.w - 40), stage);
  if (pos.air) {
    e.y = pos.y;
    e.vy = 60;
    e.onGround = false;
    e.chute = 1;                                       /* 挂伞缓降 */
    e.chuteVis = 0;
    e.state = 'drop';
    spawnParticles(e.x, e.y - 10, 5, '#cfe4ff', 90, 0.5, 2.6, 120);
  }
  enemies.push(e);
  spawnParticles(e.x, e.y - e.h * 0.5, 8, '#ffaa77', 160, 0.4, 4, 0);
}

function updateWaves(dt) {
  if (!game.waveActive) {
    game.waveDelay -= dt;
    if (game.waveDelay <= 0) {
      if (game.wave >= game.maxWave) {
        game.state = 'stageclear';
        game.score += 200 * game.stage;
        sfxRevive();
      } else {
        beginWave();
      }
    }
    return;
  }

  /* 按时间表投放敌人 */
  game.spawnTimer += dt;
  for (let i = 0; i < game.spawnQueue.length; i++) {
    const s = game.spawnQueue[i];
    if (!s.done && game.spawnTimer >= s.at) {
      s.done = true;
      spawnEnemyAt(s.type, pickSpawn(s.side, s.mode), game.stage);
    }
  }

  const allSpawned = game.spawnQueue.every(s => s.done);
  const alive = enemies.some(e => !e.dead);
  if (allSpawned && !alive) {
    game.waveActive = false;
    game.waveDelay = 1.8;
    game.msg = '第 ' + game.wave + ' 波 清空';
    game.msgTimer = 1.6;
    if (game.wave >= game.maxWave) return;
    say('buddy', '这一波解决了，缓口气。');
  }
}

/* ---------------- 玩家 ---------------- */
function playerFire(p, wp) {
  p.mags[p.weapon]--;
  /* 蹲下更稳、精确瞄准更稳；狙击枪抬枪慢但一发致命。
     bloom 是「连着打会越来越散」：机枪连射时准星会一圈圈张开，
     松手后自己收回去 —— 所以点射和扫射的手感是两回事。 */
  const steady = 1 - 0.55 * p.crouch - (p.ads && wp.scope ? 0.42 : 0);
  const spr = Math.max(0.10, steady * (1 + (p.bloom || 0)));
  fireWeapon(p, wp, p.aim, spr, 1);
  p.bloom = Math.min(1, (p.bloom || 0) + (wp.bloom || 0) * (p.crouch > 0.5 ? 0.7 : 1));
  addShake(wp.recoil * 0.4 * (1 - 0.35 * p.crouch));
}

function updatePlayer(dt) {
  const p = player;

  p.flash = Math.max(0, p.flash - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.muzzle = Math.max(0, p.muzzle - dt);
  p.airJumpT = Math.max(0, (p.airJumpT || 0) - dt);
  p.bloom = Math.max(0, (p.bloom || 0) - dt * 3.4);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.fireCd = Math.max(0, p.fireCd - dt);
  game.grenadeCd = Math.max(0, game.grenadeCd - dt);

  /* 倒地 */
  if (p.downed) {
    p.vx = lerp(p.vx, 0, 0.15);
    p.downTimer -= dt;
    p.reviveProgress = Math.max(0, p.reviveProgress - dt * 0.25);
    if (p.downTimer <= 0) {
      game.state = 'gameover';
    }
    moveEntity(p, dt);
    return;
  }

  /* 脱战自愈（上限 55%，医疗包才能继续往上加） */
  if (game.time - (p.lastHurt || -99) > 5 && p.hp < p.maxHp * 0.55) {
    p.hp = Math.min(p.maxHp * 0.55, p.hp + 7 * dt);
  }

  /* 瞄准 */
  const mw = mouseWorld();

  /* 移动：带加速度与摩擦，有重量感但不是拖沓 */
  const left = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];
  const down = keys['KeyS'] || keys['ArrowDown'];
  const mv = (right ? 1 : 0) - (left ? 1 : 0);

  /* 蹲下：碰撞盒 58 → 41，散布收紧、移动变慢，蹲着能躲开打高位的子弹 */
  const wantCrouch = down && p.onGround && p.dashTime <= 0 && mv === 0;
  p.crouch = lerp(p.crouch, wantCrouch ? 1 : 0, 1 - Math.pow(0.0006, dt));
  if (p.crouch < 0.01) p.crouch = 0;
  p.h = p.baseH - 17 * p.crouch;
  p.ads = !!input.aiming;

  p.aim = Math.atan2(mw.y - (p.y - p.h * 0.62), mw.x - p.x);

  if (p.dashTime > 0) {
    p.dashTime -= dt;
    p.vx = p.dashDir * 950;
    if (Math.random() < 0.7) {
      particles.push({
        x: p.x, y: p.y - p.h * 0.5, vx: -p.dashDir * rand(30, 90), vy: rand(-30, 30),
        life: 0.3, max: 0.3, color: '#8fd0ff', size: rand(3, 6), grav: 0
      });
    }
  } else {
    const accel = p.onGround ? MOVE_ACCEL : AIR_ACCEL;
    if (mv !== 0) {
      const diff = mv * MOVE_SPEED - p.vx;
      p.vx += clamp(diff, -accel * dt, accel * dt);
    } else {
      const fric = (p.onGround ? MOVE_FRICTION : MOVE_FRICTION * 0.3) * dt;
      p.vx = Math.abs(p.vx) <= fric ? 0 : p.vx - Math.sign(p.vx) * fric;
    }
  }

  /* 冲刺 */
  if (keys['ShiftLeft'] || keys['ShiftRight']) {
    if (p.dashCd <= 0 && mv !== 0 && p.dashTime <= 0) {
      p.dashTime = 0.15;
      p.dashDir = mv;
      p.dashCd = 1.0;
      beep(320, 0.09, 'sine', 0.03, 700);
    }
  }

  /* 跳跃：土狼时间 + 输入缓冲 + 可变跳高 + 下穿平台 + 二段跳 */
  p.coyote = p.onGround ? COYOTE_TIME : Math.max(0, p.coyote - dt);
  if (p.jumpBuffer > 0 && (p.onGround || p.coyote > 0)) {
    if (down && p.plat && !p.plat.solid) {
      /* 站在空中平台上按住下 + 跳 = 穿过平台跳下去 */
      p.dropTimer = DROP_TIME;
      p.y += 4;
      p.vy = 80;
      p.jumpBuffer = 0;
      p.coyote = 0;
      p.onGround = false;
      beep(150, 0.05, 'sine', 0.016, 90);
    } else {
      doJump(p);
      p.coyote = 0;
    }
  } else if (p.jumpBuffer > 0 && p.airJumps > 0) {
    /* 二段跳：空中再按一次跳。高度比首跳低一档（184 vs 238），
       所以它救急、救不了「一口气上最高台」，平台设计不会被它废掉。 */
    doAirJump(p);
  }

  /* 开火 */
  const wp = WEAPONS[p.weapon];
  const wantFire = input.firing && (wp.auto || !p.triggerHeld);
  if (wantFire && p.fireCd <= 0 && p.reloading <= 0) {
    if (p.mags[p.weapon] > 0) {
      playerFire(p, wp);
    } else {
      p.reloading = wp.reload;
      sfxReload();
    }
  }
  p.triggerHeld = input.firing;

  /* 打空自动换弹 */
  if (p.mags[p.weapon] === 0 && p.reloading <= 0) {
    p.reloading = wp.reload;
    sfxReload();
  }

  /* 换弹 */
  if (p.reloading > 0) {
    p.reloading -= dt;
    if (p.reloading <= 0) {
      p.mags[p.weapon] = wp.mag;
      sfxReload();
      spawnText(p.x, p.y - p.h - 10, '装填完毕', '#9ad0ff');
    }
  }

  /* 手雷 */
  if (keys['KeyG'] && game.grenadeCd <= 0) {
    game.grenadeCd = 2.6;
    const ang = p.aim - 0.35;
    spawnGrenade(p.x, p.y - p.h * 0.7, Math.cos(ang) * 760, Math.sin(ang) * 760 - 120, 90, 'player');
    beep(300, 0.1, 'triangle', 0.03, 500);
  }

  /* 救大肥鱼 */
  if (buddy.downed && Math.abs(p.x - buddy.x) < 70 && (keys['KeyE'] || keys['KeyF'])) {
    buddy.reviveProgress += dt;
    if (Math.random() < dt * 10) spawnParticles(buddy.x, buddy.y - 20, 1, '#7ef0b0', 90, 0.5, 3, -60);
    if (buddy.reviveProgress >= 2.0) {
      buddy.downed = false;
      buddy.hp = buddy.maxHp * 0.55;
      buddy.reviveProgress = 0;
      buddy.invuln = 1.2;
      sfxRevive();
      spawnText(buddy.x, buddy.y - 70, '大肥鱼归队', '#7ef0b0');
      buddy.bubble = '多谢！';
      buddy.bubbleTimer = 2;
    }
  } else if (buddy.downed) {
    buddy.reviveProgress = Math.max(0, buddy.reviveProgress - dt * 0.3);
  }

  p.anim += Math.abs(p.vx) * dt * 0.055;
  moveEntity(p, dt);
}

/* ---------------- 其它实体 ---------------- */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    /* 每把枪自己的弹道：grav 决定要抬多少枪，drag 决定这颗弹能飞多远。
       霰弹枪的 grav 是狙击的十几倍、drag 又是它的二十几倍 —— 三十米外
       一枪出去基本是撒了一把豆子，这正是散弹枪该有的样子。 */
    b.vy += (b.grav || 0) * dt;
    if (b.drag > 0) {
      const k = Math.pow(1 - b.drag, dt);
      b.vx *= k; b.vy *= k;
    }
    b.life -= dt;

    /* 已经飞过的距离：伤害衰减、曳光淡出都看它 */
    b.dist = (b.dist || 0) + Math.hypot(b.vx, b.vy) * dt;

    /* 远端伤害衰减：射程 55% 以内满伤，之后线性掉到底。
       注意参考距离用的是「这把枪自己的射程」而不是固定的 1000px ——
       以前 1000px 封顶时，霰弹在 820 的边缘只掉一半、步枪在 3800 还是满伤，
       短枪的「越远越软」完全体现不出来。现在按比例折算，
       每把枪的「最佳交战距离」才有意义。 */
    const fallRef = b.range > 0 ? b.range * 0.55 : 1000;
    const power = b.dmg * (1 - (b.falloff || 0) * clamp(b.dist / fallRef, 0, 1));

    /* 火箭尾迹 */
    if (b.rocket) {
      particles.push({
        x: b.x - b.vx * 0.006, y: b.y - b.vy * 0.006,
        vx: rand(-26, 26), vy: rand(-26, 26),
        life: 0.34, max: 0.34, color: '#ffb066', size: rand(3, 7), grav: -40
      });
      if (Math.random() < 0.4) {
        particles.push({
          x: b.x - b.vx * 0.012, y: b.y - b.vy * 0.012,
          vx: rand(-18, 18), vy: rand(-30, -6),
          life: 0.6, max: 0.6, color: '#8e8378', size: rand(5, 11), grav: -22
        });
      }
    }

    let hit = false;
    let hx = b.x, hy = b.y;

    /* 一帧能走 30px，而平台只有 18~26 厚、人只有几十高 —— 只测「当前点」会整段穿过去。
       沿这一帧的轨迹按 8px 采样，从近到远取最先命中的那个点。 */
    const dx = b.x - b.px, dy = b.y - b.py;
    const segLen = Math.hypot(dx, dy);
    const steps = clamp(Math.ceil(segLen / 8), 1, 10);

    for (let s = 1; s <= steps && !hit; s++) {
      const qx = b.px + dx * (s / steps);
      const qy = b.py + dy * (s / steps);

      /* 沙袋掩体 / 实体障碍先吃子弹，其次是空中平台的实心梁 */
      const cov = coverBlocks(qx, qy);
      if (cov) {
        hurtCover(cov, power, qx, qy);
        hx = qx; hy = qy; hit = true;
        break;
      }
      const plat = platformBlocks(qx, qy, b.ignorePlat);
      if (plat) {
        hitPlatform(plat, qx, qy);
        hx = qx; hy = qy; hit = true;
        break;
      }

      if (b.team === 'enemy') {
        /* 谁挡在弹道上谁先吃子弹（大肥鱼站在你身前时真的会替你挡） */
        const hitP = player && !player.downed && pointHitEntity(qx, qy, b.r, player);
        const hitB = buddy && !buddy.downed && !buddy.dead && pointHitEntity(qx, qy, b.r, buddy);
        if (hitP && hitB) {
          if (Math.abs(b.px - buddy.x) <= Math.abs(b.px - player.x)) {
            damageFriendly(buddy, power);
          } else {
            damageFriendly(player, power);
          }
          hx = qx; hy = qy; hit = true;
        } else if (hitP) {
          damageFriendly(player, power);
          hx = qx; hy = qy; hit = true;
        } else if (hitB) {
          damageFriendly(buddy, power);
          hx = qx; hy = qy; hit = true;
        }
      } else {
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.dead) continue;
          if (b.hits && b.hits.indexOf(e) >= 0) continue;
          if (pointHitEntity(qx, qy, b.r, e)) {
            const before = e.hp;
            /* 弹着点用采样点，部位判定才准 */
            damageEnemy(e, power, qx, qy, b.owner);
            if (b.owner === 'buddy') {
              game.tele.buddyHits++;
              game.tele.buddyDmg += Math.max(0, before - Math.max(0, e.hp));
            }
            sfxHit();
            /* 狙击弹：打穿之后继续飞，最多穿 pierce 个 */
            if (b.pierce > 0) {
              b.pierce--;
              b.hits.push(e);
              spawnParticles(qx, qy, 5, '#bfe4ff', 220, 0.3, 3, 300);
              continue;
            }
            hx = qx; hy = qy; hit = true;
            break;
          }
        }
      }

      if (!hit && qy > world.groundY + 4) {
        spawnParticles(qx, world.groundY - 2, 3, '#c8b48a', 120, 0.25, 2.5, 500);
        hx = qx; hy = world.groundY; hit = true;
        break;
      }
    }

    /* 命中点回写，火箭在真实弹着点炸开才不会浮在半空 */
    if (hit) { b.x = hx; b.y = hy; }

    if (hit && b.rocket && b.blast > 0) {
      /* 火箭只吃溅射伤害，命中点直接炸开 */
      explode(b.x, b.y, b.blast, b.blastDmg, b.team === 'enemy' ? 'enemy' : 'player');
    }

    if (hit || b.life <= 0 || (b.range > 0 && b.dist > b.range) || b.x < -100 || b.x > world.w + 100) {
      bullets.splice(i, 1);
    }
  }
}

function explode(x, y, radius, dmg, team) {
  sfxBoom();
  addShake(12);

  /* 上升烟团：比火球活得久，炸完还留一团灰在空气里。
     必须最先塞进 particles —— 否则烟会盖在火球上面，整个爆炸看着发闷。 */
  const puffs = 4 + Math.min(4, Math.round(radius / 60));
  for (let i = 0; i < puffs; i++) {
    particles.push({
      x: x + rand(-radius * 0.40, radius * 0.40),
      y: y - rand(4, 20),
      vx: rand(-38, 38),
      vy: rand(-108, -48),
      life: rand(0.62, 0.95), max: 0.95,
      color: 'rgba(84,74,64,1)',
      size: rand(6, 10) + radius * 0.045,
      grav: -40, ball: true, smoke: true
    });
  }

  spawnParticles(x, y, 34, '#ffb347', 460, 0.7, 7, 700);
  spawnParticles(x, y, 16, '#6a5a4a', 300, 0.9, 9, 400);

  /* 火球本体：只有火花 + 冲击环的话，静止帧看起来像「放了个小烟花」。
     补一个加色柔光球，0.30 秒内膨胀一倍再散掉，才有「炸开」的体积感。 */
  particles.push({
    x, y: y - 4, vx: 0, vy: 0, life: 0.30, max: 0.30,
    color: '#ffcf7a', size: radius * 0.36, grav: 0, ball: true
  });

  /* 冲击环放最后，压在最上面才看得清边界 */
  particles.push({
    x, y, vx: 0, vy: 0, life: 0.28, max: 0.28,
    color: '#fff3c4', size: radius * 0.55, grav: 0, ring: true
  });

  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const d = distTo(x, y, e.x, e.y - e.h * 0.5);
    if (d < radius) damageEnemy(e, dmg * (1 - d / radius * 0.55), e.x, e.y - e.h * 0.5);
  }
  if (team === 'enemy') {
    if (player && !player.downed && distTo(x, y, player.x, player.y - 28) < radius) {
      damageFriendly(player, dmg * 0.45);
    }
  }
}

function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.fuse -= dt;
    g.spin += dt * 10;
    g.vy += GRAV * dt * 0.8;
    g.x += g.vx * dt;
    g.y += g.vy * dt;

    const gy = surfaceBelow(g.x, g.y);
    if (g.y > gy) {
      g.y = gy;
      g.vy *= -0.42;
      g.vx *= 0.72;
      if (Math.abs(g.vy) < 40) g.vy = 0;
    }
    if (g.x < 20 || g.x > world.w - 20) g.vx *= -0.5;

    if (g.fuse <= 0) {
      /* 燃烧瓶：炸开的同时在地上留一摊火，封住这片走位 */
      explode(g.x, g.y, g.fire ? 92 : 120, g.dmg, g.team);
      if (g.fire) spawnFire(g.x, g.y + 4, 116, 5.4, 7);
      grenades.splice(i, 1);
    }
  }
}

/* ---------------- 火焰地带 ----------------
   焦土纵火者的燃烧瓶落地后留下的持续伤害区。
   只烧友方（玩家 / 大肥鱼），敌人自己踩着不疼 —— 不然小兵会把自己烧死。
   ---------------------------------------- */
function updateFires(dt) {
  for (let i = fires.length - 1; i >= 0; i--) {
    const f = fires[i];
    f.life -= dt;
    if (f.life <= 0) { fires.splice(i, 1); continue; }

    /* 火苗粒子：越到后期越稀，视觉上「快烧完了」 */
    const rate = clamp(f.life / f.max, 0, 1);
    if (Math.random() < dt * 34 * rate) {
      particles.push({
        x: f.x + rand(-f.r * 0.85, f.r * 0.85),
        y: f.y - rand(0, 8),
        vx: rand(-16, 16), vy: rand(-92, -34),
        life: rand(0.28, 0.6), max: 0.6,
        color: Math.random() < 0.5 ? '#ffb347' : '#ff7a2a',
        size: rand(2.5, 5.5), grav: -50
      });
    }

    f.tick -= dt;
    if (f.tick > 0) continue;
    f.tick = 0.3;

    const inFire = (a) => a && !a.dead && !a.downed &&
      Math.abs(a.x - f.x) < f.r * 0.85 && a.y > f.y - 74 && a.y < f.y + 30;
    if (inFire(player)) damageFriendly(player, f.dmg);
    if (inFire(buddy)) damageFriendly(buddy, f.dmg);
  }
}

/* ---------------- 场景机关：地刺 / 喷火口 ----------------
   机关只对有血有肉的人生效（玩家、大肥鱼、敌兵），不挡子弹也不挡人，
   所以它带来的是「站位压力」而不是「路被堵了」。 */
function hazardHit(a, hz) {
  if (!a || a.dead || a.downed) return false;
  const half = a.w * 0.42;
  if (a.x + half < hz.x || a.x - half > hz.x + hz.w) return false;
  if (a.y < hz.y - hz.h * 0.9 || a.y > hz.y + 12) return false;
  return true;
}

function updateHazards(dt) {
  for (let i = 0; i < world.hazards.length; i++) {
    const hz = world.hazards[i];
    hz.cd = Math.max(0, (hz.cd || 0) - dt);

    if (hz.kind === 'spike') {
      /* 地刺：踩上去就掉血 + 被顶开，站不住，得跳过去或者绕开 */
      const hit = (a) => {
        if (hz.cd > 0 || !hazardHit(a, hz) || !a.onGround) return;
        hz.cd = 0.42;
        if (a.kind === 'player' || a.kind === 'buddy') {
          damageFriendly(a, hz.dmg);
          a.vy = -420;
          a.vx += (a.x < hz.x + hz.w * 0.5 ? -1 : 1) * 190;
          a.onGround = false;
          tickSpikes(hz);
        } else {
          damageEnemy(a, hz.dmg, a.x, a.y - 10, 'player');
        }
      };
      hit(player); hit(buddy);
      for (let k = 0; k < enemies.length; k++) hit(enemies[k]);
      continue;
    }

    /* 喷火口：一个周期里「静默 → 预警火星 → 窜火 → 收火」，
       预警阶段地面冒火星、有嘶嘶声，是给玩家的反应窗口。 */
    const period = hz.period || 2.8;
    hz.t = ((hz.t || 0) + dt) % period;
    const warnAt = period - (hz.warn || 1.0) - 0.62;   /* 冒火星 */
    const fireAt = period - 0.62;                       /* 窜火 */

    if (hz.t >= warnAt && hz.t < fireAt) {
      if (Math.random() < dt * 22) {
        particles.push({
          x: hz.x + rand(2, hz.w - 2), y: hz.y - rand(0, 6),
          vx: rand(-22, 22), vy: rand(-120, -60),
          life: rand(0.2, 0.45), max: 0.45,
          color: Math.random() < 0.5 ? '#ffcf6a' : '#ff9a3c',
          size: rand(1.6, 3), grav: 220
        });
      }
      if (hz.seed % 2 === 0 && Math.random() < dt * 3) beep(680, 0.05, 'sine', 0.008, 300);
      hz.firing = 0;
    } else if (hz.t >= fireAt) {
      hz.firing = 1;
      /* 火柱粒子：一路往上窜，到顶散开 */
      const n = Math.random() < dt * 90 ? 3 : (Math.random() < dt * 40 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        particles.push({
          x: hz.x + rand(4, hz.w - 4), y: hz.y - rand(0, 10),
          vx: rand(-40, 40), vy: rand(-760, -460),
          life: rand(0.26, 0.46), max: 0.46,
          color: Math.random() < 0.4 ? '#ffe6a8' : (Math.random() < 0.6 ? '#ff9a3c' : '#ff5a20'),
          size: rand(3, 7.5), grav: 260
        });
      }
      if (Math.random() < dt * 26) {
        particles.push({
          x: hz.x + rand(0, hz.w), y: hz.y - rand(20, hz.h),
          vx: rand(-30, 30), vy: rand(-90, -20),
          life: rand(0.3, 0.6), max: 0.6,
          color: 'rgba(90,70,60,0.55)', size: rand(8, 16), grav: -60
        });
      }
      if (hz.cd <= 0) {
        const burn = (a) => {
          if (!hazardHit(a, hz)) return false;
          if (a.kind === 'player' || a.kind === 'buddy') damageFriendly(a, hz.dmg);
          else damageEnemy(a, hz.dmg * 0.8, a.x, a.y - 20, 'player');
          return true;
        };
        let touched = false;
        if (burn(player)) touched = true;
        if (burn(buddy)) touched = true;
        for (let k = 0; k < enemies.length; k++) if (burn(enemies[k])) touched = true;
        if (touched) { hz.cd = 0.34; addShake(3); }
      }
    } else {
      hz.firing = 0;
    }
  }
}

/* 地刺被踩：溅一撮火星与尘，给「扎到脚了」的反馈 */
function tickSpikes(hz) {
  spawnParticles(hz.x + hz.w * 0.5, hz.y - 6, 7, '#d8c9a8', 180, 0.34, 2.6, 900);
  spawnText(hz.x + hz.w * 0.5, hz.y - 44, '扎脚！', '#ffb347');
  beep(190, 0.07, 'square', 0.02, 90);
  addShake(5);
}

/* ---------------- 深渊结算 ----------------
   掉下去不是掉血，是直接没了。玩家坠落 = 立刻 gameover，
   大肥鱼坠落 = 直接倒地（还能救回来），敌兵坠落 = 白送一个人头。 */
function updateFalls(dt) {
  const finish = (a, who) => {
    a.fell = false;
    if (who === 'player') {
      a.hp = 0;
      a.downed = true;
      a.downTimer = 0.001;      /* 下一帧就结算成 gameover */
      a.deathCause = 'fall';
      say('buddy', '指挥官——！掉下去了！');
      spawnText(a.x, a.y - 40, '坠入深渊', '#ff6b6b');
      addShake(16);
      sfxHurt();
    } else if (who === 'buddy') {
      a.hp = 0;
      a.downed = true;
      a.downTimer = 14;
      a.reviveProgress = 0;
      /* 掉坑里没法原地救，把他捞回最近的实地边缘 */
      const back = nearestGroundX(a.x);
      a.x = back;
      a.y = world.groundY - 2;
      a.vy = 0;
      a.vx = 0;
      spawnText(a.x, a.y - 70, '大肥鱼掉坑了', '#ffb347');
      say('buddy', '我掉坑里了……拉我一把！');
      addShake(10);
    } else {
      a.dead = true;
      killEnemy(a);
    }
  };

  if (player.fell) finish(player, 'player');
  if (buddy && buddy.fell && !buddy.downed) finish(buddy, 'buddy');
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.fell && !e.dead) finish(e, 'enemy');
  }
}

/* 离 x 最近的实地（用来把掉坑的大肥鱼捞回来） */
function nearestGroundX(x) {
  for (let d = 0; d < 900; d += 6) {
    if (groundAt(x - d)) return x - d;
    if (groundAt(x + d)) return x + d;
  }
  return x;
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    pk.life -= dt;
    pk.bob += dt * 3;
    pk.vy += GRAV * dt;
    pk.x += pk.vx * dt;
    pk.y += pk.vy * dt;
    pk.vx *= 0.94;
    const gy = surfaceBelow(pk.x, pk.y) - 14;
    if (pk.y > gy) {
      pk.y = gy;
      pk.vy = 0;
      pk.vx *= 0.6;
    }

    let taken = false;
    const near = (a) => a && !a.dead && !a.downed && distTo(a.x, a.y - 28, pk.x, pk.y) < 44;
    const who = near(player) ? player : (near(buddy) ? buddy : null);
    if (who) {
      if (pk.type === 'health') {
        who.hp = Math.min(who.maxHp, who.hp + 32);
        spawnText(who.x, who.y - who.h - 8, '+32 HP', '#7ef0b0');
      } else {
        for (let k = 0; k < who.mags.length; k++) {
          if (who.mags[k] > 0) who.mags[k] = WEAPONS[k].mag;
        }
        who.reloading = 0;
        spawnText(who.x, who.y - who.h - 8, '弹药补充', '#ffd166');
      }
      sfxPick();
      taken = true;
    }
    if (taken || pk.life <= 0) pickups.splice(i, 1);
  }
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (!p.ring) {
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > world.groundY) { p.y = world.groundY; p.vy *= -0.3; p.vx *= 0.7; }
    }
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    t.y += t.vy * dt;
    t.vy += 40 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
  for (let i = casings.length - 1; i >= 0; i--) {
    const c = casings[i];
    c.life -= dt;
    c.vy += GRAV * dt * 0.7;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    if (c.y > world.groundY) { c.y = world.groundY; c.vy *= -0.3; c.vx *= 0.6; }
    if (c.life <= 0) casings.splice(i, 1);
  }
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i];
    d.life -= dt;
    if (d.life <= 0) decals.splice(i, 1);
  }
  for (let i = 0; i < world.covers.length; i++) {
    const c = world.covers[i];
    if (c.hit > 0) c.hit = Math.max(0, c.hit - dt);
  }
}

/* ---------------- 尸体 ---------------- */
/* 尸体只存「位置 + 计时」，软倒的姿态全部交给渲染层按 t 推。
   这样物理层不用维护一套状态机，想调动画只改渲染一处。 */
function updateCorpses(dt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.t += dt;
    c.life -= dt;

    /* 空中被打死的要先掉下来，落地之后才开始软 */
    if (!c.landed) {
      c.vy += GRAV * dt;
      c.y += c.vy * dt;
      /* 掉进深渊的不留尸体 —— 坑里没有地面可以躺 */
      if (c.y > world.groundY + FALL_DEPTH) { corpses.splice(i, 1); continue; }
      const floor = surfaceBelow(c.x, c.y);
      if (c.y >= floor) {
        c.y = floor;
        c.vy = 0;
        c.landed = true;
        c.t = 0;                        /* 落地那一下重新计时，空中那截不算软倒 */
        spawnParticles(c.x, c.y - 4, 6, '#9a8e7e', 90, 0.42, 3, 320);
      }
    }

    if (c.life <= 0) corpses.splice(i, 1);
  }
}

/* ---------------- 摄像机 ---------------- */
function updateCamera(dt) {
  const p = player;
  const mw = mouseWorld();
  const lookAhead = clamp((mw.x - p.x) * 0.18, -170, 170);
  const targetX = clamp(p.x - VIEW_W / 2 + lookAhead, 0, Math.max(0, world.w - VIEW_W));
  camera.x = lerp(camera.x, targetX, 1 - Math.pow(0.0015, dt));
  camera.shake = Math.max(0, camera.shake - dt * 44);
}

/* ---------------- 主更新 ---------------- */
function update(dt) {
  /* BOSS 击破慢动作：把世界时间拧慢，白闪和连环爆才有特写感。
     注意先扣自己的计时器，再缩放 dt，否则慢动作会自己续命。 */
  if (game.slowmo > 0) {
    game.slowmo = Math.max(0, game.slowmo - dt);
    dt *= 0.32;
  }

  game.time += dt;
  sayCooldown = Math.max(0, sayCooldown - dt);

  game.screenFlash = Math.max(0, (game.screenFlash || 0) - dt * 1.5);
  if (game.bossIntro) {
    game.bossIntro.t += dt;
    if (game.bossIntro.t >= game.bossIntro.dur) game.bossIntro = null;
  }

  if (game.state !== 'playing') return;

  updatePlayer(dt);
  updateBuddy(dt);

  for (let i = 0; i < enemies.length; i++) updateEnemy(enemies[i], dt);
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) enemies.splice(i, 1);

  updateHazards(dt);
  updateFalls(dt);

  updateBullets(dt);
  updateGrenades(dt);
  updateFires(dt);
  updatePickups(dt);
  updateEffects(dt);
  updateCorpses(dt);
  updateWaves(dt);
  updateCamera(dt);

  if (game.msgTimer > 0) game.msgTimer -= dt;
}

/* ---------------- 按键 ---------------- */
function onKeyPress(code) {
  ensureAudio();

  if (game.state === 'title') {
    if (code === 'Enter' || code === 'Space') { startStage(1); }
    return;
  }
  if (game.state === 'stageclear') {
    if (code === 'Enter' || code === 'Space') { startStage(game.stage + 1); }
    return;
  }
  if (game.state === 'gameover') {
    if (code === 'Enter' || code === 'Space') { startStage(game.stage); }
    return;
  }

  if (code === 'KeyP' || code === 'Escape') {
    game.state = game.state === 'paused' ? 'playing' : 'paused';
    return;
  }
  if (game.state !== 'playing') return;

  /* 1-5 换枪：老玩家肌肉记忆，不用看 HUD */
  const wk = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].indexOf(code);
  if (wk >= 0 && wk < WEAPONS.length && player.weapon !== wk) {
    player.weapon = wk;
    player.reloading = 0;
    /* 换枪要拉一下枪机，给个短硬直，避免贴脸无脑切枪 */
    player.fireCd = Math.max(player.fireCd, 0.22);
    beep(420, 0.06, 'square', 0.02, 300);
  }
  if (code === 'KeyR' && player.reloading <= 0 && player.mags[player.weapon] < WEAPONS[player.weapon].mag) {
    player.reloading = WEAPONS[player.weapon].reload;
    sfxReload();
  }
  /* 给大肥鱼下指令（就三个键，不用读屏幕） */
  if (code === 'KeyC') { buddy.cmd = 'follow'; buddy.bubble = '收到，跟着你！'; buddy.bubbleTimer = 1.8; }
  if (code === 'KeyV') { buddy.cmd = 'rush'; buddy.bubble = '好，我先上！'; buddy.bubbleTimer = 1.8; }
  if (code === 'KeyB') { buddy.cmd = 'hold'; buddy.holdX = buddy.x; buddy.bubble = '我守这儿。'; buddy.bubbleTimer = 1.8; }
  /* Q 切换大肥鱼性格：谨慎 / 均衡 / 突击 */
  if (code === 'KeyQ') {
    buddy.style = (buddy.style + 1) % 3;
    buddy.bubble = '切到「' + BUDDY_STYLES[buddy.style].name + '」打法。';
    buddy.bubbleTimer = 2.2;
    blog(buddy, '切换风格 → ' + BUDDY_STYLES[buddy.style].name);
  }
  /* Tab 展开/收起战术面板 */
  if (code === 'Tab') aiPanelOpen = !aiPanelOpen;
}


/* ===== render.js ===== */
'use strict';

/* ==================================================================
   渲染层 1：画布适配 / 背景 / 地形 / 角色
   ================================================================== */

function resizeCanvas() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cvs.style.width = Math.floor(W * s) + 'px';
  cvs.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resizeCanvas);

function seeded(n) {
  let s = n * 9301 + 49297;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
const _rnd = seeded(7);

/* 稳定哈希：同一个输入永远得到同一个 [0,1) 值，用来给障碍物加「不重复的随机」细节 */
function hash01(n) {
  const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return s - Math.floor(s);
}

/* ------------------------------------------------------------------
   两段腿反解（IK）
   给一个脚的目标落点，算出大腿摆角与膝弯角，喂给 drawLeg。
   蹲下靠它把脚钉在地面上，而不是让腿被压成滑铲。
   ------------------------------------------------------------------ */
const LEG_TH = 13, LEG_SH = 15;
function legIK(hipX, hipY, footX, footY) {
  let dx = footX - hipX, dy = footY - hipY;
  let d = Math.sqrt(dx * dx + dy * dy) || 0.001;
  const dmin = Math.abs(LEG_TH - LEG_SH) + 1.2, dmax = LEG_TH + LEG_SH - 0.6;
  if (d < dmin) { dx *= dmin / d; dy *= dmin / d; d = dmin; }
  else if (d > dmax) { dx *= dmax / d; dy *= dmax / d; d = dmax; }
  const base = Math.atan2(dx, dy);
  const cosH = clamp((LEG_TH * LEG_TH + d * d - LEG_SH * LEG_SH) / (2 * LEG_TH * d), -1, 1);
  const hipA = Math.acos(cosH);
  const swing = base + hipA;
  const kx = Math.sin(swing) * LEG_TH, ky = Math.cos(swing) * LEG_TH;
  const knee = swing - Math.atan2(dx - kx, dy - ky);
  return { swing: swing, knee: knee };
}

/* 远景平铺周期（世界比这个宽，靠取模循环贴） */
const SKY_PERIOD = 9000;

const farCity = [];
for (let i = 0; i < 90; i++) {
  const w = 50 + _rnd() * 90;
  farCity.push({
    x: i * 100 + _rnd() * 40,
    w: w,

  });
}
const midRuins = [];
for (let i = 0; i < 45; i++) {
