const HERO_SPRITE = (typeof Image !== 'undefined') ? new Image() : null;
if (HERO_SPRITE) HERO_SPRITE.src = HERO_SPRITE_IDLE_B64;
const HERO_SPRITE_HOLD = (typeof Image !== 'undefined') ? new Image() : null;
if (HERO_SPRITE_HOLD) HERO_SPRITE_HOLD.src = HERO_SPRITE_HOLD_B64;

function heroSpriteReady() {
  return !!HERO_SPRITE && HERO_SPRITE.complete && HERO_SPRITE.naturalWidth > 0;
}
function heroHoldReady() {
  return !!HERO_SPRITE_HOLD && HERO_SPRITE_HOLD.complete && HERO_SPRITE_HOLD.naturalWidth > 0;
}

const HERO_VH = 96;              /* 屏幕上的视觉身高 */
const HERO_ART_W_HOLD = 87;      /* 素材归一化后的宽度（hold，192 高） */
const HERO_ART_W_IDLE = 78;      /* 同上（idle） */
const HERO_AR_HOLD = HERO_ART_W_HOLD / 192;
const HERO_AR_IDLE = HERO_ART_W_IDLE / 192;

/* 脚底锚点：按「两只鞋的中点」量，不是按图的几何中心 ——
   图左边还挂着背包，用图心当锚点人会整体前移。 */
const HERO_FOOT_HOLD = 0.414;
const HERO_FOOT_IDLE = 0.551;

/* 蹲下两段压缩：头段几乎不压（盔是圆的，压了就扁），身段压得狠。
   切点在下巴/衣领之间（y≈34%），压缩时接缝落在真实的结构线上。 */
const HERO_NECK = 0.34;
const HERO_HEAD_K = 0.93;
const HERO_BODY_K = 0.58;

function heroBands(cq) {
  const headH = HERO_VH * HERO_NECK * (1 - cq * (1 - HERO_HEAD_K));
  const bodyH = HERO_VH * (1 - HERO_NECK) * (1 - cq * (1 - HERO_BODY_K));
  return { headH, bodyH, total: headH + bodyH };
}
function heroRowY(rowFrac, cq) {
  if (cq <= 0.01) return -HERO_VH + rowFrac * HERO_VH;
  const { headH, bodyH, total } = heroBands(cq);
  if (rowFrac < HERO_NECK) return -total + (rowFrac / HERO_NECK) * headH;
  return -bodyH + ((rowFrac - HERO_NECK) / (1 - HERO_NECK)) * bodyH;
}

/* 前手（扣扳机那只）的掌心，量自 art/hero_hold.png：art 像素 (70, 92)。
   枪的挂点就是这里 —— 数字是量出来的，不是猜的。 */
const HERO_HAND_ROW_HOLD = 92 / 192;
const HERO_HAND_XFRAC_HOLD = 70 / HERO_ART_W_HOLD;
/* 枪的尺寸系数。按身高 96/58≈1.65 等比放大会让他端着一门炮：
   这张立绘头占了三分之一，等比缩放后枪比小臂还粗。0.92 是「顺手的一把步枪」。 */
const HERO_GUN_K = 0.92;

/* 拆腿：把立绘拆成「躯干 + 前腿 + 后腿」三片，腿要动就必须单独摆。
   腿片的上缘故意伸进胯部（y=112，比切口 128 高 16），画的时候先腿后躯干，
   伸进胯里的那 16px 被躯干盖住 —— 腿不管摆多大，切口永远藏在里面。
   矩形全部写在 87×192 的立绘坐标里，按 naturalWidth/87 自动缩放。 */
const HERO_LEG = {
  front: { sx: 37, sy: 112, sw: 50, sh: 80, cutX0: 37, cutX1: 87, cutY: 128, pivotX: 50, pivotY: 126 },
  back:  { sx: 0,  sy: 112, sw: 37, sh: 80, cutX0: 0,  cutX1: 37, cutY: 128, pivotX: 27, pivotY: 126, dim: 0.10 }
};
const _heroSplit = new Map();
function heroLegParts(img) { return legPartsOf(img, HERO_LEG, HERO_ART_W_HOLD, _heroSplit); }

/* 摆幅要按「看得见的量」定，不是按角度手感定：髋到脚 66 立绘像素 = 33 屏幕像素，
   0.16rad 让脚前后挪 10 立绘像素 = 5 屏幕像素，两只靴子来回差一个靴宽 ——
   刚够读出「在迈步」，再大就开始像踢正步（这张是开腿站姿，腿本来就分得开）。 */
const HERO_GAIT_K = {
  stepRot: 0.16, stepLift: 10,
  idleRot: 0.038, idleLift: 2.6,
  airFront: 0.15, airBack: -0.12, airLiftF: 8.0, airLiftB: 9.0
};

/* 受击红闪的纯红剪影（按图缓存，一张一张来） */
const _heroTint = new Map();
function heroTint(img) {
  if (!img) return null;
  let t = _heroTint.get(img);
  if (t === undefined) { t = whaleTintFor(img); _heroTint.set(img, t); }
  return t;
}

/* 枪：和大肥鱼共用同一把（whaleGunBody 是按「局部 +x 朝前」画的通用步枪），
   只换挂点和缩放。part='back' 先画枪托弹匣（被手挡住），'front' 再画机匣枪管。 */
function heroGunProp(a, cq, lean, part) {
  ctx.save();
  const pitch = whalePitch(a);
  const hx = (HERO_HAND_XFRAC_HOLD - HERO_FOOT_HOLD) * (HERO_VH * HERO_AR_HOLD);
  const hy = heroRowY(HERO_HAND_ROW_HOLD, cq || 0);
  ctx.translate(hx, hy);
  /* 外层已经 scale(facing,1) 镜像过，这里的 +x 就是面朝方向；
     外层还整体倾了 lean，这里要扣掉，否则枪会比准星多转那 3° */
  ctx.rotate(pitch - (lean || 0));
  ctx.scale(HERO_GUN_K, HERO_GUN_K);
  ctx.translate(-9, -5);                                          /* 握把咬住掌心 */
  ctx.translate(-Math.min(1, (a.muzzle || 0) * 12) * 1.5, 0);     /* 后坐 */
  whaleGunBody(a, part);
  ctx.restore();
}

/* 兜底剪影：位图还没解码完（首帧）或跑无头测试（没有 Image）时用。
   几块炭黑 + 一条目镜光 + 一把枪，够顶一两帧，不至于让玩家闪一下空白。 */
function heroBlocky(a, cq, lean) {
  const bands = heroBands(cq);
  const headH = bands.headH, bodyH = bands.bodyH, total = bands.total;
  heroGunProp(a, cq, lean, 'back');
  ctx.fillStyle = '#161b21';
  roundRect(-8, -bodyH, 16, bodyH, 4);
  ctx.fill();
  ctx.fillStyle = '#20272f';
  roundRect(-8.5, -total, 17, headH, 7);
  ctx.fill();
  ctx.fillStyle = '#78e2ff';
  roundRect(1.5, -total + headH * 0.44, 6.5, 2.2, 1.1);
  ctx.fill();
  heroGunProp(a, cq, lean, 'front');
}

function drawHero(a, isBuddy) {
  if (a.dead) return;
  if (a.downed) { drawDowned(a); return; }

  const sx = a.x - camera.x;
  const facing = Math.cos(a.aim) >= 0 ? 1 : -1;
  const sq = clamp(a.landSquash || 0, 0, 1);
  const t = game.time;

  /* 承托面阴影 */
  const under = surfaceBelow(a.x, a.y);
  const gap = clamp((under - a.y) / 190, 0, 1);
  const sk = 1 - gap * 0.68;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.42 * sk).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(sx + facing * 2, under + 1, 17 * sk, 4.8 * sk, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 冲刺残影：暗块 + 一点冷调，比纯色块更像残影 */
  if ((a.dashTime || 0) > 0) {
    const dir = Math.sign(a.vx) || facing;
    for (let i = 3; i >= 1; i--) {
      ctx.globalAlpha = 0.10 * i;
      ctx.fillStyle = '#1a2733';
      roundRect(sx - dir * i * 10 - 8, a.y - 96 * 0.86, 17, 96 * 0.78, 8);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* 二段跳空翻：与士兵/大肥鱼共用 AIRJUMP_FLIP 时钟 */
  let flipK = 0, flipAng = 0;
  if ((a.airJumpT || 0) > 0) {
    flipK = clamp(1 - a.airJumpT / AIRJUMP_FLIP, 0, 1);
    const e = flipK * flipK * (3 - 2 * flipK);
    flipAng = (a.flipDir || facing) * Math.PI * 2 * e;
  }
  const pivot = HERO_VH * 0.56;
  if (flipK > 0 && flipK < 0.82) {
    const al = 0.34 * (1 - flipK / 0.82);
    ctx.strokeStyle = 'rgba(120,226,255,' + al.toFixed(3) + ')';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 2; i++) {
      const a0 = flipAng - 1.7 - i * 0.5;
      ctx.beginPath();
      ctx.arc(sx, a.y - pivot, HERO_VH * 0.42 - i * 5, a0, a0 + 1.15);
      ctx.stroke();
    }
  }

  const blink = a.invuln > 0 && Math.floor(a.invuln * 18) % 2 === 0;

  ctx.save();
  ctx.translate(sx, a.y);
  ctx.scale(1 + sq * 0.11, 1 - sq * 0.15);
  if (flipAng) {
    ctx.translate(0, -pivot);
    ctx.rotate(flipAng);
    ctx.translate(0, pivot);
  }
  if (blink) ctx.globalAlpha = 0.5;

  const cq = clamp(a.crouch || 0, 0, 1);

  /* ---------- 位图通道 ---------- */
  const holdUse = heroHoldReady();
  const img0 = holdUse ? HERO_SPRITE_HOLD : HERO_SPRITE;
  const spH = HERO_VH, spW = spH * (holdUse ? HERO_AR_HOLD : HERO_AR_IDLE);
  const dx = -spW * (holdUse ? HERO_FOOT_HOLD : HERO_FOOT_IDLE);

  ctx.scale(facing, 1);

  /* 倾身：绕脚底转一点点，头、肩、枪一起跟着准星走 */
  const lean = whaleLean(a);
  if (lean) ctx.rotate(lean);

  /* 位图没就绪就别往下算了 —— 下面全是 drawImage / naturalWidth */
  if (!img0 || !img0.naturalWidth) {
    heroBlocky(a, cq, lean);
    ctx.restore();
    if (isBuddy) drawBuddyPlate(a, sx, a.y + heroRowY(0, cq) - 8);
    return;
  }

  const natW = img0.naturalWidth, natH = img0.naturalHeight;
  const u = spH / natH;                    /* 立绘像素 → 屏幕像素（等比） */

  /* 枪托 + 弹匣：先铺在立绘底下（等下的人会盖住它） */
  heroGunProp(a, cq, lean, 'back');

  const blit = (img) => {
    if (!img) return;
    if (cq <= 0.01) { ctx.drawImage(img, dx, -spH, spW, spH); return; }
    const { headH, bodyH, total } = heroBands(cq);
    const nk = HERO_NECK * natH;
    ctx.save();
    ctx.scale(1 + cq * 0.10, 1);         /* 蹲下时横向略胖，重心才稳 */
    /* 身段先画（贴地）：+0.5 是补缝，避免两条 drawImage 之间露 1px 背景 */
    ctx.drawImage(img, 0, nk, natW, natH - nk, dx, -bodyH, spW, bodyH + 0.5);
    /* 头段压在身段上：只压到 0.93，盔还是圆的 */
    ctx.drawImage(img, 0, 0, natW, nk, dx, -total, spW, headH + 0.5);
    ctx.restore();
  };

  const parts = holdUse ? heroLegParts(img0) : null;
  const splitOn = !!parts && cq <= 0.02;

  const blitLeg = (key, useSil, gait) => {
    const R = HERO_LEG[key];
    const g = gait[key];
    const cv = useSil ? whalePartSil(parts, key) : parts.legs[key];
    if (!cv) return;
    const ox = dx + R.sx * u;
    const oy = -spH + R.sy * u - g.lift * u;
    /* 旋转中心 = 髋点，换算成「相对腿片左上角」的偏移；
       translate 已经把腿片左上角挪到原点，所以 drawImage 必须画在 (0,0) */
    const px = (R.pivotX - R.sx) * u, py = (R.pivotY - R.sy) * u;
    ctx.save();
    ctx.translate(ox + px, oy + py);
    ctx.rotate(g.rot);
    ctx.translate(-px, -py);
    ctx.drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, R.sw * u, R.sh * u);
    ctx.restore();
  };

  const blitLegs = (useSil) => {
    const gait = gaitFor(a, t, cq, HERO_GAIT_K);
    blitLeg('back', useSil, gait);
    blitLeg('front', useSil, gait);
  };

  if (splitOn) {
    blitLegs(false);
    blit(parts.body);
  } else {
    blit(img0);
  }

  /* 机匣与枪管后画：从手背上方穿出去 */
  heroGunProp(a, cq, lean, 'front');

  /* 受击红闪：用 sprite 的 alpha 当遮罩的纯红剪影，叠上去。
     拆件时两块腿也要各自红一遍，否则红影子会顶着一双不动的腿。 */
  if (a.flash > 0) {
    ctx.globalAlpha = Math.min(0.5, a.flash * 2.2);
    if (splitOn) {
      blitLegs(true);
      blit(whalePartSil(parts, 'body'));
    } else {
      blit(heroTint(img0));
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (isBuddy) drawBuddyPlate(a, sx, a.y + heroRowY(0, cq) - 8);
}

/* 倒地待救：动作曲线和士兵/大肥鱼完全一样（膝盖先折 → 上身歪出去 → 落地余震），
   只是把「脸」换成头盔、把皮肤色换成炭黑 —— 主角全程不露脸，倒地也不能露。
   枪先扔在地上：人躺平了还端着枪，会读成「他在瞄准」。 */
function drawHeroDowned(a) {
  const x = a.x - camera.x, y = a.y;
  const dir = Math.cos(a.aim || 0) >= 0 ? 1 : -1;

  /* 血泊 */
  ctx.fillStyle = 'rgba(110,24,24,0.40)';
  ctx.beginPath(); ctx.ellipse(x + 6 * dir, y + 1, 40, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 30, 6, 0, 0, Math.PI * 2); ctx.fill();

  const td = Math.max(0, game.time - (a.downedAt === undefined ? game.time : a.downedAt));
  let ang, sink;
  if (td < 0.24) {
    const k = td / 0.24;
    ang = -0.30 * k * k;
    sink = 8 * k * k;
  } else if (td < 0.60) {
    const k = (td - 0.24) / 0.36;
    const e = k * k * (3 - 2 * k);
    ang = -0.30 - 1.21 * e;
    sink = 8 + 2 * e;
  } else {
    const k = td - 0.60;
    ang = -1.51 + Math.sin(k * 15) * Math.exp(-k * 4.6) * 0.075;
    sink = 10;
  }

  /* 掉在地上的枪：先画，压在人下面 */
  ctx.save();
  ctx.translate(x + 30 * dir, y - 2);
  ctx.scale(dir, 1);
  ctx.rotate(0.10);
  ctx.fillStyle = '#2c343c';
  roundRect(-16, -3, 34, 5, 2); ctx.fill();
  ctx.fillStyle = '#454f59';
  roundRect(-2, -6, 12, 5, 1.5); ctx.fill();
  ctx.fillStyle = '#1b2127';
  roundRect(6, -2, 6, 7, 1.5); ctx.fill();
  ctx.restore();

  /* 身姿按「躺平」画，再用角度补间：ang 从 0（直立）走到 -1.51（躺平）。
     士兵那版是「竖直着画再整体转」，转到 86° 腿就朝天竖起来 —— 那是硕兵
     短腿厚身看着还凑合，主角腿长，竖起来像被钉在墙上。
     这里把坐标系直接建在躺姿上，躺稳时 ang2 = 0，天然是平的。 */
  const ang2 = ang + 1.51;

  ctx.save();
  ctx.translate(x, y - sink * 0.08);
  ctx.scale(dir, 1);
  ctx.rotate(ang2);

  /* 腿：髋 → 膝 → 脚，膝盖微微折 */
  ctx.strokeStyle = '#1b2229';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(2, -4);
  ctx.lineTo(14, -8);
  ctx.lineTo(23, -5);
  ctx.stroke();
  ctx.fillStyle = '#0f1418';
  roundRect(22, -10, 9, 8, 2.5); ctx.fill();      /* 靴子 */

  /* 手臂：一只朝头那边摊出去 */
  ctx.strokeStyle = '#1b2229';
  ctx.lineWidth = 6.5;
  ctx.beginPath();
  ctx.moveTo(-9, -10);
  ctx.lineTo(-18, -3);
  ctx.stroke();

  /* 躯干：背板 + 胸甲两块，和立绘的分块对上 */
  ctx.fillStyle = '#141a20';
  roundRect(-16, -14, 21, 14, 5); ctx.fill();
  ctx.fillStyle = '#212a32';
  roundRect(-14, -13, 12, 8, 3); ctx.fill();
  ctx.fillStyle = '#78e2ff';
  roundRect(-11, -11, 2.4, 2.4, 1.2); ctx.fill();  /* 胸口那一点冷光 */

  /* 头盔：一个球 + 一条目镜缝，没有脸 */
  ctx.fillStyle = '#171e25';
  ctx.beginPath(); ctx.arc(-22, -8, 9.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#232c35';
  ctx.beginPath(); ctx.arc(-23, -10, 7.8, Math.PI * 1.02, Math.PI * 1.92); ctx.fill();
  ctx.fillStyle = '#78e2ff';
  roundRect(-27, -9.6, 7, 2.2, 1.1); ctx.fill();
  ctx.restore();

  /* 呼救波纹 */
  const pulse = 0.5 + 0.5 * Math.sin(game.time * 4);
  ctx.strokeStyle = 'rgba(255,110,110,' + (0.14 + pulse * 0.20) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y - 18, 30 + pulse * 12, 0, Math.PI * 2);
  ctx.stroke();
}


/* ===== render2.js ===== */
'use strict';

/* ==================================================================
   渲染层 2：敌兵 / 子弹 / 手雷 / 掉落 / 粒子
   ================================================================== */

/* 敌兵统一按「56 高的人形」绘制，再按实际碰撞盒缩放，
   这样不同体型的敌兵与自己的受击范围完全对齐。 */
function drawEnemy(e) {
  if (e.dead) return;
  /* 外观分派：小克走 chars.js 的瓷装甲 painter（自带落影/地面余晖/受击闪），
     普通敌兵与另外两个 BOSS 的绘制完全不受影响 */
  if (e.look === 'xiaoke') { drawXiaoke(e); return; }
  const h = e.h, w = e.w, sx = e.x - camera.x;
  if (sx < -170 || sx > W + 170) return;

  const t = ENEMY_TYPES[e.type];
  const melee = !!t.melee;
  const boss = !!e.boss;
  const facing = Math.cos(e.aim) >= 0 ? 1 : -1;

  /* 落影 */
  const under = surfaceBelow(e.x, e.y);
  const gap = clamp((under - e.y) / 190, 0, 1);
  const sk = 1 - gap * 0.68;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.4 * sk).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(sx, under + 1, w * 0.5 * sk, 4.4 * sk, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, e.y);
  /* 用「站立身高」缩放而不是当前碰撞盒，蹲下才不会整体被压扁 */
  ctx.scale(w / 30, (e.baseH || h) / 56);

  if (e.spawnGuard > 0) {
    ctx.globalAlpha = 0.28 + Math.abs(Math.sin(e.spawnGuard * 26)) * 0.5;
  }

  const body = e.color, dark = e.dark;
  const bodyMid = tone(body, 0.82);
  const gear = '#2a1d1d';
  const bootCol = '#15171a';

  const moving = e.onGround && Math.abs(e.vx) > 26;
  const ph = e.anim;
  /* 蹲下：胯、肩、头一起下沉，膝盖弯曲把脚留在地面 */
  const cq = e.crouch || 0;
  const lower = 14 * cq;
  const hipY = -33 + lower;
  const shY = -45 + lower;

  let swA, knA, swB, knB;
  if (!e.onGround) {
    swA = 0.4; knA = 0.86; swB = -0.36; knB = 0.24;
  } else if (moving) {
    swA = Math.sin(ph) * 0.5;
    swB = Math.sin(ph + Math.PI) * 0.5;
    knA = Math.max(0, Math.sin(ph + 2.1)) * 0.58;
    knB = Math.max(0, Math.sin(ph + Math.PI + 2.1)) * 0.58;
  } else {
    swA = -0.05; knA = 0.1; swB = 0.07; knB = 0.1;
  }
  if (cq > 0.02) {
    /* 和玩家同一套两段腿反解：脚钉地面，膝盖自然往前顶 */
    const fF = legIK(2.8 * facing, hipY, 2.8 * facing + 8.5 * facing, 0.4);
    const fB = legIK(-2.6 * facing, hipY, -2.6 * facing - 7 * facing, 0.4);
    swA = lerp(swA, fF.swing, cq); knA = lerp(knA, fF.knee, cq);
    swB = lerp(swB, fB.swing, cq); knB = lerp(knB, fB.knee, cq);
  }

  /* 后腿 / 前腿 */
  drawLeg(-2.6 * facing, hipY, swB, knB, 8.2, tone(dark, 0.82), '#121417', gear);
  drawLeg(2.8 * facing, hipY, swA, knA, 8.8, dark, bootCol, tone(dark, 1.25));

  /* 躯干 */
  ctx.fillStyle = body;
  roundRect(-8.5, shY - 1, 17, 15, 4);
  ctx.fill();
  /* 胸甲板 */
  ctx.fillStyle = bodyMid;
  roundRect(-7, shY + 1, 14, 10, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-7, shY + 6); ctx.lineTo(7, shY + 6);
  ctx.stroke();
  /* 腰带 */
  ctx.fillStyle = gear;
  ctx.fillRect(-8.5, shY + 11.6, 17, 3);
  /* 前缘暖光 */
  ctx.fillStyle = 'rgba(255,190,130,0.10)';
  ctx.fillRect(facing > 0 ? 6.8 : -8.6, shY, 1.7, 12);

  if (melee) {
    /* 冲锋兵：露肩皮甲 + 头巾 */
    ctx.fillStyle = tone(dark, 0.95);
    roundRect(-9.5, shY - 1.5, 7, 9, 3);
    ctx.fill();
    roundRect(2.5, shY - 1.5, 7, 9, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(-4, shY + 2, 2, 8);
  } else {
    /* 肩甲 */
    ctx.fillStyle = tone(dark, 1.1);
    ctx.beginPath();
    ctx.arc(facing * 6, shY + 1.6, boss ? 5.4 : 3.6, 0, Math.PI * 2);
    ctx.fill();
  }

  if (boss) {
    /* 队长：胸甲铆钉 + 警示红条 */
    ctx.fillStyle = '#3a1210';
    roundRect(-8, shY + 2.5, 16, 5.5, 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,90,60,0.85)';
    ctx.fillRect(-5.5, shY + 4, 11, 2.4);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = 'rgba(255,190,150,0.35)';
      ctx.fillRect(-7 + i * 3.4, shY + 1.4, 1.6, 1.6);
    }
    /* 肩刺 */
    ctx.fillStyle = '#c8d2db';
    ctx.beginPath();
    ctx.moveTo(-11, shY - 1);
    ctx.lineTo(-15.5, shY - 7);
    ctx.lineTo(-9, shY - 4);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(11, shY - 1);
    ctx.lineTo(15.5, shY - 7);
    ctx.lineTo(9, shY - 4);
    ctx.closePath();
    ctx.fill();
  }

  /* 头 */
  const headY = -52 + lower;
  ctx.fillStyle = '#d9b48a';
  ctx.beginPath();
  ctx.arc(0, headY, 6.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  ctx.arc(0, headY + 1.2, 6.2, 0.2, Math.PI - 0.2);
  ctx.fill();

  if (melee) {
    /* 红头巾 */
    ctx.fillStyle = tone(body, 0.9);
    ctx.beginPath();
    ctx.arc(0, headY - 0.6, 7.4, Math.PI * 1.02, Math.PI * 1.98);
    ctx.fill();
    ctx.fillRect(-7.4, headY - 1.6, 14.8, 2.8);
    ctx.beginPath();
    ctx.moveTo(-facing * 6, headY - 1);
    ctx.lineTo(-facing * 12, headY + 2.5);
    ctx.lineTo(-facing * 6, headY + 2);
    ctx.closePath();
    ctx.fill();
  } else {
    /* 头盔 */
    ctx.fillStyle = tone(dark, 1.05);
    ctx.beginPath();
    ctx.arc(0, headY - 1, 8.2, Math.PI * 0.99, Math.PI * 2.01);
    ctx.fill();
    ctx.fillRect(-8.2, headY - 1.8, 16.4, 3);
    ctx.fillStyle = tone(dark, 0.86);
    roundRect(facing > 0 ? 1.5 : -10, headY - 3.2, 8.5, 2.3, 1);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.arc(-2.2, headY - 3.6, 5, Math.PI * 1.06, Math.PI * 1.6);
    ctx.fill();
  }

  /*  глаз（红色光点） */
  const ex = facing * 3.4;
  ctx.fillStyle = boss ? 'rgba(255,70,40,1)' : 'rgba(255,90,70,0.92)';
  ctx.beginPath();
  ctx.arc(ex, headY - 0.6, boss ? 2 : 1.5, 0, Math.PI * 2);
  ctx.fill();
  if (boss) {
    ctx.fillStyle = 'rgba(255,60,30,0.25)';
    ctx.beginPath();
    ctx.arc(ex, headY - 0.6, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---- 武器 ---- */
  ctx.save();
  ctx.translate(0, shY + 2.5);
  const meleeSwing = melee ? Math.sin(game.time * 12) * 0.22 : 0;
  ctx.rotate(e.aim + meleeSwing);
  if (facing < 0) ctx.scale(1, -1);

  const kick = Math.min(1, (e.muzzle || 0) * 12);
  ctx.translate(-kick * 1.4, 0);

  if (melee) {
    /* 砍刀 */
    ctx.fillStyle = '#2a2018';
    roundRect(-3, -1.6, 8, 4.5, 1.5);
    ctx.fill();
    const bg = ctx.createLinearGradient(5, -4, 24, 3);
    bg.addColorStop(0, '#e6eef5');
    bg.addColorStop(0.5, '#a9b6c2');
    bg.addColorStop(1, '#7c8792');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(5, -3.4);
    ctx.lineTo(22, -4.6);
    ctx.lineTo(25, -0.4);
    ctx.lineTo(6, 2.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(6, -2.6, 15, 1);
    seg(0, 1.5, 4, 1.2, 6, tone(body, 0.7));
  } else if (e.type === 'gunner' || boss) {
    /* 重机枪 / 链式机炮 */
    const gunLen = boss ? 34 : 27;
    ctx.fillStyle = '#1d2329';
    roundRect(-6, -4, 14, 9, 2.5);
    ctx.fill();
    ctx.fillStyle = '#2b333a';
    roundRect(6, -3, gunLen, 6.5, 2);
    ctx.fill();
    /* 弹鼓 */
    ctx.fillStyle = '#232a31';
    ctx.beginPath();
    ctx.arc(2, 6, boss ? 6.5 : 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3d454e';
    ctx.beginPath();
    ctx.arc(2, 6, boss ? 3.4 : 2.6, 0, Math.PI * 2);
    ctx.fill();
    /* 旋转枪管 */
    const spin = game.time * 9;
    for (let i = 0; i < 3; i++) {
      const oy = Math.sin(spin + i * 2.09) * 2.6;
      ctx.fillStyle = i === 0 ? '#59646f' : '#39424b';
      ctx.fillRect(6, -1.4 + oy, gunLen - 2, 2.2);
    }
    ctx.fillStyle = '#1a2026';
    ctx.fillRect(6 + gunLen - 2, -3, 4, 6);
    /* 前手 */
    seg(1, -2, 16, 2.6, 6.5, tone(body, 0.9));
  } else {
    /* 步兵步枪 */
    ctx.fillStyle = '#20262c';
    roundRect(-8, 0.4, 10, 6, 2);
    ctx.fill();
    ctx.fillStyle = '#2c343b';
    roundRect(-1, -2.2, 18, 6.6, 2);
    ctx.fill();
    ctx.fillStyle = '#3d454e';
    ctx.fillRect(2, -4, 11, 1.8);
    ctx.fillStyle = '#262d34';
    ctx.beginPath();
    ctx.moveTo(6, 4.2);
    ctx.lineTo(13, 4.2);
    ctx.lineTo(14.6, 12);
    ctx.lineTo(8, 12.6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#39424b';
    ctx.fillRect(15, -1.2, 12, 3);
    ctx.fillStyle = '#1a2026';
    ctx.fillRect(26, -1.8, 4, 4.2);
    seg(1, -1.8, 14, 3, 6.2, tone(body, 0.92));
  }

  /* 枪口焰 */
  if ((e.muzzle || 0) > 0) {
    const mx = melee ? 26 : (boss ? 40 : (e.type === 'gunner' ? 32 : 31));
    const rad = boss ? 30 : 22;
    const mg = ctx.createRadialGradient(mx, 0, 1, mx, 0, rad);
    mg.addColorStop(0, 'rgba(255,246,200,0.95)');
    mg.addColorStop(0.4, 'rgba(255,170,60,0.55)');
    mg.addColorStop(1, 'rgba(255,110,0,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mx, 0, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,190,0.85)';
    ctx.beginPath();
    ctx.moveTo(mx - 1, 0);
    ctx.lineTo(mx + 8, -3);
    ctx.lineTo(mx + 5, 0);
    ctx.lineTo(mx + 8, 3);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* ---- 降落伞：空降时头顶张开，落地后收起 ---- */
  const cv = e.chuteVis || 0;
  if (cv > 0.02) {
    const open = Math.min(1, cv * 1.4);
    const bob = Math.sin(game.time * 3.1 + e.x * 0.02) * 1.6;
    const cy = headY - 34 - 16 * open + bob;
    const cw = 40 * open, chh = 17 * open;

    /* 伞绳 */
    ctx.strokeStyle = 'rgba(226,234,240,' + (0.55 * cv).toFixed(2) + ')';
    ctx.lineWidth = 0.9;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cw * 0.42, cy + chh * 0.5);
      ctx.lineTo(-facing * 4 + i * 1.6, headY - 2);
      ctx.stroke();
    }
    /* 伞布：两色分片 */
    for (let i = 0; i < 5; i++) {
      const a0 = Math.PI + (i / 5) * Math.PI;
      const a1 = Math.PI + ((i + 1) / 5) * Math.PI;
      ctx.fillStyle = i % 2 ? 'rgba(206,222,236,0.95)' : 'rgba(120,150,170,0.95)';
      ctx.beginPath();
      ctx.moveTo(0, cy + chh * 0.55);
      ctx.arc(0, cy + chh * 0.5, cw, a0, a1);
      ctx.closePath();
      ctx.fill();
    }
    /* 伞沿高光 */
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 * cv).toFixed(2) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, cy + chh * 0.5, cw, Math.PI, Math.PI * 2);
    ctx.stroke();
  }

  /* 受击红闪 */
  if (e.flash > 0) {
    ctx.globalAlpha = Math.min(0.36, e.flash * 2.2);
    ctx.fillStyle = '#ff6a4a';
    roundRect(-9.5, -60, 19, 60, 6);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 换弹提示：打空后头顶转圈，这是反打窗口的视觉信号 */
  if (e.reloadT > 0) {
    const tm = ENEMY_TYPES[e.type] || {};
    const rp = 1 - clamp(e.reloadT / (tm.reload || 2), 0, 1);
    const ry = e.y - e.h - 19;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.arc(sx, ry, 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,198,112,0.95)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(sx, ry, 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rp);
    ctx.stroke();
  }

  /* 血条与 Boss 名牌：BOSS 的血条交给屏幕顶部的大血条，
     这里只留名牌，避免同一条血上下画两遍。 */
  if (e.hp < e.maxHp && !boss) {
    const bw = 40;
    const by = e.y - h - 8;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(sx - bw / 2 - 1, by - 1, bw + 2, 6, 3);
    ctx.fill();
    const ratio = clamp(e.hp / e.maxHp, 0, 1);
    const hg = ctx.createLinearGradient(sx - bw / 2, 0, sx + bw / 2, 0);
    hg.addColorStop(0, '#ff9066');
    hg.addColorStop(1, '#c95a3a');
    ctx.fillStyle = hg;
    roundRect(sx - bw / 2, by, bw * ratio, 4, 2);
    ctx.fill();
  }
  if (boss) {
    const name = e.name || '重装单位';
    const tint = e.accent === 'fire' ? '#ffb066'
      : e.accent === 'steel' ? '#9fd8ff'
        : '#ff8a7a';
    ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(name, sx + 1, e.y - h - 22);
    ctx.fillStyle = tint;
    ctx.fillText(name, sx, e.y - h - 23);
  }
}

/* ---------------- 尸体 ----------------
   死掉的人不是「啪」一下消失的：膝盖先撑不住往下沉，上身再歪出去，
   落到地上还有一下余震，然后躺一会儿慢慢化掉，血留下来。
   全部由 c.t 一个计时器推 —— 物理层只管位置，动画都在这里。 */
function drawCorpses() {
  for (const c of corpses) {
    const sx = c.x - camera.x;
    if (sx < -150 || sx > W + 150) continue;

    const sc = (c.h || 56) / 56;

    /* 血泊：倒下之后慢慢洇开 */
    const bleed = clamp(c.t / 1.8, 0, 1);
    const bw = 20 * sc * (0.55 + bleed * 0.75);
    ctx.fillStyle = 'rgba(92,18,18,' + (0.40 * bleed).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(sx + c.dir * 6 * sc, c.y + 1.5, bw, 5.4 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(52,10,10,' + (0.26 * bleed).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(sx + c.dir * 2 * sc, c.y + 2, bw * 0.55, 2.8 * sc, 0, 0, Math.PI * 2);
    ctx.fill();

    /* 软倒曲线：0.20s 跪下去 → 0.55s 歪倒 → 之后余震躺稳 */
    const t = c.t;
    let ang, sink, tuck;
    if (t < 0.20) {
      const k = t / 0.20;
      ang = 0.16 * k * k;                 /* 膝盖一软，上身只往前送一点 */
      sink = 10 * k * k;                  /* 高度塌下去 —— 「软」最直观的就是这个 */
      tuck = k;
    } else if (t < 0.55) {
      const k = (t - 0.20) / 0.35;
      const e = k * k * (3 - 2 * k);
      ang = 0.16 + 1.30 * e;
      sink = 10 + 2.5 * e;
      tuck = 1 - 0.3 * e;
    } else {
      const k = t - 0.55;
      /* 落地余震：一次衰减的抖，半秒就停 */
      ang = 1.46 + Math.sin(k * 15) * Math.exp(-k * 4.6) * 0.075;
      sink = 12.5;
      tuck = 0.55;                        /* 躺稳之后腿要摊开一点，蜷着会像还活着 */
    }

    /* 最后 1.2 秒淡出。血泊留在原地 —— 尸体没了，战斗痕迹还在 */
    const fade = clamp(c.life / 1.2, 0, 1);

    /* 大肥鱼有自己的尸体画法：头发铺开、尾巴耷拉、头饰歪掉 */
    if (c.look === 'whale') { drawWhaleCorpse(c, ang, sink, fade); continue; }

    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(sx, c.y);
    ctx.scale(sc, sc);
    ctx.translate(0, -sink * 0.10);
    ctx.rotate(c.dir * ang);

    const body = c.color, dark = c.dark;
    const hipY = -26, shY = -45;

    /* 腿：一条蜷、一条拖着 —— 人倒下时腿不会并得整整齐齐 */
    ctx.strokeStyle = dark;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-3, hipY);
    ctx.lineTo(-7 - 5 * tuck, hipY + 13 - 6 * tuck);
    ctx.lineTo(-1, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(3, hipY);
    ctx.lineTo(9 + 3 * tuck, hipY + 11 - 3 * tuck);
    ctx.lineTo(16, -2);
    ctx.stroke();

    /* 全靴 */
    ctx.fillStyle = '#15171a';
    roundRect(-6, -4, 11, 5, 2); ctx.fill();
    roundRect(12, -6, 11, 5, 2); ctx.fill();

    /* 躯干 */
    ctx.fillStyle = body;
    roundRect(-9, shY, 18, 22, 5);
    ctx.fill();
    /* 背心 */
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    roundRect(-6, shY + 3, 12, 11, 3);
    ctx.fill();
    /* 腰带 */
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.fillRect(-9, hipY - 5, 18, 5);

    /* 手臂：软下去之后摊在地上，一只还搭在身上 */
    ctx.strokeStyle = body;
    ctx.lineWidth = 6.5;
    ctx.beginPath();
    ctx.moveTo(-2, shY + 3);
    ctx.lineTo(-13 - 3 * tuck, shY + 10 + 7 * tuck);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, shY + 3);
    ctx.lineTo(12, shY + 8 + 5 * tuck);
    ctx.lineTo(15, shY + 15);
    ctx.stroke();

    /* 头：脖子是软的，脑袋比肩膀多歪一截 */
    ctx.save();
    ctx.translate(0, shY - 2);
    ctx.rotate(c.dir * 0.30 * clamp(t / 0.55, 0, 1));
    ctx.fillStyle = '#d9b48a';
    ctx.beginPath();
    ctx.arc(0, -6, 6.8, 0, Math.PI * 2);
    ctx.fill();
    /* 头盔歪在一边 */
    ctx.fillStyle = tone(dark, 1.05);
    ctx.beginPath();
    ctx.arc(0, -6.8, 8.2, Math.PI * 0.98, Math.PI * 2.02);
    ctx.fill();
    ctx.fillRect(-8.2, -7.8, 16.4, 3);
    /* 闭上的眼（一道横线，比亮着的红点更像「没了」） */
    ctx.strokeStyle = 'rgba(70,40,34,0.85)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-3.6, -4.4); ctx.lineTo(-1.2, -4.4);
    ctx.moveTo(1.2, -4.4); ctx.lineTo(3.6, -4.4);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}


/* ---------------- 子弹（曳光 + 光晕） ---------------- */
function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    const x = b.x - camera.x;
    const px = b.px - camera.x;
    if (x < -60 || x > W + 60) continue;

    /* 视觉半宽 w 与判定半径 r 是分开的：把线改细不会让子弹变弱。
       飞得越远，弹道越淡 —— 这是「距离」最直观的一条线索。
       淡出参考点按「这把枪自己的射程」取一半：霰弹 400px 就开始虚，
       狙击要飞出 2600px 才看得见衰减 —— 玩家不看数值也知道谁打得远。 */
    const w = b.w || b.r;
    const visRef = b.range > 0 ? b.range * 0.5 : 1100;
    const far = clamp((b.dist || 0) / visRef, 0, 1);
    const fade = 1 - far * 0.45;

    /* 拖尾 */
    const tg = ctx.createLinearGradient(px, b.py, x, b.y);
    tg.addColorStop(0, 'rgba(255,255,255,0)');
    tg.addColorStop(0.55, b.color);
    tg.addColorStop(1, '#fff6d8');
    ctx.strokeStyle = tg;
    ctx.globalAlpha = fade;
    ctx.lineWidth = Math.max(0.8, w * 1.6);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, b.py);
    ctx.lineTo(x, b.y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* 狙击曳光：速度 2700，单帧只走 45px，光靠上面的短拖尾只剩「一个亮点」。
       沿飞行方向往回补一条渐隐光带，才读得出「一道光穿过去」。 */
    if (b.tracer) {
      const L = b.tracerLen || 300;
      const a = Math.atan2(b.vy, b.vx);
      const tx = x - Math.cos(a) * L;
      const ty = b.y - Math.sin(a) * L;
      const lg = ctx.createLinearGradient(tx, ty, x, b.y);
      lg.addColorStop(0, 'rgba(150,200,255,0)');
      lg.addColorStop(0.45, 'rgba(160,212,255,0.22)');
      lg.addColorStop(0.86, 'rgba(205,235,255,0.62)');
      lg.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = Math.max(0.9, w * 1.75);
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x, b.y);
      ctx.stroke();
      /* 白色芯线，让弹道中心更锐 */
      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = Math.max(0.6, w * 0.5);
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(a) * L * 0.55, b.y - Math.sin(a) * L * 0.55);
      ctx.lineTo(x, b.y);
      ctx.stroke();
    }

    /* 火箭尾焰：速度只有 660，飞得慢，尾焰要「连成一片」才像推进器。
       间距按弹体半径取，保证每个圆和上一个重叠；外面再罩一层锥形柔光。 */
    if (b.rocket) {
      const a = Math.atan2(b.vy, b.vx);
      const cx = Math.cos(a), sy = Math.sin(a);
      const len = b.r * 7.4;

      /* 锥形柔光：从弹体往回 110px 逐渐变宽变淡 */
      const fg = ctx.createLinearGradient(x, b.y, x - cx * len, b.y - sy * len);
      fg.addColorStop(0, 'rgba(255,236,180,0.55)');
      fg.addColorStop(0.35, 'rgba(255,176,90,0.30)');
      fg.addColorStop(1, 'rgba(180,110,60,0)');
      ctx.strokeStyle = fg;
      ctx.lineWidth = b.r * 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, b.y);
      ctx.lineTo(x - cx * len, b.y - sy * len);
      ctx.stroke();

      /* 焰芯：重叠的圆，越远越小越暗 */
      for (let k = 1; k <= 7; k++) {
        const d = k * b.r * 1.05;
        const fx = x - cx * d, fy = b.y - sy * d;
        const t = k / 8;
        const al = 0.62 * (1 - t);
        ctx.fillStyle = k <= 3
          ? 'rgba(255,244,200,' + (al * 1.4).toFixed(3) + ')'
          : (k <= 5 ? 'rgba(255,168,72,' + al.toFixed(3) + ')'
                    : 'rgba(150,120,96,' + (al * 0.75).toFixed(3) + ')');
        ctx.beginPath();
        ctx.arc(fx, fy, Math.max(0.8, b.r * (1 - t * 0.85)), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* 弹头光点：光晕跟着「视觉粗细」走，但留一个 12px 的下限，
       否则细子弹在混战里根本找不着弹道从哪来。 */
    const glowR = Math.max(12, w * 6.2);
    const glow = ctx.createRadialGradient(x, b.y, 0, x, b.y, glowR);
    if (b.tracer) {
      /* 狙击用冷白光晕，别和步枪的暖黄混在一起 */
      glow.addColorStop(0, 'rgba(255,255,255,0.98)');
      glow.addColorStop(0.28, 'rgba(196,232,255,0.5)');
      glow.addColorStop(1, 'rgba(120,180,255,0)');
    } else {
      glow.addColorStop(0, 'rgba(255,248,214,0.95)');
      glow.addColorStop(0.32, 'rgba(255,196,110,0.3)');
      glow.addColorStop(1, 'rgba(255,140,40,0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, b.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    /* 实心弹头：一个不到 2px 的亮点，让「一颗子弹」有确定的位置 */
    if (!b.rocket) {
      ctx.fillStyle = b.tracer ? 'rgba(240,250,255,0.95)' : 'rgba(255,246,214,0.92)';
      ctx.beginPath();
      ctx.arc(x, b.y, Math.max(0.9, w * 0.85), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 手雷 ---------------- */
function drawGrenades() {
  for (const g of grenades) {
    const x = g.x - camera.x;
    const under = surfaceBelow(g.x, g.y);
    const gap = clamp((under - g.y) / 160, 0, 1);

    ctx.fillStyle = 'rgba(0,0,0,' + (0.34 * (1 - gap * 0.6)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(x, under + 1, 5.5 * (1 - gap * 0.5), 2.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, g.y);
    ctx.rotate(g.spin);
    /* 弹体 */
    const gg = ctx.createLinearGradient(-5, -6, 5, 6);
    gg.addColorStop(0, '#4e6e46');
    gg.addColorStop(1, '#2c3f28');
    ctx.fillStyle = gg;
    roundRect(-5, -6.5, 10, 13, 4.5);
    ctx.fill();
    /* 刻纹 */
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-4, -2); ctx.lineTo(4, -2);
    ctx.moveTo(-4, 1.5); ctx.lineTo(4, 1.5);
    ctx.stroke();
    /* 保险握片 */
    ctx.fillStyle = '#8d949b';
    roundRect(-1.6, -9.5, 3.2, 4, 1);
    ctx.fill();
    ctx.restore();

    /* 引信闪烁 */
    const blink = 0.45 + Math.sin(game.time * 26) * 0.4;
    const fg = ctx.createRadialGradient(x, g.y - 7, 0, x, g.y - 7, 12);
    fg.addColorStop(0, 'rgba(255,90,50,' + blink.toFixed(2) + ')');
    fg.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(x, g.y - 7, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------------- 燃烧地带（纵火者的燃烧瓶） ---------------- */
function drawFire() {
  for (const f of fires) {
    const x = f.x - camera.x;
    if (x < -180 || x > W + 180) continue;
    const rate = clamp(f.life / f.max, 0, 1);
    /* 快烧完时整块变矮变暗，玩家扫一眼就知道这片火要熄了 */
    const hh = 52 * (0.45 + rate * 0.55);
    const y = f.y;

    /* 焦土：一层压在地面的黑斑，让火焰有「烧过」的落点 */
    const cg = ctx.createRadialGradient(x, y, 2, x, y, f.r);
    cg.addColorStop(0, 'rgba(18,10,6,0.62)');
    cg.addColorStop(0.7, 'rgba(26,14,8,0.34)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(x, y, f.r, f.r * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();

    /* 火墙：加色混合，一排高低不一的火舌随时间抖动 */
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(x, y - hh * 0.35, 4, x, y - hh * 0.35, f.r * 0.95);
    glow.addColorStop(0, 'rgba(255,150,50,' + (0.30 * rate).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(x, y - hh * 0.3, f.r * 0.95, hh * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    const tongues = 7;
    for (let i = 0; i < tongues; i++) {
      const fx = x + (i / (tongues - 1) - 0.5) * f.r * 1.6;
      const wob = Math.sin(game.time * 9 + f.seed + i * 1.7);
      const fh = hh * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(game.time * 7.3 + i * 2.1 + f.seed)));
      const fw = 11 + 5 * wob;
      const tg = ctx.createLinearGradient(0, y, 0, y - fh);
      tg.addColorStop(0, 'rgba(255,120,30,' + (0.55 * rate).toFixed(3) + ')');
      tg.addColorStop(0.45, 'rgba(255,180,70,' + (0.42 * rate).toFixed(3) + ')');
      tg.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(fx - fw / 2, y);
      ctx.quadraticCurveTo(fx - fw * 0.55, y - fh * 0.6, fx + wob * 3, y - fh);
      ctx.quadraticCurveTo(fx + fw * 0.55, y - fh * 0.6, fx + fw / 2, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ---------------- 掉落物 ---------------- */
function drawPickups() {
  for (const pk of pickups) {
    const x = pk.x - camera.x;
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(pk.bob) * 3;
    const health = pk.type === 'health';
    const main = health ? '#5fd98a' : '#ffc857';

    /* 地面光斑 */
    const gy = surfaceBelow(pk.x, pk.y);
    const gg = ctx.createRadialGradient(x, gy, 1, x, gy, 26);
    gg.addColorStop(0, health ? 'rgba(90,240,160,0.30)' : 'rgba(255,200,90,0.30)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(x, gy, 24, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, pk.y + bob);

    /* 外发光 */
    ctx.shadowColor = health ? 'rgba(90,240,150,0.85)' : 'rgba(255,200,80,0.85)';
    ctx.shadowBlur = 16;

    /* 箱体 */
    ctx.shadowBlur = 0;

    ctx.fillStyle = health ? '#1e3d2c' : '#3d3018';
    roundRect(-11, -11, 22, 22, 5);
    ctx.fill();
    ctx.strokeStyle = main;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 内衬高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    roundRect(-9, -9, 18, 8, 4);
    ctx.fill();

    ctx.fillStyle = health ? '#8ff0b0' : '#ffd166';
    if (health) {
      ctx.fillRect(-6.5, -2, 13, 4);
      ctx.fillRect(-2, -6.5, 4, 13);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(-5.5, -1.2, 11, 1.2);
    } else {
      /* 子弹图标 */
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(-6 + i * 4.4, -4, 2.6, 8);
        ctx.beginPath();
        ctx.moveTo(-6 + i * 4.4, -4);
        ctx.lineTo(-4.7 + i * 4.4, -7);
        ctx.lineTo(-3.4 + i * 4.4, -4);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawEffects() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    const x = p.x - camera.x;
    ctx.globalAlpha = a;
    if (p.ring) {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4 * a;
      ctx.beginPath(); ctx.arc(x, p.y, p.size * (1.6 - a), 0, Math.PI * 2); ctx.stroke();
    } else if (p.ball && p.smoke) {
      /* 烟团：普通混合，越散越淡越大 */
      ctx.globalAlpha = a * 0.34;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(x, p.y, p.size * (2.1 - a * 0.8), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a;
    } else if (p.ball) {
      /* 火球：加色柔光，边缘必须透明，否则是个死板的圆 */
      const r = p.size * (2.0 - a * 0.95);
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(x, p.y, 0, x, p.y, r);
      fg.addColorStop(0, 'rgba(255,252,232,0.95)');
      fg.addColorStop(0.30, 'rgba(255,206,110,0.78)');
      fg.addColorStop(0.62, 'rgba(255,132,40,0.34)');
      fg.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  for (const c of casings) {
    ctx.save();
    ctx.translate(c.x - camera.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = clamp(c.life, 0, 1);
    ctx.fillStyle = '#d8b25a';
    ctx.fillRect(-2.5, -1.2, 5, 2.4);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  for (const t of texts) {
    const x = t.x - camera.x;
    const size = t.size || 1;
    ctx.globalAlpha = clamp(t.life * 1.4, 0, 1);
    ctx.font = 'bold ' + Math.round(16 * size) + 'px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3 + (size - 1) * 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(t.str, x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, x, t.y);
  }
  ctx.globalAlpha = 1;
}


/* ---------------- 准星 ---------------- */
/* 准星不是「固定多大的一个圈」，而是「按这把枪的角散布，打到这里时
   子弹可能落在一个多大的范围里」。角散布 × 距离 = 线散布，所以同一个
   圈会随距离自己长大 —— 这就是「瞄准圈随距离变长就变大」。
   同时在准星下方标一个落点：那是子弹真正会到的地方，因为弹道有下坠。 */
function drawCrosshair() {
  const x = input.mx, y = input.my;
  const p = player;
  if (!p) return;

  const wp = WEAPONS[p.weapon] || WEAPONS[0];

  /* 开火点与鼠标的世界距离 —— 散布是按这个距离换算成像素的 */
  const mw = mouseWorld();
  const ox = p.x + Math.cos(p.aim) * 30;
  const oy = p.y - p.h * 0.62 + Math.sin(p.aim) * 30;
  const dist = Math.hypot(mw.x - ox, mw.y - oy);

  /* 姿态修正：蹲下收、瞄准镜再收、空中和跑动散，连射按 bloom 一圈圈张开 */
  let mul = 1 - 0.55 * p.crouch - (p.ads && wp.scope ? 0.42 : 0);
  mul *= 1 + clamp(Math.abs(p.vx) / 560, 0, 0.55);
  if (!p.onGround) mul *= 1.4;
  mul *= 1 + (p.bloom || 0);

  let spread = Math.max(6, aimRadiusPx(wp, dist, mul) + (p.muzzle || 0) * 26);
  if (p.ads && wp.scope) spread = Math.max(5, spread * 0.72);

  /* 下坠：屏幕上的落点比准星低多少像素 */
  const drop = aimDropPx(wp, dist, p.aim);

  /* 超出这把枪的极限射程：子弹飞到 range 就消散，描它也没意义。
     这是「不同枪不同优势」最需要被看见的一刻 —— 换一把枪，圈立刻变回亮的。
     不弹提示框、不出音效，只把准星褪成灰、中间打个叉，玩家自己就懂了。 */
  const over = wp.range > 0 && dist > wp.range;

  /* 圈要「收」回去：那个圈的含义是「按这把枪的散布，子弹会落在这个范围里」。
     超出射程时一颗子弹都到不了这儿，再摊开一个 150px 的灰圈等于在骗人，
     而且 150px 的圈配一个 9px 的叉，乍看像个瞄准气泡、读不出「打不到」。
     所以收成一个小圈，把重点让给中间的叉和下面的字。 */
  const ringR = over ? Math.min(spread, 13) : spread;
  const ringA = over ? 'rgba(150,164,176,0.55)' : 'rgba(255,222,160,0.92)';

  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = ringA;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, y, ringR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = over ? 'rgba(150,164,176,0.28)' : 'rgba(255,222,160,0.55)';
  ctx.beginPath();
  ctx.arc(x, y, ringR + 4, 0, Math.PI * 2);
  ctx.stroke();

  const g = ringR + 3, l = ringR + 9;
  ctx.strokeStyle = over ? 'rgba(160,174,186,0.60)' : 'rgba(255,232,190,0.95)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(x - l, y); ctx.lineTo(x - g, y);
  ctx.moveTo(x + g, y); ctx.lineTo(x + l, y);
  ctx.moveTo(x, y - l); ctx.lineTo(x, y - g);
  ctx.moveTo(x, y + g); ctx.lineTo(x, y + l);
  ctx.stroke();

  /* 超出射程：中心画个叉，正下方标一行「超出射程」。
     字要小、要淡 —— 这是提示，不是报错。
     位置原来在圈的右边，可圈最大 150px、字跟出去 165px，等于飘在别处；
     现在圈收小了、字贴着中心走，两者是同一件事。 */
  if (over) {
    const s = 5.5;
    ctx.strokeStyle = 'rgba(198,126,112,0.90)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
    ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
    ctx.stroke();

    ctx.globalAlpha = 0.82;
    ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    /* 这行字画在 HUD 之前，被两张卡片盖掉一半就等于没有：
       贴到画面底边、或者正好落进左下/右下角卡片里，就翻到准星上面去。 */
    const lx0 = x - 22, lx1 = x + 22, ly = y + ringR + 19;
    const cover =
      (ly > H - 152 && lx1 > W - 320 && lx0 < W - 20) ||   /* 右下：大肥鱼卡片 */
      (ly > H - 112 && lx1 > 20 && lx0 < 320);             /* 左下：指挥官卡片 */
    const ty = (cover || ly > H - 6) ? y - ringR - 11 : ly;
    /* 先压一层深色底再写字：战场上什么背景都有（黄黑警戒条、亮着的路灯），
       10px 的字压在亮处就直接糊掉了。一像素的暗影足够，不用描边那么重。 */
    ctx.fillStyle = 'rgba(8,10,14,0.62)';
    ctx.fillText('超出射程', x + 1, ty + 1);
    ctx.fillStyle = 'rgba(216,158,144,1)';
    ctx.fillText('超出射程', x, ty);
    ctx.globalAlpha = 0.9;
  }

  /* 落点标记：子弹有下坠，所以真正打中的点在这个圈下面。
     下坠小于 5px 就不画了，近身战里那个点只会让人分心。
     超出射程时不画 —— 那里根本没有落点，画了就是在骗人。 */
  if (drop > 5 && !over) {
    const dy = Math.min(drop, 260);
    ctx.strokeStyle = 'rgba(255,180,120,0.30)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(x, y + spread * 0.4);
    ctx.lineTo(x, y + dy - spread * 0.5);
    ctx.stroke();
    ctx.setLineDash([]);

    /* 落点圈：直径 = 同一距离上的散布范围，画成一个扁椭圆像贴在地上 */
    const rx = spread, ry = Math.max(2.5, spread * 0.34);
    ctx.strokeStyle = 'rgba(255,170,110,0.78)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(x, y + dy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,90,0.55)';
    ctx.beginPath();
    ctx.ellipse(x, y + dy, Math.max(1.4, rx * 0.16), Math.max(1, ry * 0.5), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 中心点：超出射程时也褪成灰，不然那颗橙点会把叉盖掉，
     看上去像「准星里有个红点」而不是「这里打不到」。 */
  ctx.fillStyle = over ? 'rgba(150,164,176,0.55)' : 'rgba(255,120,80,0.95)';
  ctx.beginPath();
  ctx.arc(x, y, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';     /* 「超出射程」那行改过对齐，还回去给 HUD 用 */
}


/* ===== hud.js ===== */
'use strict';

/* ==================================================================
   渲染层 3：HUD / 菜单 / 主循环
   ================================================================== */

function bar(x, y, w, h, ratio, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(x, y, w, h, h / 2);
  ctx.fill();
  const rw = w * clamp(ratio, 0, 1);
  if (rw > 1) {
    ctx.fillStyle = color;
    roundRect(x, y, rw, h, h / 2);
    ctx.fill();
  }
}

function drawHUD() {
  const p = player, b = buddy;

  /* --- 玩家卡片 --- */
  ctx.fillStyle = 'rgba(10,16,22,0.62)';
  roundRect(20, H - 112, 300, 92, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,235,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#8fc4f0';
  ctx.fillText('指挥官（你）', 36, H - 86);

  bar(36, H - 78, 268, 12, p.hp / p.maxHp, p.hp / p.maxHp > 0.35 ? '#4fbf7a' : '#e0553f');
  ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#eaf2f8';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, 46, H - 68);

  const wp = WEAPONS[p.weapon];
  const mag = p.mags[p.weapon];
  ctx.textAlign = 'left';
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#e8dcc0';
  ctx.fillText(wp.name, 36, H - 42);

  /* 射程：写在武器名右边，用 px 和战术面板保持同一单位。
     这是「枪与枪的区别」里最该被看见的一项 —— 不写出来，
     玩家只会觉得「这把枪怎么打不着」，而不会想到「这是它的设计」。 */
  if (wp.range > 0) {
    const nameW = ctx.measureText(wp.name).width;
    ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(150,190,220,0.80)';
    ctx.fillText('射程 ' + wp.range, 36 + nameW + 9, H - 42);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 18px Consolas,monospace';
  ctx.fillStyle = p.reloading > 0 ? '#ffb347' : (mag > 0 ? '#f2e6c8' : '#ff5a4a');
  ctx.fillText(p.reloading > 0 ? '装填中' : (mag + ' / ' + wp.mag), 300, H - 40);

  /* 武器槽：按武器表自适应，有几把排几格 */
  const slotW = 48, slotGap = 4;
  for (let i = 0; i < WEAPONS.length; i++) {
    const w2 = WEAPONS[i];
    const sx = 38 + i * (slotW + slotGap), sy = H - 31;
    const on = p.weapon === i;
    ctx.fillStyle = on ? 'rgba(255,200,110,0.92)' : 'rgba(255,255,255,0.13)';
    roundRect(sx, sy, slotW, 17, 4);
    ctx.fill();
    if (!on) {
      ctx.strokeStyle = p.mags[i] > 0 ? 'rgba(255,255,255,0.16)' : 'rgba(255,90,74,0.36)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.font = 'bold 9.5px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = on ? '#1a1208' : (p.mags[i] > 0 ? '#b9c6d2' : '#7a6a5a');
    ctx.fillText((i + 1) + ' ' + w2.short, sx + slotW / 2, sy + 12.5);
  }

  /* --- 大肥鱼卡片 --- */
  /* 卡片高度 92 → 132，改成「一项一行」：
     ① 底部按键提示原来一行约 580px，可用宽度只有 268px，必须拆两行；
     ② 「状态：交战中」和右对齐的「性格 均衡（Q）…」在 268px 里也放不下，实测从中间互相压字。
     下面所有基线都是从 H-20（卡片底边）往上推的，改动时整组一起动。 */
  ctx.fillStyle = 'rgba(10,16,22,0.62)';
  roundRect(W - 320, H - 152, 300, 132, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,170,80,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffb257';
  ctx.fillText('大肥鱼（AI 战友）', W - 304, H - 126);

  bar(W - 304, H - 118, 268, 12, b.hp / b.maxHp, b.hp / b.maxHp > 0.34 ? '#e0a04a' : '#e0553f');
  ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#eaf2f8';
  ctx.fillText(Math.ceil(b.hp) + ' / ' + b.maxHp, W - 296, H - 108);

  const stateText = b.dead ? '阵亡（下波归队）'
    : b.downed ? '倒地！快按住 E 救我'
    : ({ FOLLOW: '跟随', ENGAGE: '交战中', RETREAT: '后撤回血', REVIVE: '赶来救你', HOLD: '守点', GRAB: '去捡补给' }[b.intent] || '待命');
  const cmdText = { follow: '跟随', rush: '突击', hold: '守点' }[b.cmd];
  const styleText = (typeof BUDDY_STYLES !== 'undefined' && BUDDY_STYLES[b.style]) ? BUDDY_STYLES[b.style].name : '均衡';
  ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffd7a3';
  ctx.fillText('状态：' + stateText, W - 304, H - 84);

  ctx.font = '12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#9fb0bf';
  ctx.fillText('性格 ' + styleText + '（Q）·  指令 ' + cmdText + '（C / V / B）', W - 304, H - 64);

  /* 两行按键提示：右对齐 + 自动缩字号兜底，文案以后再长也不会冲出画布 */
  ctx.textAlign = 'right';
  ctx.fillStyle = '#7d8c99';
  const hints = ['G 手雷 · R 换弹 · S 蹲下 · 空格 二段跳',
                 'Shift 冲刺 · E 救大肥鱼 · P 暂停'];
  hints.forEach(function (line, i) {
    let hf = 11;
    ctx.font = hf + 'px "Microsoft YaHei",sans-serif';
    while (ctx.measureText(line).width > 268 && hf > 8.5) {
      hf -= 0.5;
      ctx.font = hf + 'px "Microsoft YaHei",sans-serif';
    }
    ctx.fillText(line, W - 36, H - 42 + i * 16);
  });

  /* --- 顶部关卡 / 波次 --- */
  const th = world.theme;
  ctx.fillStyle = 'rgba(10,16,22,0.55)';
  roundRect(W / 2 - 190, 16, 380, 40, 20);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#e9e2cf';
  ctx.fillText('第 ' + game.stage + ' 关  ·  波次 ' + Math.max(1, game.wave) + ' / ' + game.maxWave, W / 2, 42);
  if (th && th.name) {
    ctx.font = '12px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(233,226,207,0.62)';
    ctx.fillText(th.name, W / 2, 55);
  }

  for (let i = 0; i < game.maxWave; i++) {
    const px = W / 2 - (game.maxWave - 1) * 11 + i * 22;
    ctx.beginPath();
    ctx.arc(px, 66, 4, 0, Math.PI * 2);
    ctx.fillStyle = i < game.wave ? (i === game.maxWave - 1 ? '#ff6b5a' : '#ffc857') : 'rgba(255,255,255,0.2)';
    ctx.fill();
  }

  /* --- 左上信息 --- */
  ctx.textAlign = 'left';
  ctx.font = 'bold 14px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(233,226,207,0.85)';
  ctx.fillText('击杀 ' + game.kills, 24, 34);
  ctx.fillStyle = 'rgba(255,200,120,0.85)';
  ctx.fillText('得分 ' + game.score, 24, 56);

  const alive = enemies.filter(e => !e.dead).length;
  const pending = game.spawnQueue.filter(s => !s.done).length;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,150,130,0.9)';
  ctx.fillText('剩余敌人 ' + (alive + pending), W - 24, 34);

  /* --- 中央提示 ---
     BOSS 入场横幅自己会喊「敌方重装单位接近」，这时候再叠一句波次提示
     两行字会撞在一起，所以横幅期间让路。 */
  if (game.msgTimer > 0 && !game.bossIntro) {
    ctx.globalAlpha = Math.min(1, game.msgTimer);
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px "Microsoft YaHei",sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(game.msg, W / 2, 150);
    ctx.fillStyle = '#ffd9a0';
    ctx.fillText(game.msg, W / 2, 150);
    ctx.globalAlpha = 1;
  }
}

/* ==================================================================
   BOSS 专属血条
   顶部一条长血条 + 名字 + 称号。掉落时有一条「残影」慢慢追下来，
   打空的瞬间能看出这一枪削掉多少血 —— 普通怪的小血条做不到这个。
   ================================================================== */
let bossBarShown = 1;    /* 当前显示的血量比例（平滑追随） */
let bossBarGhost = 1;    /* 白色残影（慢慢追下来） */
let bossBarKey = '';     /* 换 BOSS 时重置 */

const BOSS_ACCENT = {
  red: { a: '#ff7a5a', b: '#b8231f', glow: 'rgba(255,90,60,0.55)' },
  fire: { a: '#ffb066', b: '#a8420c', glow: 'rgba(255,150,50,0.55)' },
  steel: { a: '#9fd8ff', b: '#2b5871', glow: 'rgba(120,200,255,0.5)' }
};

function drawBossBar() {
  const dt = _dt;
  const boss = enemies.find(e => e.boss && !e.dead);
  const intro = game.bossIntro;

  if (!boss && !intro) {
    bossBarShown = bossBarGhost = 1;
    bossBarKey = '';
    return;
  }

  const name = boss ? (boss.name || '重装单位') : intro.name;
  const tag = boss ? (ENEMY_TYPES[boss.type].title || '') : (intro.tag || '');
  const accent = BOSS_ACCENT[(boss ? boss.accent : intro.accent) || 'red'] || BOSS_ACCENT.red;
  const key = name + '|' + tag;
  if (bossBarKey !== key) { bossBarKey = key; bossBarShown = bossBarGhost = 1; }

  const ratio = boss ? clamp(boss.hp / boss.maxHp, 0, 1) : 1;
  /* 入场时血条从 0 涨满，给一个「正在抵达战场」的仪式感 */
  const rise = boss ? 1 : clamp((intro ? intro.t : 0) / 0.7, 0, 1);

  bossBarShown += (ratio - bossBarShown) * Math.min(1, dt * 9);
  bossBarGhost = bossBarGhost > bossBarShown
    ? Math.max(bossBarShown, bossBarGhost - dt * 0.42)
    : bossBarShown;

  /* 宽度 440 是被左侧战术面板「挤」出来的：
     面板占 x 20~392（展开态 372 宽），底板左缘必须 ≥ 392 才不压字。
     520 宽时底板左缘 = 640-260-8 = 372，会和面板重叠 20px，
     名字头两个字正好落在面板背景上。440 宽时底板 412~868，
     左右留白对称，且最长的「钢铁典狱长」+ 称号也排得下。 */
  const bw = 440, bh = 15;
  /* y 位置要让开顶部的关卡药丸（16~56）和波次圆点（66），否则会压住主题名 */
  const bx = W / 2 - bw / 2, by = 106;
  const appear = boss ? 1 : clamp((intro ? intro.t : 0) / 0.35, 0, 1);

  ctx.save();
  ctx.globalAlpha = appear;

  /* 外框底板 */
  ctx.fillStyle = 'rgba(8,12,16,0.78)';
  roundRect(bx - 8, by - 26, bw + 16, 58, 9);
  ctx.fill();
  ctx.strokeStyle = accent.glow;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* 名字 + 称号 */
  ctx.textAlign = 'left';
  ctx.font = 'bold 17px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = accent.a;
  ctx.fillText(name, bx, by - 10);
  if (tag) {
    const nw = ctx.measureText(name).width;
    ctx.font = '11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(210,220,230,0.6)';
    ctx.fillText(tag, bx + nw + 10, by - 10);
  }
  ctx.textAlign = 'right';
  ctx.font = 'bold 11px Consolas,monospace';
  ctx.fillStyle = 'rgba(230,238,245,0.72)';
  ctx.fillText(Math.ceil(ratio * 100) + '%', bx + bw, by - 10);

  /* 血槽 */
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(bx, by, bw, bh, bh / 2);
  ctx.fill();

  /* 残影：宽一圈的浅色，被血量追着走 */
  if (bossBarGhost > bossBarShown + 0.001) {
    ctx.fillStyle = 'rgba(255,235,210,0.42)';
    roundRect(bx, by, bw * bossBarGhost * rise, bh, bh / 2);
    ctx.fill();
  }

  /* 主体血条 */
  const w2 = bw * bossBarShown * rise;
  if (w2 > 1) {
    const g = ctx.createLinearGradient(bx, by, bx, by + bh);
    g.addColorStop(0, accent.a);
    g.addColorStop(0.55, accent.b);
    g.addColorStop(1, accent.a);
    ctx.fillStyle = g;
    roundRect(bx, by, w2, bh, bh / 2);
    ctx.fill();
    /* 顶部高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(bx + 2, by + 2, Math.max(0, w2 - 4), 3.5, 2);
    ctx.fill();
  }

  /* 分段刻度：把长血条切成 10 段，读血更直观 */
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 10; i++) {
    const sx = bx + (bw / 10) * i;
    ctx.beginPath();
    ctx.moveTo(sx, by + 1);
    ctx.lineTo(sx, by + bh - 1);
    ctx.stroke();
  }
  ctx.restore();
}

/* ==================================================================
   BOSS 入场横幅：两道斜切光带夹住名字，从两侧收拢
   ================================================================== */
function drawBossIntro() {
  const bi = game.bossIntro;
  if (!bi) return;

  const p = bi.t / bi.dur;
  /* 0→0.14 推进场，0.14→0.78 停留，之后淡出 */
  const inK = clamp(p / 0.14, 0, 1);
  const outK = clamp((p - 0.82) / 0.18, 0, 1);
  const alpha = inK * (1 - outK);
  const slide = (1 - inK) * 180 + outK * 90;
  const accent = BOSS_ACCENT[bi.accent] || BOSS_ACCENT.red;

  /* 纵向栈（自上而下）：警告 162 / 光带 178 / 名字 234 / 称号 266 / 光带 278
     每个元素都算好占位，光带只夹在名字外面的空隙里，不压字。 */
  const cy = 224;

  ctx.save();
  ctx.globalAlpha = alpha;

  /* 两条斜切光带：从中间向两侧展开，夹住名字。
     用加色混合，光带才会「亮」而不是画一条深色横杠。 */
  const bandW = (W / 2 + 120) * inK;
  const drawBand = (top) => {
    ctx.beginPath();
    ctx.moveTo(W / 2 - bandW, cy + top);
    ctx.lineTo(W / 2 + bandW, cy + top - 8);
    ctx.lineTo(W / 2 + bandW, cy + top + 6);
    ctx.lineTo(W / 2 - bandW, cy + top + 14);
    ctx.closePath();
    const g = ctx.createLinearGradient(W / 2 - bandW, 0, W / 2 + bandW, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.16, accent.glow);
    g.addColorStop(0.5, 'rgba(255,138,96,0.95)');
    g.addColorStop(0.84, accent.glow);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fill();
  };
  ctx.globalCompositeOperation = 'lighter';
  drawBand(-46);
  drawBand(54);

  /* 光带边缘补一条细亮线，让斜切更有金属感 */
  ctx.strokeStyle = accent.a;
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = alpha * 0.75;
  for (const top of [-46, 60]) {
    ctx.beginPath();
    ctx.moveTo(W / 2 - bandW, cy + top);
    ctx.lineTo(W / 2 + bandW, cy + top - 8);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;

  /* 名字：大字 + 描边阴影 */
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px "Microsoft YaHei",sans-serif';
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(0,0,0,0.72)';
  ctx.strokeText(bi.name, W / 2 - slide * 0.4, cy + 10);
  ctx.fillStyle = '#fff4e2';
  ctx.fillText(bi.name, W / 2 - slide * 0.4, cy + 10);

  /* 称号 */
  ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeText(bi.tag, W / 2 + slide * 0.4, cy + 42);
  ctx.fillStyle = accent.a;
  ctx.fillText(bi.tag, W / 2 + slide * 0.4, cy + 42);

  /* 顶部小字：警告 */
  const blink = 0.55 + 0.45 * Math.sin(bi.t * 14);
  ctx.globalAlpha = alpha * blink;
  ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ff6b5a';
  ctx.fillText('▲  敌 方 重 装 单 位 接 近  ▲', W / 2, cy - 62);

  ctx.restore();
}

/* ==================================================================
   全屏白闪（BOSS 击破 / 入场共用）
   ================================================================== */
function drawScreenFlash() {
  const f = game.screenFlash || 0;
  if (f <= 0.001) return;
  ctx.fillStyle = 'rgba(255,244,228,' + (clamp(f, 0, 1) * 0.62).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

/* ==================================================================
   大肥鱼战术面板：把他的思考过程真的画出来（Tab 收起 / 展开）
   ================================================================== */
const INTENT_COLOR = {
  ENGAGE: '#ff9a5c', RETREAT: '#e0553f', REVIVE: '#7ef0b0',
  GRAB: '#6fc2ff', FOLLOW: '#a8bccb', HOLD: '#ffd166'
};

function drawAIPanel() {
  const b = buddy;
  if (!b) return;

  const x = 20, y = 76, w = 372;
  const t = game.tele;
  const acc = t.buddyShots > 0 ? Math.min(100, Math.round(t.buddyHits / t.buddyShots * 100)) : 0;
  const intent = b.dead ? '阵亡' : (b.downed ? '倒地' : (INTENT_NAMES[b.intent] || '待命'));
  const icolor = b.dead || b.downed ? '#e0553f' : (INTENT_COLOR[b.intent] || '#a8bccb');

  /* --- 收起状态：一条横条 --- */
  if (!aiPanelOpen) {
    ctx.fillStyle = 'rgba(10,16,22,0.62)';
    roundRect(x, y, 316, 26, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,170,80,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = icolor;
    ctx.fillText('大肥鱼 AI · ' + intent + (t.buddyShots ? ' · 命中 ' + acc + '%' : ''), x + 10, y + 18);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#64798a';
    ctx.fillText('Tab 展开', x + 306, y + 18);
    return;
  }

  const threat = b.dead || b.downed ? { count: 0 } : scanIncoming(b, 0.45);
  const tg = b.target;
  const logs = b.log.slice(-3);
  /* 高度按实际内容算：标题 46 + 5 行 × 20 + 日志标题 14 + 日志行 × 17 + 底部留白 14 */
  const h = 46 + 20 * 5 + 14 + 17 * Math.max(1, logs.length) + 14;

  ctx.fillStyle = 'rgba(10,16,22,0.70)';
  roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,170,80,0.28)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 标题栏 */
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffb257';
  ctx.fillText('大肥鱼 · 战术面板', x + 12, y + 20);
  ctx.textAlign = 'right';
  ctx.font = '10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#64798a';
  ctx.fillText('决策 ' + t.decisions + ' 次 · 0.15s/次 · Tab 收起', x + w - 12, y + 20);

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 28);
  ctx.lineTo(x + w - 10, y + 28);
  ctx.stroke();

  let ly = y + 46;
  const line = (label, value, color, gap) => {
    ctx.textAlign = 'left';
    ctx.font = '10px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#6e8393';
    ctx.fillText(label, x + 12, ly);
    ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = color || '#dfe9f1';
    ctx.fillText(value, x + 76, ly);
    ly += gap || 20;
  };

  line('当前意图', intent + '　' + (b.reason || ''), icolor);

  line('锁定目标', tg
    ? (ENEMY_TYPES[tg.type].name + '　距 ' + Math.round(Math.abs(tg.x - b.x)) + 'px　剩 ' + Math.round(tg.hp) + 'HP')
    : '（视野内无敌人）', tg ? '#ffd7a3' : '#7d8c99');

  line('弹药武器', WEAPONS[b.weapon].name + (b.reloading > 0 ? '　装填中' : '　' + b.mags[b.weapon] + ' 发'),
    b.reloading > 0 ? '#ffb347' : '#dfe9f1');

  line('弹道预警', threat.count > 0
    ? ('⚠ ' + threat.count + ' 发正对着我（' + threat.minT.toFixed(2) + 's）')
    : '无来袭弹道', threat.count > 0 ? '#ff6b5a' : '#6f8a7d');

  line('本关战绩', '命中 ' + acc + '%　伤害 ' + Math.round(t.buddyDmg) + '　击杀 ' + t.buddyKills,
    acc >= 45 ? '#7ef0b0' : '#dfe9f1');

  /* 决策日志 */
  ctx.textAlign = 'left';
  ctx.font = '10px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#5d7183';
  ctx.fillText('决策日志  躲弹 ' + t.dodges + ' 次 · 手雷 ' + t.grenades + ' 颗', x + 12, ly - 3);
  ly += 14;

  for (let i = 0; i < logs.length; i++) {
    const e = logs[i];
    ctx.textAlign = 'left';
    ctx.font = '10px Consolas,monospace';
    ctx.fillStyle = '#4f6272';
    ctx.fillText(e.t.toFixed(1) + 's', x + 12, ly);
    ctx.font = '11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = i === logs.length - 1 ? '#c8d6e0' : '#7e90a0';
    ctx.fillText(e.text.length > 26 ? e.text.slice(0, 26) + '…' : e.text, x + 56, ly);
    ly += 17;
  }
}

function render() {
  if (game.state === 'title') { drawTitle(); return; }
  if (!player) { drawBackground(); return; }

  ctx.save();
  const sh = camera.shake;
  if (sh > 0.2) ctx.translate(rand(-sh, sh), rand(-sh, sh) * 0.7);

  /* 世界层：整体缩放（震屏之后再缩放，保证抖动幅度一致） */
  ctx.translate(0, CAM_TY);
  ctx.scale(VIEW_ZOOM, VIEW_ZOOM);

  drawBackground();
  drawPlatforms();
  drawProps();
  drawCovers();
  drawBlocks();
  drawHazardBases();   /* 地刺 / 喷火口的铁口贴地画 */
  drawFire();          /* 火焰地带贴地画，必须压在士兵脚下 */
  drawPickups();
  drawGrenades();

  /* 尸体压在活人下面：人踩在尸体上走过去，不会「浮」在尸堆上面 */
  drawCorpses();

  for (const e of enemies) drawEnemy(e);
  if (buddy) drawSoldier(buddy, true);
  if (player) drawSoldier(player, false);

  drawHazardFire();    /* 火柱盖在人身上，才有被吞进火里的感觉 */
  drawBullets();
  drawEffects();
  drawDecals();
  ctx.restore();

  drawThemeGrade();
  drawVignette();

  drawHUD();
  drawBossBar();
  if (game.state !== 'title') drawAIPanel();
  drawBossIntro();
  drawScreenFlash();

  if (game.state === 'playing') drawCrosshair();
  if (game.state === 'paused') {
    overlay(0.5);
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('已暂停', W / 2, H / 2);
    ctx.font = '18px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#b8c8d4';
    ctx.fillText('按 P 或 Esc 继续', W / 2, H / 2 + 44);
  }
  if (game.state === 'stageclear') {
    const nt = STAGE_THEMES[game.stage % STAGE_THEMES.length];
    drawCenterCard('第 ' + game.stage + ' 关 完成', '#7ef0b0',
      '本关击杀 ' + game.kills + '   总得分 ' + game.score,
      '按 Enter 进入第 ' + (game.stage + 1) + ' 关 · ' + (nt ? nt.name : '下一战区'));
  }
  if (game.state === 'gameover') {
    drawCenterCard('任务失败', '#ff6b6b',
      '你在第 ' + game.stage + ' 关第 ' + Math.max(1, game.wave) + ' 波倒下，大肥鱼没能赶上',
      '按 Enter 重新挑战本关');
  }
}

/* ---------------- 主循环 ---------------- */
let _last = performance.now();
/* 渲染层也需要知道这一帧过了多久（血条平滑、横幅计时都要用） */
let _dt = 0;

function frame(ts) {
  let dt = (ts - _last) / 1000;
  _last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  _dt = dt;

  if (game.state === 'playing') {
    update(dt);
  } else {
    game.time += dt;
    sayCooldown = Math.max(0, sayCooldown - dt);
    if (game.state !== 'title') updateEffects(dt);

    /* BOSS 击破的慢动作 / 白闪 / 入场横幅在结算卡片上必须继续走完，
       否则玩家在 stageclear 界面会看到一片永久残留的白屏。 */
    if (game.slowmo > 0) game.slowmo = Math.max(0, game.slowmo - dt);
    game.screenFlash = Math.max(0, (game.screenFlash || 0) - dt * 1.5);
    if (game.bossIntro) {
      game.bossIntro.t += dt;
      if (game.bossIntro.t >= game.bossIntro.dur) game.bossIntro = null;
    }
  }

  render();
  requestAnimationFrame(frame);
}

resizeCanvas();
requestAnimationFrame(frame);


</script>

<div id="diag" style="position:fixed;left:8px;top:8px;z-index:99;padding:8px 10px;
  background:rgba(0,0,0,.82);border:1px solid #4a6a8a;border-radius:4px;
  font:15px/1.5 Consolas,monospace;color:#7fe3ff;white-space:pre;pointer-events:none"></div>
<script>
/* ===== 单文件地形验收脚本（仅测试用，不改原产物） ===== */
(function () {
  var log = [];
  var box = document.getElementById('diag');
  function show(err) {
    box.style.color = err ? '#ff8a8a' : '#7fe3ff';
    box.textContent = log.join('\n') + (err ? '\n!! ' + err : '');
  }
  try {
    var q = new URLSearchParams(location.search);
    var STAGE = Number(q.get('s') || 2);
    var VIEW = q.get('v') || 'pit';

    log.push('single-file  stage=' + STAGE + '  view=' + VIEW);

    startStage(STAGE);
    aiPanelOpen = false;
    game.wave = 2;
    game.waveActive = false;
    game.spawnQueue = [];
    enemies.length = 0;
    game.state = 'playing';

    var target = null;
    if (VIEW === 'pit')        target = world.pits[0];
    else if (VIEW === 'wind')  target = world.winds[0];
    else                       target = world.hazards.filter(function (h) { return h.kind === VIEW; })[0]
                                     || world.hazards[0];

    log.push('pits=' + world.pits.length + '  winds=' + world.winds.length + '  haz=' + world.hazards.length);
    log.push('target=' + (target ? target.kind + ' @' + Math.round(target.x) + ' w' + Math.round(target.w) : 'NONE'));
    if (target) {
      log.push('groundAt(center)=' + groundAt(target.x + target.w * 0.5)
             + '  surfaceBelow=' + Math.round(surfaceBelow(target.x + target.w * 0.5, 0)));
    }

    if (target) {
      var cx = target.x + target.w * 0.5;
      var px = cx - 150;
      for (var d = 0; d < 420 && !groundAt(px); d += 6) px -= 6;
      player.x = px; player.y = world.groundY; player.onGround = true; player.vx = 0;
      player.vy = 0; player.plat = null; player.hp = player.maxHp; player.downed = false;
      player.facing = 1; player.aim = 0;
      buddy.x = px - 90; buddy.y = world.groundY; buddy.onGround = true;
      buddy.vx = 0; buddy.vy = 0; buddy.plat = null;
      buddy.cmd = 'hold'; buddy.holdX = buddy.x;
    }
    input.mx = 900; input.my = 300;

    for (var i = 0; i < 4; i++) update(1 / 60);

    if (VIEW === 'pit') {
      player.x = target.x - player.w * 0.5 - 6;
      player.y = world.groundY; player.onGround = true; player.vy = 0;
      buddy.x = player.x - 74; buddy.y = world.groundY; buddy.onGround = true;
    } else if (VIEW === 'wind') {
      player.x = target.x + target.w * 0.5;
      doJump(player);
      for (var j = 0; j < 26; j++) update(1 / 60);
      log.push('气流托举后 player.y=' + Math.round(player.y) + '（平地 600）');
    } else if (VIEW === 'flame') {
      for (var m = 0; m < world.hazards.length; m++) {
        if (world.hazards[m].kind === 'flame') { world.hazards[m].t = world.hazards[m].period - 0.30; world.hazards[m].firing = 1; }
      }
    }
    player.vx = 0; buddy.vx = 0;

    if (target) camera.x = Math.max(0, target.x + target.w * 0.5 - VIEW_W * 0.5);
    camera.shake = 0;
    game.msg = ''; game.msgTimer = 0;
    buddy.bubbleTimer = 0; buddy.bubble = "";
    for (var k = 0; k < texts.length; k++) texts[k].life = 0;

    /* 冻住逻辑，只留渲染 */
    update = function () {};

    log.push('camera.x=' + Math.round(camera.x) + '  playerY=' + Math.round(player.y));
    log.push('airJumps=' + player.airJumps + '/' + player.maxAirJumps
           + '  JUMP_V2=' + JUMP_V2 + '  FALL_DEPTH=' + FALL_DEPTH);
    log.push('pits: ' + world.pits.map(function (p) { return p.kind + '@' + Math.round(p.x) + '+' + Math.round(p.w); }).join('  '));
    log.push('winds: ' + world.winds.map(function (w) { return '@' + Math.round(w.x) + '+' + Math.round(w.w); }).join('  '));
    log.push('player.x=' + Math.round(player.x));

    /* 把目标框出来：单文件环境里最容易出问题的是「渲染层看不到这个物件」，
       一个洋红框就能分清「没画」和「画在别处」 */
    var _render = render;
    render = function () {
      _render();
      if (!target || !q.get('dbg')) return;
      ctx.save();
      ctx.translate(0, CAM_TY);
      ctx.scale(VIEW_ZOOM, VIEW_ZOOM);
      ctx.strokeStyle = '#ff00ff';
      ctx.lineWidth = 3;
      ctx.strokeRect(target.x - camera.x, world.groundY - 8, target.w, 64);
      ctx.fillStyle = '#ff00ff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(target.kind, target.x - camera.x + 4, world.groundY - 16);
      ctx.restore();
    };

    show(null);
  } catch (e) {
    show(e && (e.message + ' @' + (e.stack || '').split('\n')[1] || e));
  }
})();
</script>
